name: daily digest

on:
  schedule:
    - cron: "30 11 * * *"   # 08:30 BRT
  workflow_dispatch:
    inputs:
      force:
        description: "Refazer o digest de hoje"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "topics/**", "functions/**", "server/**", "src/pawatch/render.py", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: src
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -q

      - name: Collect + curate
        if: github.event_name != 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PAW_MODEL: ${{ vars.PAW_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_AGENT_ID: ${{ secrets.ELEVENLABS_AGENT_ID }}
        run: python -m pawatch run ${{ inputs.force && '--force' || '' }}

      - name: Render (site-only changes)
        if: github.event_name == 'push'
        run: python -m pawatch render

      - name: Feedback (Cloudflare KV → data/<tema>/feedback.json + wrangler.toml)
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: python -m pawatch feedback

      - name: Commit
        if: github.event_name != 'push'
        run: |
          git config user.name "pa-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digests INDEX.md
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -q -m "digest: $(date -u +%F)"
          git push -q

      - name: Discord (opcional)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m pawatch notify

      - name: Ensure Cloudflare Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true  # fails harmlessly when the project already exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT || 'people-analytics-watch' }} --production-branch=main

      - name: Sync Pages secrets (site password, HF token for the AI box)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'people-analytics-watch' }}
        run: |
          [ -n "$SITE_PASSWORD" ] && printf '%s' "$SITE_PASSWORD" | npx -y wrangler@3 pages secret put SITE_PASSWORD --project-name="$PROJECT"
          [ -n "$HF_TOKEN" ] && printf '%s' "$HF_TOKEN" | npx -y wrangler@3 pages secret put HF_TOKEN --project-name="$PROJECT"
          true

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'people-analytics-watch' }} --branch=main --commit-dirty=true
