<!doctype html>
<html lang="pt-BR">
<head>

<link rel="stylesheet" href="carteira.css">
</head>
<body>
<header class="top">
  <a class="switch" href="#/temas" id="switch" aria-label="Ver todos os temas">
    <span class="mini-stack" aria-hidden="true"><i></i><i></i><i></i></span>
    <span><b id="topicName">Research Watch</b><span class="s" id="topicSub">Carregando…</span></span>
  </a>
  <span class="sp"></span>
  <a class="ib back" href="../../" title="Voltar ao site atual" aria-label="Voltar ao site atual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M10 6l-6 6 6 6M4 12h16" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Voltar ao site atual</span></a>
  <button class="ib" id="themeBtn" aria-label="Alternar tema claro/escuro"></button>
  <a class="ib" href="../../#/busca" aria-label="Buscar no site atual" title="Buscar no site atual"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg></a>
</header>
<main id="app" tabindex="-1"><p class="loading">Carregando…</p></main>
<nav class="dock" aria-label="Seções">
  <a href="#/" data-nav="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="3"/><path d="M3.5 10h17" /></svg>Início</a>
  <a href="#/novidades" data-nav="novidades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5" stroke-linecap="round"/></svg>Novidades</a>
  <a href="#/evolucao" data-nav="mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 19a9 9 0 0 1 18 0" /><path d="M7 19a5 5 0 0 1 10 0"/><circle cx="15.5" cy="11" r="1.6" fill="currentColor" stroke="none"/></svg>Mapa</a>
  <a href="#/pergunte" data-nav="pergunte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 1 3.2 6.1L4 19.5l1.2-3.6A7.4 7.4 0 0 1 4.5 12z" stroke-linejoin="round"/></svg>Pergunte</a>
  <a href="#/mais" data-nav="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/></svg>Mais</a>
</nav>
<dialog class="sheet" id="sheet"><div class="sh-in" id="shIn"></div></dialog>
<div class="orb" id="orb" role="dialog" aria-label="Ouvindo">
  <button type="button" class="ball" id="orbBall" aria-label="Terminar e transcrever"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" stroke-linecap="round"/></svg></button>
  <p id="orbText">Pode falar…</p>
  <p class="hint" id="orbHint">Toque na bola quando terminar</p>
  <button class="btn sec2 x" id="orbX" type="button">Cancelar</button>
</div>
<div aria-live="polite" class="vh" id="live"></div>
<script src="carteira.js"></script>
</body>
</html>
