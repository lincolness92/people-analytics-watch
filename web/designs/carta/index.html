<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Carta · Research Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* before first paint: skin (?skin= or the saved choice, default "papel"), light/dark (?theme= or saved), and the skin's fonts */
window.CARTA_FONTS = {
  papel: "https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap",
  grafite: "https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap",
  oceano: "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400..700&display=swap",
  carta: "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap"
};
(function () {
  var sk = null, t = null, q = null;
  try { q = new URLSearchParams(location.search); } catch (e) { /* very old browser */ }
  try { sk = (q && q.get("skin")) || localStorage.getItem("carta-skin"); t = (q && q.get("theme")) || localStorage.getItem("carta-theme"); } catch (e) { /* storage blocked */ }
  if (!sk || !window.CARTA_FONTS[sk]) sk = "papel";
  try { if (q && q.get("skin") === sk) localStorage.setItem("carta-skin", sk); } catch (e) { /* storage blocked */ }
  var h = document.documentElement;
  h.setAttribute("data-skin", sk);
  if (t && t !== "auto") h.setAttribute("data-theme", t);
  var l = document.createElement("link"); l.rel = "stylesheet"; l.id = "skin-font"; l.href = window.CARTA_FONTS[sk];
  document.head.appendChild(l);
})();
</script>
<link rel="stylesheet" href="carta.css">
</head>
<body>
<header class="top">
  <div class="wrap row">
    <a class="brand" href="#/temas" aria-label="Trocar de tema">
      <svg width="26" height="26" viewBox="-13 -13 26 26" fill="none" stroke="currentColor" aria-hidden="true"><circle r="11.5" stroke-width="1.2"/><circle r="6.5" stroke-width=".9" stroke-dasharray="1.6 2"/><path d="M0 0 7.8 -8.4" stroke-width="1.4"/><circle r="1.7" fill="currentColor" stroke="none"/><circle cx="-4.5" cy="3.5" r="1.5" fill="var(--mag)" stroke="none"/></svg>
      <span><b id="brand-t">Research</b> <i id="brand-em">Watch</i></span>
      <svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
    </a>
    <nav aria-label="Seções" id="nav-d"></nav>
    <div class="tools">
      <a class="ico-b" id="search-b" href="#/busca" aria-label="Buscar"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg></a>
      <button class="ico-b" id="skin-b" aria-label="Aparência"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 2.5a7.5 7.5 0 1 0 0 15c1.2 0 1.6-.8 1.3-1.7-.4-1 .2-2 1.3-2h1.6a3.3 3.3 0 0 0 3.3-3.3C17.5 6 14.1 2.5 10 2.5z"/><circle cx="6.3" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="6" r="1" fill="currentColor"/><circle cx="12.8" cy="6.6" r="1" fill="currentColor"/></svg></button>
      <button class="ico-b" id="theme-b" aria-label="Alternar claro e escuro"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5v13" /><path d="M10 3.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </div>
  <div class="status"><div class="wrap mono" id="status"><a class="back" href="../../">Voltar ao site atual</a></div></div>
</header>
<main id="app" class="wrap"><p class="loading mono">Carregando…</p></main>
<nav class="tab" id="tab" aria-label="Navegação principal"></nav>
<dialog id="sheet" aria-label="Painel"></dialog>
<div id="tip" role="tooltip"></div>
<script src="carta.js"></script>
</body>
</html>
