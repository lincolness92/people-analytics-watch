<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Watch</title>
  <meta name="description" content="Digest de pesquisa state-of-the-art.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --ink: #1d1b18;
  --ink-2: #4a463f;
  --muted: #807a70;
  --line: #e4dfd5;
  --accent: #b4431f;
  --accent-soft: #f6e4dc;
  --star: #a8730b;
  --star-soft: #f7ecd2;
  --chip: #efebe3;
  --score-hi: #1f6f4a;
  --score-mid: #8a6d12;
  --score-lo: #7a746a;
  --serif: "Iowan Old Style", "Charter", "Source Serif Pro", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513;
    --surface: #1f1d1a;
    --ink: #ece8e1;
    --ink-2: #c4beb3;
    --muted: #8f897f;
    --line: #34312c;
    --accent: #ec8a63;
    --accent-soft: #3a2519;
    --star: #e2b24f;
    --star-soft: #382c14;
    --chip: #2a2824;
    --score-hi: #6fcf9c;
    --score-mid: #e2c25b;
    --score-lo: #9d978d;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
}
a { color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }

/* header */
.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.brand em { color: var(--accent); font-style: italic; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs a {
  text-decoration: none; font-size: 14px; color: var(--ink-2);
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}
.tabs a:hover { background: var(--chip); }
.tabs a.active { background: var(--ink); color: var(--bg); }
.trends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 8px; }
.trend-card { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.trend-card p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.geo { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 22px; margin-bottom: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr 90px 40px; gap: 8px; align-items: center; font-size: 14px; margin-bottom: 6px; }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.small { font-size: 12px; }
table.growth { width: 100%; border-collapse: collapse; font-size: 14px; }
table.growth th, table.growth td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.growth td:nth-child(n+2), table.growth th:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--score-hi); font-weight: 600; } .down { color: var(--score-lo); font-weight: 600; }
.year-chips { margin-bottom: 6px; }
.region-tag { font-size: 12px; font-weight: 600; white-space: nowrap; }
.region-chips { margin: -8px 0 18px; }
.topic-switch { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; max-width: 100%; }

main { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }

/* digest header */
.day-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.day-nav button, .day-nav select {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.day-nav button:disabled { opacity: .35; cursor: default; }
h1.day {
  font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5vw, 40px);
  line-height: 1.15; margin: 10px 0 6px; letter-spacing: -0.01em;
}
.dek { color: var(--ink-2); margin: 0 0 22px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* trend callout */
.trend {
  background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; margin: 0 0 32px;
  font-family: var(--serif); font-size: 17px; line-height: 1.55;
}
.trend .label { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* theme sections */
.theme-h {
  font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2); margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 12px;
}
.card.watch { border-left: 3px solid var(--star); }
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.card h3 { font-family: var(--serif); font-size: 19px; line-height: 1.3; margin: 0; font-weight: 600; flex: 1; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.score {
  flex: none; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
}
.score.hi { color: var(--score-hi); }
.score.mid { color: var(--score-mid); }
.score.lo { color: var(--score-lo); }
.meta { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.meta .star { color: var(--star); background: var(--star-soft); padding: 1px 7px; border-radius: 999px; font-weight: 600; margin-right: 4px; }
.summary { margin: 0; color: var(--ink-2); }
.summary strong { color: var(--ink); }
.orig { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

.quick { margin-top: 30px; }
.quick ul { padding-left: 18px; margin: 0; }
.quick li { margin-bottom: 8px; color: var(--ink-2); }
.quick li a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }

/* filters */
.filters { display: grid; gap: 12px; margin-bottom: 22px; }
.search {
  width: 100%; font: inherit; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--chip); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.filter-row input[type=range] { accent-color: var(--accent); }
.count { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.date-tag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* trends timeline */
.timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 20px; }
.tl-item { position: relative; margin-bottom: 24px; }
.tl-item::before {
  content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
}
.tl-item a.d { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.tl-item p { margin: 4px 0 0; font-family: var(--serif); font-size: 17px; }

/* watchlist */
.wl-section { margin-bottom: 36px; }
.wl-section h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 4px; }
.region-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 22px 0 10px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.person .n { font-weight: 650; }
.person .i { font-size: 13px; color: var(--muted); }
.person .a { font-size: 13px; color: var(--accent); margin-top: 4px; }
.person .w { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.person .l { font-size: 12px; margin-top: 6px; display: flex; gap: 10px; }
.person .l a { color: var(--muted); }
.person .hits { font-size: 12px; margin-top: 6px; color: var(--star); font-weight: 600; }
.list-simple { padding-left: 18px; }
.list-simple li { margin-bottom: 8px; color: var(--ink-2); }
.list-simple li b { color: var(--ink); }
.list-simple .hits { font-size: 12px; color: var(--star); font-weight: 600; white-space: nowrap; }

.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 16px; padding-bottom: 32px; border-top: 1px solid var(--line); }

@media (max-width: 560px) {
  .card { padding: 14px; }
  .card h3 { font-size: 17px; }
  .brand { font-size: 18px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chip { white-space: nowrap; }
}

/* evolution */
.evo-chips { margin-bottom: 22px; }
.evo { position: relative; margin-left: 6px; border-left: 2px solid var(--line); padding-left: 22px; }
.era { position: relative; margin-bottom: 38px; }
.era::before {
  content: ""; position: absolute; left: -30px; top: 4px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--bg);
}
.era-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.era-title { font-family: var(--serif); font-size: 24px; line-height: 1.2; margin: 4px 0 8px; }
.era-summary { color: var(--ink-2); margin: 0 0 16px; }
.era-none { font-size: 14px; }
.ms-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ms { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.ms-year { flex: none; font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 44px; }
.ms-body { min-width: 0; }
.ms-title { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.3; text-decoration: none; }
.ms-title:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ms .meta { margin: 4px 0 6px; }
.ms-theme { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 1px 9px; }
.now { margin-top: 10px; }
.now p { color: var(--ink-2); }
.now-q { font-size: 15px; margin: 16px 0 6px; }
@media (max-width: 560px) {
  .evo { padding-left: 16px; }
  .era::before { left: -24px; }
  .ms { flex-direction: column; gap: 4px; padding: 12px 14px; }
}
.changes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 0 0 20px; }
.changes summary { cursor: pointer; font-size: 14px; color: var(--ink-2); }
.changes p { margin: 10px 0 6px; color: var(--ink-2); }
.changes ul { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.changes li { margin-bottom: 4px; }
.chg-add { color: var(--score-hi); font-weight: 700; }
.chg-del { color: var(--accent); font-weight: 700; }
.ms-new { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--bg); background: var(--score-hi); border-radius: 999px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; }

.person .status { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; }
.person.hist { background: var(--chip); }
.wl-note { margin: 0 0 12px; font-size: 14px; }

/* feedback */
.fb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.fb-btn { font: inherit; font-size: 14px; line-height: 1; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; filter: grayscale(1); opacity: .7; }
.fb-btn:hover { opacity: 1; filter: none; }
.fb-btn[aria-pressed="true"] { filter: none; opacity: 1; background: var(--accent-soft); border-color: var(--accent); }
.fb-link { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.fb-msg { font-size: 13px; color: var(--muted); }
.fb-form { flex-basis: 100%; display: grid; gap: 8px; margin-top: 4px; }
.fb-form textarea, .fb-form input { font: inherit; font-size: 14px; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.fb-row { display: flex; gap: 8px; }
.fb-row input { flex: 1; min-width: 0; }
.fb-row button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); cursor: pointer; }
.fb-row button:disabled { opacity: .5; }
.fb-box { display: block; margin-top: 36px; }
.fb-box .fb-msg { display: block; margin-top: 6px; }
.fb-form[hidden] { display: none; }

/* ask */
.ask-examples { margin-bottom: 18px; }
.ask-examples .chip { text-align: left; white-space: normal; }
.ask-form { display: grid; gap: 8px; margin-top: 18px; }
.ask-form textarea { font: inherit; width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.ask-form .fb-row { align-items: center; }
.ask-hint { flex: 1; font-size: 13px; }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.qa .q { font-weight: 650; margin-bottom: 8px; }
.qa .a p { margin: 0 0 10px; color: var(--ink-2); }
.cite { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; vertical-align: 2px; margin-left: 1px; }
.qa-src { font-size: 13px; padding-left: 22px; margin: 6px 0 0; color: var(--ink-2); }
.qa-src li { margin-bottom: 4px; }
</style>
</head>

      <a class="brand" href="#/">

n' (com Provost, DMKD 1997) inaugurou a detecção de fraude por aprendizado de máquina, e 'An introduction to ROC analysis' (2006) virou a referência de avaliação de classificadores desbalanceados.", "status": "falecido", "since": 2020, "openalex_id": "A5039764415", "alt_openalex_ids": [], "links": {}, "evidence": "https://www.kdnuggets.com/2020/06/tom-fawcett-memoriam.html — memorial de Foster Provost (KDnuggets): faleceu em 04/06/2020 em acidente de bicicleta (cita obituário no San Jose Mercury News)."}, {"name": "Donald R. Cressey", "institution": "University of California, Santa Barbara", "region": "EUA", "area": "Criminologia da fraude ocupacional, 'triângulo da fraude'", "why": "'The Criminal Violation of Financial Trust' (ASR 1950) e 'Other People's Money' (1953) deram origem ao triângulo da fraude (pressão, oportunidade, racionalização).", "status": "falecido", "since": 1987, "openalex_id": "A5029508621", "alt_openalex_ids": [], "links": {}, "evidence": "https://en.wikipedia.org/wiki/Donald_Cressey — faleceu em 21/07/1987; ver também Tickner & Button (2021, Journal of Financial Crime) sobre a origem do triângulo."}, {"name": "Edwin H. Sutherland", "institution": "Indiana University", "region": "EUA", "area": "Crime de colarinho branco", "why": "Criou o conceito de crime de colarinho branco ('White-Collar Criminality', ASR 1940; livro White Collar Crime, 1949), fundação da pesquisa sobre crime financeiro e corporativo.", "status": "falecido", "since": 1950, "openalex_id": "A5113781116", "alt_openalex_ids": [], "links": {}, "evidence": "https://www.britannica.com/biography/Edwin-Sutherland — Britannica: faleceu em 11/10/1950, em Bloomington, Indiana."}]}, "evolution": {"generated": "2026-11-17", "month": "2026-11", "model": "deepseek-ai/DeepSeek-V4.1-Flash", "mode": "completa", "changes": {"since": "2026-11-17", "added": [{"title": "Neural data mining for credit card fraud detection", "year": 2003, "era": "2000-2009"}, {"title": "Intelligent financial fraud detection: A comprehensive review", "year": 2015, "era": "2010-2017"}, {"title": "Financial fraud detection using graph neural networks: A systematic review", "year": 2023, "era": "2023+"}], "removed": [{"title": "Credit Card Fraud Detection Using Bayesian and Neural Networks", "year": 2002, "era": "2000-2009"}, {"title": "Fraud Analytics Using Descriptive, Predictive, and Social Network Techniques: A Guide to Data Science for Fraud Detection", "year": 2015, "era": "2010-2017"}, {"title": "LGM-GNN: A Local and Global Aware Memory-Based Graph Neural Network for Fraud Detection", "year": 2023, "era": "2023+"}], "note": "Entraram três marcos que reforçam a virada metodológica: Brause e colegas (2003) formalizando o requisito de erro sub-0,1% em cartões, a revisão de West e Bhattacharya (2015) consolidando avaliação por custo, e a revisão sistemática de GNNs para fraude (2023) fechando o ciclo de grafos. Saíram a comparação bayesiana versus redes neurais (2002), o guia de fraud analytics de Baesens e Van Vlasselaer (2015) e o LGM-GNN (2023), o que reduz a presença de material didático e de variantes incrementais de GNN em favor de trabalhos de síntese e de foundation models."}, "stats": {"network": 956, "candidates": 472, "triaged": 2, "milestones": 36, "openalex_calls": 88, "openalex_cost": 0.0394, "tokens": {"prompt_tokens": 9076, "completion_tokens": 14985}}, "overview": "O campo nasceu nos anos 1990 como um problema de detecção de anomalias em cartões e telefonia, quando regras manuais já não davam conta do volume e da adaptação dos fraudadores. Fawcett e Provost (1997) e Ghosh e Reilly (1994) mostraram que aprendizado de máquina supervisionado batia sistemas de regras com muito menos falsos positivos, e Bolton e Hand (2002) transformaram isso em disciplina estatística. Nas duas décadas seguintes o eixo migrou de modelos tabulares isolados para sequências, grafos e aprendizado sensível a custo, com a fraude passando a ser tratada como fenômeno de rede e não de transação. Hoje, com foundation models de transação (TransactionGPT, TREASURE, Large Payments Model) e a convergência entre fraude, golpes relacionais e pagamentos instantâneos, o problema virou modelagem de comportamento em escala bilionária sob regulação em tempo real.", "eras": [{"key": "ate-1999", "label": "até 1999", "title": "Do rule-based ao aprendizado de máquina", "summary": "A época resolveu um problema prático: o volume de transações de cartão e chamadas celulares tornou inviável manter regras escritas à mão, e os falsos positivos bloqueavam clientes legítimos. A ideia que virou padrão foi treinar classificadores supervisionados sobre histórico rotulado e combiná-los com perfilamento de comportamento individual, como em Fawcett e Provost (1996, 1997). Ficou em aberto a questão da adaptação do fraudador — modelos estáticos degradam — e a base teórica do crime como convergência de oportunidade, que Cohen e Felson (1979) formularam e que só seria operacionalizada décadas depois.", "milestones": [{"id": "W1517113043", "title": "Adaptive Fraud Detection", "year": 1997, "venue": "Data Mining and Knowledge Discovery", "authors": ["Tom E. Fawcett", "Foster John Provost"], "cited_by": 1073, "net": 19.5, "url": "https://doi.org/10.1023/a:1009700419189", "theme": "fraud_analytics", "versions": [], "watch": ["Tom Fawcett"], "score": 8, "why": "Fawcett e Provost formalizaram a detecção de fraude como problema de aprendizado com custos assimétricos e rótulos atrasados, e propuseram combinar múltiplos detectores. É a origem direta da ideia de ensemble de sinais que domina produção até hoje.", "new": false}, {"id": "W2074346829", "title": "Credit card fraud detection with a neural-network", "year": 1994, "venue": "Hawaii International Conference on System Sciences (HICSS)", "authors": ["Ghosh", "Reilly"], "cited_by": 558, "net": 24.5, "url": "https://doi.org/10.1109/hicss.1994.323314", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Ghosh e Reilly treinaram uma rede neural em dados reais de um emissor e reportaram uma ordem de magnitude mais contas fraudulentas detectadas com 20x menos falsos positivos que regras. Foi a primeira evidência forte, em dados de produção, de que ML superava o status quo.", "new": false}, {"id": "W2160150610", "title": "Distributed data mining in credit card fraud detection", "year": 1999, "venue": "IEEE Intelligent Systems and their Applications", "authors": ["Philip K. Chan", "W. Fan", "Andreas L. Prodromidis", "Salvatore J. Stolfo"], "cited_by": 625, "net": 21.0, "url": "https://doi.org/10.1109/5254.809570", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Chan, Fan e Prodromidis atacaram escala e distribuição, mostrando como minerar fraude em bases massivas de forma paralela e eficiente. Antecipou em duas décadas o debate de streaming e processamento distribuído que reaparece em SCARFF (2017).", "new": false}, {"id": "W2167374789", "title": "Neural fraud detection in credit card operations", "year": 1997, "venue": "IEEE Transactions on Neural Networks", "authors": ["José R. Dorronsoro", "F. Ginel", "C. Sgnchez", "C.S. Cruz"], "cited_by": 307, "net": 20.0, "url": "https://doi.org/10.1109/72.595879", "theme": "cards", "versions": [], "watch": [], "score": 6, "why": "Dorronsoro e colegas construíram um classificador neural online instalado no hub transacional, não no emissor, decidindo com apenas o histórico imediato da operação. É o ancestral arquitetural do scoring em tempo real com janela curta de contexto.", "new": false}, {"id": "W4249855545", "title": "Social Change and Crime Rate Trends: A Routine Activity Approach", "year": 1979, "venue": "American Sociological Review", "authors": ["Lawrence E. Cohen", "Marcus Felson"], "cited_by": 12081, "net": 16.5, "url": "https://doi.org/10.2307/2094589", "theme": "scams", "versions": [], "watch": [], "score": 6, "why": "Cohen e Felson propuseram que o crime exige convergência de ofensor motivado, alvo adequado e ausência de guardião. É a base conceitual de quase todo feature de contexto — dispositivo, canal, horário, contraparte — usado em modelos de fraude.", "new": false}, {"id": "W2146935111", "title": "Combining data mining and machine learning for effective user profiling", "year": 1996, "venue": "Knowledge Discovery and Data Mining", "authors": ["Tom E. Fawcett", "Foster John Provost"], "cited_by": 237, "net": 6.0, "url": "https://openalex.org/W2146935111", "theme": "fraud_analytics", "versions": [], "watch": ["Tom Fawcett"], "score": 6, "why": "Fawcett e Provost usaram indução construtiva para gerar indicadores de fraude em telefonia celular e combiná-los em profilers com alarmes de alta confiança. Introduziu a lógica de perfil comportamental por entidade que sustenta detecção de account takeover.", "new": false}]}, {"key": "2000-2009", "label": "2000–2009", "title": "Consolidação estatística e a era do phishing", "summary": "A década resolveu dois problemas distintos: dar rigor metodológico à detecção de fraude e lidar com um canal de ataque inteiramente novo, a web. Bolton e Hand (2002) sintetizaram o campo em torno de desbalanceamento, rótulos atrasados e avaliação por custo, enquanto Dhamija, Tygar e Hearst (2006) e Zhang, Hong e Cranor (2007) mostraram que o elo humano era o ponto fraco do phishing e que conteúdo e heurísticas podiam detectá-lo. O que ficou em aberto foi a adaptação adversarial — Levi e Reuter (2006) já apontavam que os efeitos mensuráveis do regime AML eram fracos — e a incapacidade dos modelos tabulares de capturar sequência.", "milestones": [{"id": "W265896103", "title": "Statistical Fraud Detection: A Review", "year": 2002, "venue": "Statistical Science", "authors": ["Richard J. Bolton", "David J. Hand"], "cited_by": 2119, "net": 38.5, "url": "https://doi.org/10.1214/ss/1042727940", "theme": "fraud_analytics", "versions": [], "watch": ["David J. Hand"], "score": 8, "why": "Bolton e Hand organizaram o campo em torno de três regimes — supervisão, não supervisão e detecção de outliers — e explicitaram que o fraudador é adaptativo. Virou a referência canônica para justificar avaliação por custo e monitoramento de drift.", "new": false}, {"id": "W2131906261", "title": "Why phishing works", "year": 2006, "venue": "CHI Conference on Human Factors in Computing Systems", "authors": ["Rachna Dhamija", "J. D. Tygar", "Marti A. Hearst"], "cited_by": 1678, "net": 15.5, "url": "https://doi.org/10.1145/1124772.1124861", "theme": "scams", "versions": [], "watch": [], "score": 8, "why": "Dhamija, Tygar e Hearst deram a primeira evidência empírica de por que o phishing funciona: 23% dos participantes nem olhavam os indicadores de segurança do navegador. Redirecionou o esforço de defesa de avisos de UI para detecção automática.", "new": false}, {"id": "W2139565456", "title": "Cantina: a content-based approach to detecting phishing web sites", "year": 2007, "venue": "International World Wide Web Conference (WWW)", "authors": ["Zhang Yue", "Jason Hong", "Lorrie Faith Cranor"], "cited_by": 974, "net": 10.0, "url": "https://doi.org/10.1145/1242572.1242659", "theme": "scams", "versions": [], "watch": [], "score": 8, "why": "CANTINA aplicou TF-IDF e heurísticas ao conteúdo da página, acertando cerca de 95% dos sites de phishing. Mostrou que detecção baseada em conteúdo escalava melhor que listas negras, padrão que virou base de filtros de navegador e e-mail.", "new": false}, {"id": "W4230759228", "title": "Money Laundering", "year": 2006, "venue": "Crime and Justice", "authors": ["Michael Levi", "Peter H. Reuter"], "cited_by": 566, "net": 5, "url": "https://doi.org/10.1086/501508", "theme": "mules_aml", "versions": [], "watch": ["Michael Levi"], "score": 8, "why": "Levi e Reuter revisaram o regime global de AML e concluíram que seus efeitos sobre métodos de lavagem e preços eram praticamente desconhecidos. É a crítica de eficácia que ainda hoje justifica investimento em analytics de rede em vez de reporte massivo.", "new": false}, {"id": "W1966493433", "title": "Transaction aggregation as a strategy for credit card fraud detection", "year": 2008, "venue": "Data Mining and Knowledge Discovery", "authors": ["Christopher Whitrow", "David J. Hand", "Piotr Juszczak", "David J. Weston", "Niall M. Adams"], "cited_by": 455, "net": 28.0, "url": "https://doi.org/10.1007/s10618-008-0116-z", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Whitrow, Hand e Juszczak mostraram que agregar transações por janelas de tempo melhora a detecção sem abandonar o modelo tabular. É a origem do feature engineering de agregação que segue sendo baseline forte em cartões.", "new": false}, {"id": "W2096266510", "title": "Credit Card Fraud Detection Using Hidden Markov Model", "year": 2008, "venue": "IEEE Transactions on Dependable and Secure Computing", "authors": ["A. Srivastava", "A. Kundu", "Shamik Sural", "Arun Kumar Majumdar"], "cited_by": 650, "net": 22.0, "url": "https://doi.org/10.1109/tdsc.2007.70228", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Srivastava, Kundu e Sural modelaram a sequência de operações do portador com HMM, sinalizando desvio de comportamento. Antecipou a virada para modelos sequenciais que só se consolidaria com deep learning em 2018.", "new": false}, {"id": "W2105809068", "title": "Neural data mining for credit card fraud detection", "year": 2003, "venue": "IEEE International Conference on Tools with Artificial Intelligence (ICTAI)", "authors": ["Rüdiger W. Brause", "T. Langsdorf", "M. Hepp"], "cited_by": 402, "net": 22.0, "url": "https://doi.org/10.1109/tai.1999.809773", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 7, "why": "Brause, Langsdorf e Hepp explicitaram o requisito brutal do domínio — menos de 0,1% de erro aceitável dado o desbalanceamento de 1 em 1000 — e combinaram mineração de dados com redes neurais. Formalizou a meta de alto recall com baixo alarme falso que define o campo.", "new": true}]}, {"key": "2010-2017", "label": "2010–2017", "title": "Big data, revisões e escalabilidade", "summary": "A época resolveu o problema de escala e de método: como processar volumes que explodiram no e-commerce e como comparar dezenas de técnicas de forma defensável. O padrão que se firmou foi a combinação de features de agregação e rede com aprendizado supervisionado, mais o uso de frameworks de streaming como Spark, e a produção de revisões sistemáticas que viraram mapa do campo. Ficou em aberto a modelagem explícita de relações entre entidades — cartão, dispositivo, comerciante — que os modelos tabulares só capturavam por proxies.", "milestones": [{"id": "W614715210", "title": "APATE: A novel approach for automated credit card transaction fraud detection using network-based extensions", "year": 2015, "venue": "Decision Support Systems", "authors": ["Véronique Van Vlasselaer", "Cristián Bravo", "Olivier Caelen", "Tina Eliassi‐Rad", "Leman Akoglu", "Monique Snoeck", "Bart Baesens"], "cited_by": 557, "net": 19.5, "url": "https://doi.org/10.1016/j.dss.2015.04.013", "theme": "cards", "versions": [], "watch": ["Bart Baesens"], "score": 9, "why": "APATE estendeu a detecção com features de rede — vizinhança de cartões, comerciantes e endereços — mostrando ganho real sobre modelos puramente tabulares. É o marco que levou a indústria de cartões a adotar análise de rede em produção.", "new": false}, {"id": "W2751596245", "title": "SCARFF : A scalable framework for streaming credit card fraud detection with spark", "year": 2017, "venue": "Information Fusion", "authors": ["Fabrizio Carcillo", "Andrea Dal Pozzolo", "Yann‐Aël Le Borgne", "Olivier Caelen", "Yannis Mazzer", "Gianluca Bontempi"], "cited_by": 430, "net": 9, "url": "https://doi.org/10.1016/j.inffus.2017.09.005", "theme": "cards", "versions": [], "watch": ["Gianluca Bontempi"], "score": 9, "why": "SCARFF implementou detecção em streaming com Spark, com balanceamento e aprendizado incremental sobre fluxo contínuo. Definiu a arquitetura de referência para scoring em tempo real em larga escala.", "new": false}, {"id": "W2045049630", "title": "Data mining for credit card fraud: A comparative study", "year": 2010, "venue": "Decision Support Systems", "authors": ["Siddhartha Bhattacharyya", "Sanjeev Jha", "Kurian Tharakunnel", "James Christopher Westland"], "cited_by": 1535, "net": 45.5, "url": "https://doi.org/10.1016/j.dss.2010.08.008", "theme": "cards", "versions": [], "watch": [], "score": 8, "why": "Bhattacharyya e colegas compararam supervisionado, não supervisionado e híbrido em dados reais de cartão, com foco em custo e desbalanceamento. Virou o benchmark metodológico mais citado para escolher abordagem em cartões.", "new": false}, {"id": "W2085766370", "title": "The application of data mining techniques in financial fraud detection: A classification framework and an academic review of literature", "year": 2010, "venue": "Decision Support Systems", "authors": ["Eric W.T. Ngai", "Yong Qiang Hu", "Y.H. Wong", "Yijun Chen", "Xin Sun"], "cited_by": 2093, "net": 29.0, "url": "https://doi.org/10.1016/j.dss.2010.08.006", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 8, "why": "Ngai, Hu e Wong construíram um framework de classificação e revisaram a literatura de mineração de dados em fraude financeira. Deu vocabulário comum a um campo até então fragmentado entre finanças, estatística e sistemas.", "new": false}, {"id": "W2533835508", "title": "Fraud detection system: A survey", "year": 2016, "venue": "Journal of Network and Computer Applications", "authors": ["Aisha Abdallah", "Mohd Aizaini Maarof", "Anazida Binti Zainal"], "cited_by": 1042, "net": 18.5, "url": "https://doi.org/10.1016/j.jnca.2016.04.007", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 6, "why": "Abdallah, Maarof e Zainal mapearam o sistema de detecção de fraude ponta a ponta, de aquisição de dados a resposta. Útil como checklist de arquitetura para times que montam a função de detecção do zero.", "new": false}, {"id": "W2088047416", "title": "Social Change and Crime Rate Trends: A Routine Activity Approach (1979)", "year": 2010, "venue": "Routledge eBooks", "authors": ["L.E. COHEN AND M. FELSON"], "cited_by": 5999, "net": 15.5, "url": "https://doi.org/10.4324/9781439817803-12", "theme": "scams", "versions": [], "watch": [], "score": 6, "why": "A reedição de Cohen e Felson em 2010 consolidou a teoria da atividade rotineira como referência fora da criminologia. É o que dá base conceitual a features de contexto e a modelos de oportunidade em canais digitais.", "new": false}, {"id": "W2172852798", "title": "Intelligent financial fraud detection: A comprehensive review", "year": 2015, "venue": "Computers & Security", "authors": ["Jarrod West", "Maumita Bhattacharya"], "cited_by": 1015, "net": 15.5, "url": "https://doi.org/10.1016/j.cose.2015.09.005", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 6, "why": "West e Bhattacharya revisaram detecção inteligente de fraude financeira cobrindo técnicas, métricas e limitações. Consolidou a crítica de que acurácia é métrica errada e que avaliação precisa ser por custo e por tempo até detecção.", "new": true}]}, {"key": "2018-2022", "label": "2018–2022", "title": "Grafos, sequências e custo-sensibilidade", "summary": "A época resolveu o problema de representar relações e ordem temporal: GNNs passaram a modelar contas, dispositivos e comerciantes como nós de um grafo heterogêneo, e modelos sequenciais capturaram a ordem das transações. O padrão que se firmou foi aprendizado em grafo com atenção, muitas vezes semi-supervisionado dado o rótulo escasso, e otimização explicitamente sensível a custo em vez de acurácia. Ficou em aberto a robustez contra camuflagem deliberada do fraudador e a integração desses modelos com dados não estruturados, que só ganharia força com modelos generativos.", "milestones": [{"id": "W2786577118", "title": "Sequence classification for credit-card fraud detection", "year": 2018, "venue": "Expert Systems with Applications", "authors": ["Johannes Jurgovsky", "Michael Granitzer", "Konstantin Ziegler", "Sylvie Calabretto", "Pierre-Édouard Portier", "Liyun He-Guelton", "Olivier Caelen"], "cited_by": 806, "net": 16.5, "url": "https://doi.org/10.1016/j.eswa.2018.01.037", "theme": "cards", "versions": [], "watch": [], "score": 8, "why": "Jurgovsky e colegas trataram a fraude como classificação de sequência, usando histórico ordenado do cartão em vez de features agregadas. Mostrou ganho consistente sobre modelos tabulares e virou baseline para abordagens sequenciais.", "new": false}, {"id": "W3068123808", "title": "Enhancing Graph Neural Network-based Fraud Detectors against Camouflaged Fraudsters", "year": 2020, "venue": "ACM International Conference on Information and Knowledge Management (CIKM)", "authors": ["Yingtong Dou", "Zhiwei Liu", "Li Sun", "Yutong Deng", "Hao Ming Peng", "Philip S. Yu"], "cited_by": 1045, "net": 15.5, "url": "https://doi.org/10.1145/3340531.3411903", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 8, "why": "CARE identificou duas formas de camuflagem — de atributos e de relações — que degradam GNNs de fraude, e propôs agregação seletiva. É a primeira resposta sistemática ao fato de que o fraudador modela o detector.", "new": false}, {"id": "W2912336782", "title": "FaceForensics++: Learning to Detect Manipulated Facial Images", "year": 2019, "venue": "IEEE/CVF International Conference on Computer Vision (ICCV)", "authors": ["Andreas Rössler", "Davide Cozzolino", "Luisa Verdoliva", "Christian Rieß", "Justus Thies", "Matthias Nießner"], "cited_by": 4836, "net": 12.0, "url": "https://doi.org/10.1109/iccv.2019.00009", "theme": "genai_deepfakes", "versions": [], "watch": [], "score": 8, "why": "FaceForensics++ criou benchmark automatizado para detecção de manipulação facial em deepfakes, faceswap e reenactment. Tornou comparável uma área que viraria insumo direto de fraude de identidade e de KYC.", "new": false}, {"id": "W2897862648", "title": "Heterogeneous Graph Neural Networks for Malicious Account Detection", "year": 2018, "venue": "ACM International Conference on Information and Knowledge Management (CIKM)", "authors": ["Ziqi Liu", "Chaochao Chen", "Xinxing Yang", "Jun Zhou", "Xiaolong Li", "Le Song"], "cited_by": 519, "net": 11.5, "url": "https://doi.org/10.1145/3269206.3272010", "theme": "account_identity", "versions": [], "watch": [], "score": 8, "why": "GEM, do Alipay, foi a primeira GNN heterogênea para contas maliciosas em escala de produção, explorando agregação por dispositivo e por atividade. Provou que grafos funcionam em plataforma de pagamento real, não só em benchmark.", "new": false}, {"id": "W3021125242", "title": "Instance-dependent cost-sensitive learning for detecting transfer fraud", "year": 2021, "venue": "European Journal of Operational Research", "authors": ["Sebastiaan Höppner", "Bart Baesens", "Wouter Verbeke", "Tim Verdonck"], "cited_by": 131, "net": 3, "url": "https://doi.org/10.1016/j.ejor.2021.05.028", "theme": "fraud_analytics", "versions": [], "watch": ["Tim Verdonck"], "score": 8, "why": "Höppner, Baesens e Verbeke formalizaram aprendizado sensível a custo dependente da instância para fraude de transferência. Deu base teórica para decidir caso a caso quanto vale bloquear, em vez de usar um único threshold global.", "new": false}, {"id": "W2947544539", "title": "Automatically Dismantling Online Dating Fraud", "year": 2019, "venue": "IEEE Transactions on Information Forensics and Security", "authors": ["Guillermo Suárez‐Tangil", "Matthew Edwards", "Claudia Peersman", "Gianluca Stringhini", "Awais Rashid", "Monica Therese Whitty"], "cited_by": 126, "net": 3, "url": "https://doi.org/10.1109/tifs.2019.2930479", "theme": "scams", "versions": [], "watch": ["Monica Therese Whitty"], "score": 8, "why": "Suárez-Tangil e colegas analisaram perfis de sites de namoro e mostraram que filtros de spam não funcionam contra romance scam, propondo detecção baseada em arquétipo de perfil. Abriu a linha de defesa contra fraude relacional que hoje domina os prejuízos reportados.", "new": false}, {"id": "W2945876440", "title": "Combining unsupervised and supervised learning in credit card fraud detection", "year": 2019, "venue": "Information Sciences", "authors": ["Fabrizio Carcillo", "Yann‐Aël Le Borgne", "Olivier Caelen", "Yacine Kessaci", "Frédéric Oblé", "Gianluca Bontempi"], "cited_by": 738, "net": 15, "url": "https://doi.org/10.1016/j.ins.2019.05.042", "theme": "cards", "versions": [], "watch": ["Gianluca Bontempi", "Frédéric Oblé"], "score": 7, "why": "Carcillo e colegas combinaram não supervisionado e supervisionado para lidar com rótulos escassos e atrasados em cartões. Virou receita padrão para treinar quando a fraude confirmada chega semanas depois da transação.", "new": false}, {"id": "W3009901425", "title": "A Semi-Supervised Graph Attentive Network for Financial Fraud Detection", "year": 2019, "venue": "Proceedings", "authors": ["Daixin Wang", "Jianbin Lin", "Peng Cui", "Quanhui Jia", "Zhen Wang", "Yanming Fang", "Quan Yu", "Jun Zhou"], "cited_by": 650, "net": 12.5, "url": "https://doi.org/10.1109/icdm.2019.00070", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 7, "why": "Semi-GNN aplicou atenção em grafo multivisão com pouquíssimos rótulos, explorando interações ricas entre usuários de serviços financeiros. Consolidou o paradigma semi-supervisionado que domina detecção de fraude em rede.", "new": false}]}, {"key": "2023+", "label": "2023 em diante", "title": "Foundation models e fraude generativa", "summary": "A época está resolvendo o problema de generalização: em vez de um modelo por tarefa, treinar representações universais de transação e adaptá-las a múltiplos alvos. O padrão emergente são transformers sobre trajetórias de transação em escala de bilhões de eventos, com codificação por campo e autossupervisão, além de GNNs acopladas a aprendizado por reforço para adaptação contínua. Ficou em aberto a validação desses modelos sob regulação, o custo computacional, a explicabilidade exigida por supervisores e a defesa contra fraude gerada por IA, incluindo identidades sintéticas e golpes relacionais industrializados.", "milestones": [{"id": "W4320013936", "title": "Generative Adversarial Nets", "year": 2023, "venue": "Springer eBooks", "authors": ["Raphael Labaca-Castro"], "cited_by": 21133, "net": 6.5, "url": "https://doi.org/10.1007/978-3-658-40442-0_9", "theme": "genai_deepfakes", "versions": [], "watch": [], "score": 10, "why": "A reedição de GANs em 2023 no contexto de segurança sintetiza o ponto de virada: modelos generativos deixaram de ser curiosidade acadêmica e passaram a ser ferramenta ofensiva e defensiva. É a base técnica de deepfakes, identidades sintéticas e aumento de dados para treino.", "new": false}, {"id": "W4416223251", "title": "TransactionGPT", "year": 2025, "venue": "arXiv (Cornell University)", "authors": ["Yingtong Dou", "Zhimeng Jiang", "Tianyi Zhang", "Mingzhi Hu", "Zhichao Xu", "Shubham Jain", "Uday Singh Saini", "Fan, Xiran"], "cited_by": 14, "net": 1, "url": "https://doi.org/10.48550/arxiv.2511.08939", "theme": "fraud_analytics", "versions": [], "watch": ["Yingtong Dou"], "score": 9, "why": "TransactionGPT treinou um foundation model em bilhões de transações reais de uma grande rede de pagamentos, com arquitetura 3D-Transformer e otimização conjunta com tarefas downstream. É a prova de que a lógica de foundation model se transfere para dados transacionais estruturados.", "new": false}, {"id": "W4414960719", "title": "Network Analytics for Anti-money Laundering—A Systematic Literature Review and Experimental Evaluation", "year": 2025, "venue": "INFORMS Journal on Data Science", "authors": ["Bruno Deprez", "Toon Vanderschueren", "Bart Baesens", "Tim Verdonck", "Wouter Verbeke"], "cited_by": 54, "net": 0, "url": "https://doi.org/10.1287/ijds.2024.0042", "theme": "mules_aml", "versions": [], "watch": ["Tim Verdonck"], "score": 9, "why": "Deprez, Vanderschueren e Baesens revisaram 97 papers de analytics de rede para AML e avaliaram experimentalmente o poder comparativo dos métodos. Organizou uma literatura fragmentada e deu base para escolher método com evidência, não com moda.", "new": false}, {"id": "W4386416967", "title": "Romance baiting, cryptorom and ‘pig butchering’: an evolutionary step in romance fraud", "year": 2023, "venue": "Current Issues in Criminal Justice", "authors": ["Cassandra Cross"], "cited_by": 66, "net": 0, "url": "https://doi.org/10.1080/10345329.2023.2248670", "theme": "scams", "versions": [], "watch": ["Cassandra Cross"], "score": 8, "why": "Cross documentou a convergência entre romance fraud e investment fraud — romance baiting, cryptorom, pig butchering — em que o relacionamento é o mecanismo e cripto é o veículo. Redefiniu o escopo do que um banco precisa detectar além da transação suspeita isolada.", "new": false}, {"id": "W4407691196", "title": "FraudGNN-RL: A Graph Neural Network With Reinforcement Learning for Adaptive Financial Fraud Detection", "year": 2025, "venue": "IEEE Open Journal of the Computer Society", "authors": ["Yiwen Cui", "Xu Han", "Jiaying Chen", "Xinguang Zhang", "Jingyun Yang", "Xuguang Zhang"], "cited_by": 133, "net": 1, "url": "https://doi.org/10.1109/ojcs.2025.3543450", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 7, "why": "FraudGNN-RL combina GNN temporal-especial-semântica com aprendizado por reforço para detecção adaptativa em grafo dinâmico. Ataca diretamente o problema de drift adversarial que Bolton e Hand já apontavam em 2002.", "new": false}, {"id": "W4416788802", "title": "TREASURE: The Visa Payment Foundation Model for High-Volume Transaction Understanding", "year": 2025, "venue": "arXiv (Cornell University)", "authors": ["Chin‐Chia Michael Yeh", "Uday Singh Saini", "Dai, Xin", "Fan, Xiran", "Shubham Jain", "Yujie Fan", "Jiarui Sun", "Junpeng Wang"], "cited_by": 8, "net": 0, "url": "https://doi.org/10.48550/arxiv.251  do ciclo de vida, e TransactionGPT e TREASURE seguindo a mesma direção em redes de pagamento reais. Ao mesmo tempo, a fronteira regulatória e de produto se move para pagamentos instantâneos e Open Finance, com a Resolução Conjunta BC/CMN 21/2026 refinando responsabilidades entre instituições e parceiras, e o Bank of Canada mostrando que governança centralizada de fraude não implementa a alocação ótima porque exclui pagamentos pequenos via tarifas. Do lado do ataque, o estudo de ataques de acesso persistente — em que o invasor reconfigura recursos de segurança para sobreviver à remediação — desloca o foco de detecção de transação para detecção de configuração e de sessão. A síntese é que o modelo de fraude deixou de ser um classificador e passou a ser infraestrutura de representação, disputada entre eficácia, custo e explicabilidade regulatória.", "open_questions": ["Foundation models de transação generalizam entre bancos e mercados, ou cada rede precisa do seu próprio modelo?", "Como auditar e explicar um foundation model para o regulador sem perder o ganho de performance?", "Quem paga a conta e responde pelo erro em pagamento instantâneo sob Open Finance: iniciadora, detentora ou integradora?", "Detecção de acesso persistente deve viver no time de fraude, de segurança ou de identidade?", "Como defender contra golpe relacional e identidade sintética quando o sinal está fora do perímetro transacional do banco?"]}, "threads": [{"theme": "fraud_analytics", "line": "Começou como comparação entre regras e classificadores supervisionados (Fawcett e Provost, 1997), virou disciplina estatística com Bolton e Hand (2002) e uma série de revisões sistemáticas entre 2010 e 2016, e evoluiu para grafos com camuflagem (CARE, 2020), aprendizado sensível a custo (2021) e, em 2025, foundation models de transação como TransactionGPT e TREASURE. O fio condutor é sempre o mesmo: rótulo escasso, atrasado e adversário adaptativo."}, {"theme": "cards", "line": "Saiu de redes neurais sobre dados de emissor (Ghosh e Reilly, 1994) e HMMs de sequência (2008) para agregação de transações (Whitrow, 2008), features de rede (APATE, 2015) e streaming com Spark (SCARFF, 2017), chegando a classificação de sequência com deep learning (Jurgovsky, 2018) e combinação de supervisionado com não supervisionado (Carcillo, 2019). A trajetória é de janelas cada vez mais ricas de contexto, não de modelos mais exóticos."}, {"theme": "scams", "line": "Partiu da teoria criminológica de oportunidade (Cohen e Felson, 1979), passou pela constatação empírica de que o usuário não lê indicadores de segurança (Dhamija, 2006) e pela detecção de conteúdo de phishing (CANTINA, 2007), e chegou a detecção de arquétipos de perfil em romance scam (2019) e à convergência com investment fraud em cryptorom e pig butchering (Cross, 2023). O deslocamento é de defesa de canal para defesa de relação."}, {"theme": "mules_aml", "line": "Levi e Reuter (2006) mostraram que o regime AML global tinha efeitos mal medidos, a revisão de analytics de rede para AML (2025) organizou 97 papers e comparou métodos experimentalmente, e a análise de redes criminais de Lusthaus e colegas (2023) revelou a separação estrutural entre ataque e movimentação de dinheiro. O tema saiu de ceticismo sobre eficácia para engenharia de grafo aplicada a contas laranja."}, {"theme": "genai_deepfakes", "line": "FaceForensics++ (2019) criou o benchmark que tornou a detecção de manipulação facial comparável, e a reedição de GANs em 2023 consolidou o modelo generativo como ferramenta central tanto para forjar quanto para detectar. A linha evolui de detectar imagem manipulada para detectar identidade e comportamento sintéticos em escala."}]}, "annual": {"2025": {"year": 2025, "partial": false, "generated": "2026-11-17", "model": "deepseek-ai/DeepSeek-V4.1-Flash", "overview": "2025 foi o ano da industrialização da fraude e da resposta com modelos de fundação, grafos e LLMs. A detecção de fraude em instituições financeiras cresceu +11
