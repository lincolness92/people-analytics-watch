<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Watch</title>
  <meta name="description" content="Digest de pesquisa state-of-the-art.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --ink: #1d1b18;
  --ink-2: #4a463f;
  --muted: #807a70;
  --line: #e4dfd5;
  --accent: #b4431f;
  --accent-soft: #f6e4dc;
  --star: #a8730b;
  --star-soft: #f7ecd2;
  --chip: #efebe3;
  --score-hi: #1f6f4a;
  --score-mid: #8a6d12;
  --score-lo: #7a746a;
  --serif: "Iowan Old Style", "Charter", "Source Serif Pro", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513;
    --surface: #1f1d1a;
    --ink: #ece8e1;
    --ink-2: #c4beb3;
    --muted: #8f897f;
    --line: #34312c;
    --accent: #ec8a63;
    --accent-soft: #3a2519;
    --star: #e2b24f;
    --star-soft: #382c14;
    --chip: #2a2824;
    --score-hi: #6fcf9c;
    --score-mid: #e2c25b;
    --score-lo: #9d978d;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
}
a { color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }

/* header */
.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.brand em { color: var(--accent); font-style: italic; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs a {
  text-decoration: none; font-size: 14px; color: var(--ink-2);
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}
.tabs a:hover { background: var(--chip); }
.tabs a.active { background: var(--ink); color: var(--bg); }
.trends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 8px; }
.trend-card { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.trend-card p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.geo { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 22px; margin-bottom: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr 90px 40px; gap: 8px; align-items: center; font-size: 14px; margin-bottom: 6px; }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.small { font-size: 12px; }
table.growth { width: 100%; border-collapse: collapse; font-size: 14px; }
table.growth th, table.growth td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.growth td:nth-child(n+2), table.growth th:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--score-hi); font-weight: 600; } .down { color: var(--score-lo); font-weight: 600; }
.year-chips { margin-bottom: 6px; }
.region-tag { font-size: 12px; font-weight: 600; white-space: nowrap; }
.region-chips { margin: -8px 0 18px; }
.topic-switch { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; max-width: 100%; }

main { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }

/* digest header */
.day-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.day-nav button, .day-nav select {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.day-nav button:disabled { opacity: .35; cursor: default; }
h1.day {
  font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5vw, 40px);
  line-height: 1.15; margin: 10px 0 6px; letter-spacing: -0.01em;
}
.dek { color: var(--ink-2); margin: 0 0 22px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* trend callout */
.trend {
  background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; margin: 0 0 32px;
  font-family: var(--serif); font-size: 17px; line-height: 1.55;
}
.trend .label { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* theme sections */
.theme-h {
  font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2); margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 12px;
}
.card.watch { border-left: 3px solid var(--star); }
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.card h3 { font-family: var(--serif); font-size: 19px; line-height: 1.3; margin: 0; font-weight: 600; flex: 1; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.score {
  flex: none; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
}
.score.hi { color: var(--score-hi); }
.score.mid { color: var(--score-mid); }
.score.lo { color: var(--score-lo); }
.meta { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.meta .star { color: var(--star); background: var(--star-soft); padding: 1px 7px; border-radius: 999px; font-weight: 600; margin-right: 4px; }
.summary { margin: 0; color: var(--ink-2); }
.summary strong { color: var(--ink); }
.orig { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

.quick { margin-top: 30px; }
.quick ul { padding-left: 18px; margin: 0; }
.quick li { margin-bottom: 8px; color: var(--ink-2); }
.quick li a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }

/* filters */
.filters { display: grid; gap: 12px; margin-bottom: 22px; }
.search {
  width: 100%; font: inherit; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--chip); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.filter-row input[type=range] { accent-color: var(--accent); }
.count { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.date-tag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* trends timeline */
.timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 20px; }
.tl-item { position: relative; margin-bottom: 24px; }
.tl-item::before {
  content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
}
.tl-item a.d { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.tl-item p { margin: 4px 0 0; font-family: var(--serif); font-size: 17px; }

/* watchlist */
.wl-section { margin-bottom: 36px; }
.wl-section h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 4px; }
.region-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 22px 0 10px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.person .n { font-weight: 650; }
.person .i { font-size: 13px; color: var(--muted); }
.person .a { font-size: 13px; color: var(--accent); margin-top: 4px; }
.person .w { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.person .l { font-size: 12px; margin-top: 6px; display: flex; gap: 10px; }
.person .l a { color: var(--muted); }
.person .hits { font-size: 12px; margin-top: 6px; color: var(--star); font-weight: 600; }
.list-simple { padding-left: 18px; }
.list-simple li { margin-bottom: 8px; color: var(--ink-2); }
.list-simple li b { color: var(--ink); }
.list-simple .hits { font-size: 12px; color: var(--star); font-weight: 600; white-space: nowrap; }

.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 16px; padding-bottom: 32px; border-top: 1px solid var(--line); }

@media (max-width: 560px) {
  .card { padding: 14px; }
  .card h3 { font-size: 17px; }
  .brand { font-size: 18px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chip { white-space: nowrap; }
}

/* evolution */
.evo-chips { margin-bottom: 22px; }
.evo { position: relative; margin-left: 6px; border-left: 2px solid var(--line); padding-left: 22px; }
.era { position: relative; margin-bottom: 38px; }
.era::before {
  content: ""; position: absolute; left: -30px; top: 4px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--bg);
}
.era-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.era-title { font-family: var(--serif); font-size: 24px; line-height: 1.2; margin: 4px 0 8px; }
.era-summary { color: var(--ink-2); margin: 0 0 16px; }
.era-none { font-size: 14px; }
.ms-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ms { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.ms-year { flex: none; font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 44px; }
.ms-body { min-width: 0; }
.ms-title { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.3; text-decoration: none; }
.ms-title:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ms .meta { margin: 4px 0 6px; }
.ms-theme { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 1px 9px; }
.now { margin-top: 10px; }
.now p { color: var(--ink-2); }
.now-q { font-size: 15px; margin: 16px 0 6px; }
@media (max-width: 560px) {
  .evo { padding-left: 16px; }
  .era::before { left: -24px; }
  .ms { flex-direction: column; gap: 4px; padding: 12px 14px; }
}
.changes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 0 0 20px; }
.changes summary { cursor: pointer; font-size: 14px; color: var(--ink-2); }
.changes p { margin: 10px 0 6px; color: var(--ink-2); }
.changes ul { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.changes li { margin-bottom: 4px; }
.chg-add { color: var(--score-hi); font-weight: 700; }
.chg-del { color: var(--accent); font-weight: 700; }
.ms-new { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--bg); background: var(--score-hi); border-radius: 999px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; }

.person .status { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; }
.person.hist { background: var(--chip); }
.wl-note { margin: 0 0 12px; font-size: 14px; }

/* feedback */
.fb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.fb-btn { font: inherit; font-size: 14px; line-height: 1; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; filter: grayscale(1); opacity: .7; }
.fb-btn:hover { opacity: 1; filter: none; }
.fb-btn[aria-pressed="true"] { filter: none; opacity: 1; background: var(--accent-soft); border-color: var(--accent); }
.fb-link { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.fb-msg { font-size: 13px; color: var(--muted); }
.fb-form { flex-basis: 100%; display: grid; gap: 8px; margin-top: 4px; }
.fb-form textarea, .fb-form input { font: inherit; font-size: 14px; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.fb-row { display: flex; gap: 8px; }
.fb-row input { flex: 1; min-width: 0; }
.fb-row button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); cursor: pointer; }
.fb-row button:disabled { opacity: .5; }
.fb-box { display: block; margin-top: 36px; }
.fb-box .fb-msg { display: block; margin-top: 6px; }
.fb-form[hidden] { display: none; }

/* ask */
.ask-examples { margin-bottom: 18px; }
.ask-examples .chip { text-align: left; white-space: normal; }
.ask-form { display: grid; gap: 8px; margin-top: 18px; }
.ask-form textarea { font: inherit; width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.ask-form .fb-row { align-items: center; }
.ask-hint { flex: 1; font-size: 13px; }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.qa .q { font-weight: 650; margin-bottom: 8px; }
.qa .a p { margin: 0 0 10px; color: var(--ink-2); }
.cite { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; vertical-align: 2px; margin-left: 1px; }
.qa-src { font-size: 13px; padding-left: 22px; margin: 6px 0 0; color: var(--ink-2); }
.qa-src li { margin-bottom: 4px; }

n' (com Provost, DMKD 1997) inaugurou a detecção de fraude por aprendizado de máquina, e 'An introduction to ROC analysis' (2006) virou a referência de avaliação de classificadores desbalanceados.", "status": "falecido", "since": 2020, "openalex_id": "A5039764415", "alt_openalex_ids": [], "links": {}, "evidence": "https://www.kdnuggets.com/2020/06/tom-fawcett-memoriam.html — memorial de Foster Provost (KDnuggets): faleceu em 04/06/2020 em acidente de bicicleta (cita obituário no San Jose Mercury News)."}, {"name": "Donald R. Cressey", "institution": "University of California, Santa Barbara", "region": "EUA", "area": "Criminologia da fraude ocupacional, 'triângulo da fraude'", "why": "'The Criminal Violation of Financial Trust' (ASR 1950) e 'Other People's Money' (1953) deram origem ao triângulo da fraude (pressão, oportunidade, racionalização).", "status": "falecido", "since": 1987, "openalex_id": "A5029508621", "alt_openalex_ids": [], "links": {}, "evidence": "https://en.wikipedia.org/wiki/Donald_Cressey — faleceu em 21/07/1987; ver também Tickner & Button (2021, Journal of Financial Crime) sobre a origem do triângulo."}, {"name": "Edwin H. Sutherland", "institution": "Indiana University", "region": "EUA", "area": "Crime de colarinho branco", "why": "Criou o conceito de crime de colarinho branco ('White-Collar Criminality', ASR 1940; livro White Collar Crime, 1949), fundação da pesquisa sobre crime financeiro e corporativo.", "status": "falecido", "since": 1950, "openalex_id": "A5113781116", "alt_openalex_ids": [], "links": {}, "evidence": "https://www.britannica.com/biography/Edwin-Sutherland — Britannica: faleceu em 11/10/1950, em Bloomington, Indiana."}]}, "evolution": {"generated": "2026-11-17", "month": "2026-11", "model": "deepseek-ai/DeepSeek-V4.1-Flash", "mode": "completa", "changes": {"since": "2026-11-17", "added": [{"title": "Neural data mining for credit card fraud detection", "year": 2003, "era": "2000-2009"}, {"title": "Intelligent financial fraud detection: A comprehensive review", "year": 2015, "era": "2010-2017"}, {"title": "Financial fraud detection using graph neural networks: A systematic review", "year": 2023, "era": "2023+"}], "removed": [{"title": "Credit Card Fraud Detection Using Bayesian and Neural Networks", "year": 2002, "era": "2000-2009"}, {"title": "Fraud Analytics Using Descriptive, Predictive, and Social Network Techniques: A Guide to Data Science for Fraud Detection", "year": 2015, "era": "2010-2017"}, {"title": "LGM-GNN: A Local and Global Aware Memory-Based Graph Neural Network for Fraud Detection", "year": 2023, "era": "2023+"}], "note": "Entraram três marcos que reforçam a virada metodológica: Brause e colegas (2003) formalizando o requisito de erro sub-0,1% em cartões, a revisão de West e Bhattacharya (2015) consolidando avaliação por custo, e a revisão sistemática de GNNs para fraude (2023) fechando o ciclo de grafos. Saíram a comparação bayesiana versus redes neurais (2002), o guia de fraud analytics de Baesens e Van Vlasselaer (2015) e o LGM-GNN (2023), o que reduz a presença de material didático e de variantes incrementais de GNN em favor de trabalhos de síntese e de foundation models."}, "stats": {"network": 956, "candidates": 472, "triaged": 2, "milestones": 36, "openalex_calls": 88, "openalex_cost": 0.0394, "tokens": {"prompt_tokens": 9076, "completion_tokens": 14985}}, "overview": "O campo nasceu nos anos 1990 como um problema de detecção de anomalias em cartões e telefonia, quando regras manuais já não davam conta do volume e da adaptação dos fraudadores. Fawcett e Provost (1997) e Ghosh e Reilly (1994) mostraram que aprendizado de máquina supervisionado batia sistemas de regras com muito menos falsos positivos, e Bolton e Hand (2002) transformaram isso em disciplina estatística. Nas duas décadas seguintes o eixo migrou de modelos tabulares isolados para sequências, grafos e aprendizado sensível a custo, com a fraude passando a ser tratada como fenômeno de rede e não de transação. Hoje, com foundation models de transação (TransactionGPT, TREASURE, Large Payments Model) e a convergência entre fraude, golpes relacionais e pagamentos instantâneos, o problema virou modelagem de comportamento em escala bilionária sob regulação em tempo real.", "eras": [{"key": "ate-1999", "label": "até 1999", "title": "Do rule-based ao aprendizado de máquina", "summary": "A época resolveu um problema prático: o volume de transações de cartão e chamadas celulares tornou inviável manter regras escritas à mão, e os falsos positivos bloqueavam clientes legítimos. A ideia que virou padrão foi treinar classificadores supervisionados sobre histórico rotulado e combiná-los com perfilamento de comportamento individual, como em Fawcett e Provost (1996, 1997). Ficou em aberto a questão da adaptação do fraudador — modelos estáticos degradam — e a base teórica do crime como convergência de oportunidade, que Cohen e Felson (1979) formularam e que só seria operacionalizada décadas depois.", "milestones": [{"id": "W1517113043", "title": "Adaptive Fraud Detection", "year": 1997, "venue": "Data Mining and Knowledge Discovery", "authors": ["Tom E. Fawcett", "Foster John Provost"], "cited_by": 1073, "net": 19.5, "url": "https://doi.org/10.1023/a:1009700419189", "theme": "fraud_analytics", "versions": [], "watch": ["Tom Fawcett"], "score": 8, "why": "Fawcett e Provost formalizaram a detecção de fraude como problema de aprendizado com custos assimétricos e rótulos atrasados, e propuseram combinar múltiplos detectores. É a origem direta da ideia de ensemble de sinais que domina produção até hoje.", "new": false}, {"id": "W2074346829", "title": "Credit card fraud detection with a neural-network", "year": 1994, "venue": "Hawaii International Conference on System Sciences (HICSS)", "authors": ["Ghosh", "Reilly"], "cited_by": 558, "net": 24.5, "url": "https://doi.org/10.1109/hicss.1994.323314", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Ghosh e Reilly treinaram uma rede neural em dados reais de um emissor e reportaram uma ordem de magnitude mais contas fraudulentas detectadas com 20x menos falsos positivos que regras. Foi a primeira evidência forte, em dados de produção, de que ML superava o status quo.", "new": false}, {"id": "W2160150610", "title": "Distributed data mining in credit card fraud detection", "year": 1999, "venue": "IEEE Intelligent Systems and their Applications", "authors": ["Philip K. Chan", "W. Fan", "Andreas L. Prodromidis", "Salvatore J. Stolfo"], "cited_by": 625, "net": 21.0, "url": "https://doi.org/10.1109/5254.809570", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Chan, Fan e Prodromidis atacaram escala e distribuição, mostrando como minerar fraude em bases massivas de forma paralela e eficiente. Antecipou em duas décadas o debate de streaming e processamento distribuído que reaparece em SCARFF (2017).", "new": false}, {"id": "W2167374789", "title": "Neural fraud detection in credit card operations", "year": 1997, "venue": "IEEE Transactions on Neural Networks", "authors": ["José R. Dorronsoro", "F. Ginel", "C. Sgnchez", "C.S. Cruz"], "cited_by": 307, "net": 20.0, "url": "https://doi.org/10.1109/72.595879", "theme": "cards", "versions": [], "watch": [], "score": 6, "why": "Dorronsoro e colegas construíram um classificador neural online instalado no hub transacional, não no emissor, decidindo com apenas o histórico imediato da operação. É o ancestral arquitetural do scoring em tempo real com janela curta de contexto.", "new": false}, {"id": "W4249855545", "title": "Social Change and Crime Rate Trends: A Routine Activity Approach", "year": 1979, "venue": "American Sociological Review", "authors": ["Lawrence E. Cohen", "Marcus Felson"], "cited_by": 12081, "net": 16.5, "url": "https://doi.org/10.2307/2094589", "theme": "scams", "versions": [], "watch": [], "score": 6, "why": "Cohen e Felson propuseram que o crime exige convergência de ofensor motivado, alvo adequado e ausência de guardião. É a base conceitual de quase todo feature de contexto — dispositivo, canal, horário, contraparte — usado em modelos de fraude.", "new": false}, {"id": "W2146935111", "title": "Combining data mining and machine learning for effective user profiling", "year": 1996, "venue": "Knowledge Discovery and Data Mining", "authors": ["Tom E. Fawcett", "Foster John Provost"], "cited_by": 237, "net": 6.0, "url": "https://openalex.org/W2146935111", "theme": "fraud_analytics", "versions": [], "watch": ["Tom Fawcett"], "score": 6, "why": "Fawcett e Provost usaram indução construtiva para gerar indicadores de fraude em telefonia celular e combiná-los em profilers com alarmes de alta confiança. Introduziu a lógica de perfil comportamental por entidade que sustenta detecção de account takeover.", "new": false}]}, {"key": "2000-2009", "label": "2000–2009", "title": "Consolidação estatística e a era do phishing", "summary": "A década resolveu dois problemas distintos: dar rigor metodológico à detecção de fraude e lidar com um canal de ataque inteiramente novo, a web. Bolton e Hand (2002) sintetizaram o campo em torno de desbalanceamento, rótulos atrasados e avaliação por custo, enquanto Dhamija, Tygar e Hearst (2006) e Zhang, Hong e Cranor (2007) mostraram que o elo humano era o ponto fraco do phishing e que conteúdo e heurísticas podiam detectá-lo. O que ficou em aberto foi a adaptação adversarial — Levi e Reuter (2006) já apontavam que os efeitos mensuráveis do regime AML eram fracos — e a incapacidade dos modelos tabulares de capturar sequência.", "milestones": [{"id": "W265896103", "title": "Statistical Fraud Detection: A Review", "year": 2002, "venue": "Statistical Science", "authors": ["Richard J. Bolton", "David J. Hand"], "cited_by": 2119, "net": 38.5, "url": "https://doi.org/10.1214/ss/1042727940", "theme": "fraud_analytics", "versions": [], "watch": ["David J. Hand"], "score": 8, "why": "Bolton e Hand organizaram o campo em torno de três regimes — supervisão, não supervisão e detecção de outliers — e explicitaram que o fraudador é adaptativo. Virou a referência canônica para justificar avaliação por custo e monitoramento de drift.", "new": false}, {"id": "W2131906261", "title": "Why phishing works", "year": 2006, "venue": "CHI Conference on Human Factors in Computing Systems", "authors": ["Rachna Dhamija", "J. D. Tygar", "Marti A. Hearst"], "cited_by": 1678, "net": 15.5, "url": "https://doi.org/10.1145/1124772.1124861", "theme": "scams", "versions": [], "watch": [], "score": 8, "why": "Dhamija, Tygar e Hearst deram a primeira evidência empírica de por que o phishing funciona: 23% dos participantes nem olhavam os indicadores de segurança do navegador. Redirecionou o esforço de defesa de avisos de UI para detecção automática.", "new": false}, {"id": "W2139565456", "title": "Cantina: a content-based approach to detecting phishing web sites", "year": 2007, "venue": "International World Wide Web Conference (WWW)", "authors": ["Zhang Yue", "Jason Hong", "Lorrie Faith Cranor"], "cited_by": 974, "net": 10.0, "url": "https://doi.org/10.1145/1242572.1242659", "theme": "scams", "versions": [], "watch": [], "score": 8, "why": "CANTINA aplicou TF-IDF e heurísticas ao conteúdo da página, acertando cerca de 95% dos sites de phishing. Mostrou que detecção baseada em conteúdo escalava melhor que listas negras, padrão que virou base de filtros de navegador e e-mail.", "new": false}, {"id": "W4230759228", "title": "Money Laundering", "year": 2006, "venue": "Crime and Justice", "authors": ["Michael Levi", "Peter H. Reuter"], "cited_by": 566, "net": 5, "url": "https://doi.org/10.1086/501508", "theme": "mules_aml", "versions": [], "watch": ["Michael Levi"], "score": 8, "why": "Levi e Reuter revisaram o regime global de AML e concluíram que seus efeitos sobre métodos de lavagem e preços eram praticamente desconhecidos. É a crítica de eficácia que ainda hoje justifica investimento em analytics de rede em vez de reporte massivo.", "new": false}, {"id": "W1966493433", "title": "Transaction aggregation as a strategy for credit card fraud detection", "year": 2008, "venue": "Data Mining and Knowledge Discovery", "authors": ["Christopher Whitrow", "David J. Hand", "Piotr Juszczak", "David J. Weston", "Niall M. Adams"], "cited_by": 455, "net": 28.0, "url": "https://doi.org/10.1007/s10618-008-0116-z", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Whitrow, Hand e Juszczak mostraram que agregar transações por janelas de tempo melhora a detecção sem abandonar o modelo tabular. É a origem do feature engineering de agregação que segue sendo baseline forte em cartões.", "new": false}, {"id": "W2096266510", "title": "Credit Card Fraud Detection Using Hidden Markov Model", "year": 2008, "venue": "IEEE Transactions on Dependable and Secure Computing", "authors": ["A. Srivastava", "A. Kundu", "Shamik Sural", "Arun Kumar Majumdar"], "cited_by": 650, "net": 22.0, "url": "https://doi.org/10.1109/tdsc.2007.70228", "theme": "cards", "versions": [], "watch": [], "score": 7, "why": "Srivastava, Kundu e Sural modelaram a sequência de operações do portador com HMM, sinalizando desvio de comportamento. Antecipou a virada para modelos sequenciais que só se consolidaria com deep learning em 2018.", "new": false}, {"id": "W2105809068", "title": "Neural data mining for credit card fraud detection", "year": 2003, "venue": "IEEE International Conference on Tools with Artificial Intelligence (ICTAI)", "authors": ["Rüdiger W. Brause", "T. Langsdorf", "M. Hepp"], "cited_by": 402, "net": 22.0, "url": "https://doi.org/10.1109/tai.1999.809773", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 7, "why": "Brause, Langsdorf e Hepp explicitaram o requisito brutal do domínio — menos de 0,1% de erro aceitável dado o desbalanceamento de 1 em 1000 — e combinaram mineração de dados com redes neurais. Formalizou a meta de alto recall com baixo alarme falso que define o campo.", "new": true}]}, {"key": "2010-2017", "label": "2010–2017", "title": "Big data, revisões e escalabilidade", "summary": "A época resolveu o problema de escala e de método: como processar volumes que explodiram no e-commerce e como comparar dezenas de técnicas de forma defensável. O padrão que se firmou foi a combinação de features de agregação e rede com aprendizado supervisionado, mais o uso de frameworks de streaming como Spark, e a produção de revisões sistemáticas que viraram mapa do campo. Ficou em aberto a modelagem explícita de relações entre entidades — cartão, dispositivo, comerciante — que os modelos tabulares só capturavam por proxies.", "milestones": [{"id": "W614715210", "title": "APATE: A novel approach for automated credit card transaction fraud detection using network-based extensions", "year": 2015, "venue": "Decision Support Systems", "authors": ["Véronique Van Vlasselaer", "Cristián Bravo", "Olivier Caelen", "Tina Eliassi‐Rad", "Leman Akoglu", "Monique Snoeck", "Bart Baesens"], "cited_by": 557, "net": 19.5, "url": "https://doi.org/10.1016/j.dss.2015.04.013", "theme": "cards", "versions": [], "watch": ["Bart Baesens"], "score": 9, "why": "APATE estendeu a detecção com features de rede — vizinhança de cartões, comerciantes e endereços — mostrando ganho real sobre modelos puramente tabulares. É o marco que levou a indústria de cartões a adotar análise de rede em produção.", "new": false}, {"id": "W2751596245", "title": "SCARFF : A scalable framework for streaming credit card fraud detection with spark", "year": 2017, "venue": "Information Fusion", "authors": ["Fabrizio Carcillo", "Andrea Dal Pozzolo", "Yann‐Aël Le Borgne", "Olivier Caelen", "Yannis Mazzer", "Gianluca Bontempi"], "cited_by": 430, "net": 9, "url": "https://doi.org/10.1016/j.inffus.2017.09.005", "theme": "cards", "versions": [], "watch": ["Gianluca Bontempi"], "score": 9, "why": "SCARFF implementou detecção em streaming com Spark, com balanceamento e aprendizado incremental sobre fluxo contínuo. Definiu a arquitetura de referência para sc ems with Applications", "authors": ["Johannes Jurgovsky", "Michael Granitzer", "Konstantin Ziegler", "Sylvie Calabretto", "Pierre-Édouard Portier", "Liyun He-Guelton", "Olivier Caelen"], "cited_by": 806, "net": 16.5, "url": "https://doi.org/10.1016/j.eswa.2018.01.037", "theme": "cards", "versions": [], "watch": [], "score": 8, "why": "Jurgovsky e colegas trataram a fraude como classificação de sequência, usando histórico ordenado do cartão em vez de features agregadas. Mostrou ganho consistente sobre modelos tabulares e virou baseline para abordagens sequenciais.", "new": false}, {"id": "W3068123808", "title": "Enhancing Graph Neural Network-based Fraud Detectors against Camouflaged Fraudsters", "year": 2020, "venue": "ACM International Conference on Information and Knowledge Management (CIKM)", "authors": ["Yingtong Dou", "Zhiwei Liu", "Li Sun", "Yutong Deng", "Hao Ming Peng", "Philip S. Yu"], "cited_by": 1045, "net": 15.5, "url": "https://doi.org/10.1145/3340531.3411903", "theme": "fraud_analytics", "versions": [], "watch": [], "score": 8, "why": "CARE identificou duas formas de camuflagem — de atributos e de relações — que degradam GNNs de fraude, e propôs agregação seletiva. É a primeira resposta sistemática ao fato de que o fraudador modela o detector.", "new": false}, {"id": "W2912336782", "title": "FaceForensics++: Learning to Detect Manipulated Facial Images", "year": 2019, "venue": "IEEE/CVF International Conference on Computer Vision (ICCV)", "authors": ["Andreas Rössler", "Davide Cozzolino", "Luisa Verdoliva", "Christian Rieß", "Justus Thies", "Matthias Nießner"], "cited_by": 4836, "net": 12.0, "url": "https://doi.org/10.1109/iccv.2019.00009", "theme": "genai_deepfakes", "versions": [], "watch": [], "score": 8, "why": "FaceForensics++ criou benchmark automatizado para detecção de manipulação facial em deepfakes, faceswap e reenactment. Tornou comparável uma área que viraria insumo direto de fraude de identidade e de KYC.", "new": false}, {"id": "W28978626   function fbBar(kind, ref, title) {
    if (!fbOn() || !ref) return "";
    const v = store.get("paw_votes", {})[fbKey(kind, ref)];
    return `<div class="fb" data-kind="${esc(kind)}" data-ref="${esc(ref)}" data-title="${esc(title || "")}">
      <button type="button" class="fb-btn" data-fb-vote="up" aria-pressed="${v === "up"}" title="útil / bom achado">👍</button>
      <button type="button" class="fb-btn" data-fb-vote="down" aria-pressed="${v === "down"}" title="irrelevante / fraco">👎</button>
      <button type="button" class="fb-link" data-fb-open>comentar</button>
      <span class="fb-msg" role="status"></span>
      ${fbForm()}
    </div>`;
  }

  // open comment box at the end of a page
  function fbBox(kind, ref, title, heading, placeholder) {
    if (!fbOn()) return "";
    return `<section class="fb-box fb" data-kind="${esc(kind)}" data-ref="${esc(ref)}" data-title="${esc(title || "")}">
      <h2 class="theme-h">${esc(heading)}</h2>
      ${fbForm(placeholder)}
      <span class="fb-msg" role="status"></span>
    </section>`;
  }

  async function fbSend(el, payload) {
    const msg = el.querySelector(".fb-msg");
    try {
      const r = await fetch("/api/feedback", {
        method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ topic: DATA.topic.slug, kind: el.dataset.kind, ref: el.dataset.ref,
          title: el.dataset.title, voter: voterId(), ...payload }),
      });
      const out = await r.json().catch(() => ({}));
      if (!r.ok || !out.ok) throw new Error(out.error || r.status);
      if (msg) msg.textContent = payload.comment ? "Obrigado! Comentário enviado." : "Obrigado!";
      return true;
    } catch (e) {
      if (msg) msg.textContent = `Não foi possível enviar (${e.message}).`;
      return false;
    }
  }

  function fbWire() {
    app.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-fb-vote], [data-fb-open]");
      if (!btn) return;
      const el = btn.closest(".fb");
      if (btn.hasAttribute("data-fb-open")) {
        const f = el.querySelector(".fb-form");
        f.hidden = !f.hidden;
        if (!f.hidden) f.querySelector("textarea").focus();
        return;
      }
      const votes = store.get("paw_votes", {});
      const k = fbKey(el.dataset.kind, el.dataset.ref);
      const vote = votes[k] === btn.dataset.fbVote ? "none" : btn.dataset.fbVote; // clicking again undoes
      if (await fbSend(el, { vote, name: store.get("paw_name", "") || null })) {
        if (vote === "none") delete votes[k]; else votes[k] = vote;
        store.set("paw_votes", votes);
        el.querySelectorAll("[data-fb-vote]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.fbVote === vote));
      }
    });
    app.addEventListener("submit", async (e) => {
      const form = e.target.closest(".fb-form");
      if (!form) return;
      e.preventDefault();
      const el = form.closest(".fb");
      const comment = form.comment.value.trim();
      const name = form.name.value.trim();
      if (!comment) { form.comment.focus(); return; }
      store.set("paw_name", name);
      const btn = form.querySelector("button");
      btn.disabled = true;
      if (await fbSend(el, { comment, name: name || null })) {
        form.comment.value = "";
        if (!el.classList.contains("fb-box")) form.hidden = true;
      }
      btn.disabled = false;
    });
  }

  function card(it, { showDate = false } = {}) {
    const meta = [];
    const regs = (DATA.topic && DATA.topic.regions) || {};
    if (it.region && regs[it.region]) meta.push(`<span class="region-tag">${esc(regs[it.region])}</span>`);
    if (it.watch_authors && it.watch_authors.length) {
      meta.push(it.watch_authors.map((n) => `<span class="star">⭐ ${esc(n)}</span>`).join(""));
    }
    if (it.watch_source) meta.push(`<span class="star">📌 ${esc(it.watch_source)}</span>`);
    if (showDate) meta.push(`<span class="date-tag">${esc(fmtDate(it._date, { day: "2-digit", month: "short", year: "numeric" }))}</span>`);
    meta.push(esc(it.venue || it.origin));
    const au = authorsShort(it.authors);
    if (au) meta.push(esc(au));
    if (it.cited_by) meta.push(`cit: ${it.cited_by}`);
    const orig = it.original_title && it.original_title !== it.title
      ? `<div class="orig">${esc(it.original_title)}</div>` : "";
    return `
      <article class="card${it.watch_authors && it.watch_authors.length ? " watch" : ""}">
        <div class="card-top">
          <h3><a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
          <span class="score ${scoreClass(it.score)}" title="nota de relevância × qualidade">${it.score}/10</span>
        </div>
        <div class="meta">${meta.join(" · ")}</div>
        <p class="summary">${md(it.summary)}</p>
        ${orig}
        ${fbBar("paper", it.key || it.url, it.title)}
      </article>`;
  }

  function setTab(tab) {
    document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
  }

  // ---------- views ----------
  function viewDigest(date) {
    setTab("digest");
    const ds = DATA.digests;
    if (!ds.length) { app.innerHTML = `<div class="empty">Nenhum digest ainda.</div>`; return; }
    const idx = Math.max(0, date ? ds.findIndex((d) => d.date === date) : 0);
    const d = ds[idx];
    const newer = ds[idx - 1], older = ds[idx + 1];
    const options = ds.map((x) => `<option value="${x.date}"${x.date === d.date ? " selected" : ""}>${esc(fmtPeriod(x, true))}</option>`).join("");

    let html = `
      <div class="day-nav">
        <button data-go="${older ? older.date : ""}" ${older ? "" : "disabled"} aria-label="Digest anterior">← anterior</button>
        <select id="day-select" aria-label="Escolher digest">${options}</select>
        <button data-go="${newer ? newer.date : ""}" ${newer ? "" : "disabled"} aria-label="Próximo digest">próximo →</button>
      </div>
      <h1 class="day">${esc(fmtPeriod(d))}</h1>
      ${d.headline ? `<p class="dek">${md(d.headline.charAt(0).toUpperCase() + d.headline.slice(1))}</p>` : ""}
      <div class="stats">
        <span><b>${d.stats.candidates}</b> candidatos novos</span>
        <span><b>${d.stats.triaged}</b> avaliados</span>
        <span><b>${d.items.length}</b> selecionados</span>
        ${d.model ? `<span>modelo: ${esc(d.model.split("/").pop())}</span>` : ""}
      </div>`;
    if (d.trend) html += `<div class="trend"><span class="label">🔥 Tendência do período</span>${md(d.trend)}</div>`;
    if (!d.items.length) html += `<div class="empty">Nada acima da barra neste período.</div>`;
    const regs = (DATA.topic && DATA.topic.regions) || {};
    if (Object.keys(regs).length) {
      html += `<div class="chips region-chips">` + [["", "Todos"], ...Object.entries(regs)].map(([k, v]) =>
        `<button class="chip" data-region="${esc(k)}" aria-pressed="${state.region === k}">${esc(v)}</button>`).join("") + `</div>`;
    }
    const inRegion = (it) => !state.region || it.region === state.region;

    for (const key of Object.keys(DATA.themes)) {
      const group = d.items.filter((it) => it.theme === key && inRegion(it));
      if (!group.length) continue;
      html += `<h2 class="theme-h">${esc(themeLabel(key))}</h2>` + group.map((it) => card(it)).join("");
    }
    if (d.quick && d.quick.length) {
      html += `<section class="quick"><h2 class="theme-h">Menções rápidas</h2><ul>` +
        d.quick.filter(inRegion).map((q) => `<li>${q.region && regs[q.region] ? `<span class="region-tag">${esc(regs[q.region])}</span> ` : ""}<a href="${esc(safeUrl(q.url))}" target="_blank" rel="noopener">${esc(q.title)}</a>${q.note ? ` — ${md(q.note)}` : ""}</li>`).join("") +
        `</ul></section>`;
    }
    html += fbBox("digest", d.date, d.headline || d.date, "O que achou deste digest?",
      "O que foi útil, o que sobrou, o que faltou? Algum paper que você esperava ver aqui?");
    app.innerHTML = html;
    app.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.go) location.hash = `#/d/${b.dataset.go}`;
    }));
    document.getElementById("day-select").addEventListener("change", (e) => { location.hash = `#/d/${e.target.value}`; });
    app.querySelectorAll("[data-region]").forEach((b) => b.addEventListener("click", () => {
      state.region = b.dataset.region; viewDigest(d.date);
    }));
  }

  function allItems() {
    const out = [];
    for (const d of DATA.digests) for (const it of d.items) out.push({ ...it, _date: d.date });
    return out;
  }

  function viewArchive() {
    setTab("arquivo");
    const chips = Object.entries(DATA.themes).map(([k, v]) =>
      `<button class="chip" data-theme="${k}" aria-pressed="${state.themes.has(k)}">${esc(v)}</button>`).join("");
    app.innerHTML = `
      <h1 class="day">Arquivo</h1>
      <p class="dek">Todos os papers selecionados, de todos os digests.</p>
      <div class="filters">
        <input class="search" id="q" type="search" placeholder="Buscar por título, autor, venue, resumo…" value="${esc(state.q)}">
        <div class="chips">${chips}</div>
        <div class="filter-row">
          <label>Nota mínima <input id="min" type="range" min="0" max="10" value="${state.minScore}"> <b id="minv">${state.minScore}</b></label>
          <label><input id="ow" type="checkbox" ${state.onlyWatch ? "checked" : ""}> só da watchlist ⭐📌</label>
        </div>
      </div>
      <div class="count" id="count"></div>
      <div id="results"></div>`;

    const items = allItems();
    const render = () => {
      const q = state.q.trim().toLowerCase();
      const res = items.filter((it) =>
        it.score >= state.minScore &&
        (!state.themes.size || state.themes.has(it.theme)) &&
        (!state.onlyWatch || (it.watch_authors && it.watch_authors.length) || it.watch_source) &&
        (!q || [it.title, it.original_title, it.summary, it.venue, (it.authors || []).join(" "), (it.institutions || []).join(" ")]
          .join(" ").toLowerCase().includes(q)));
      document.getElementById("count").textContent = `${res.length} de ${items.length} papers`;
      document.getElementById("results").innerHTML = res.length
        ? res.map((it) => card(it, { showDate: true })).join("")
        : `<div class="empty">Nenhum paper com esses filtros.</div>`;
    };
    document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
    document.getElementById("min").addEventListener("input", (e) => {
      state.minScore = +e.target.value; document.getElementById("minv").textContent = e.target.value; render();
    });
    document.getElementById("ow").addEventListener("change", (e) => { state.onlyWatch = e.target.checked; render(); });
    app.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
      const k = c.dataset.theme;
      state.themes.has(k) ? state.themes.delete(k) : state.themes.add(k);
      c.setAttribute("aria-pressed", state.themes.has(k));
      render();
    }));
    render();
  }

  function viewTrends() {
    setTab("tendencias");
    const ds = DATA.digests.filter((d) => d.trend);
    app.innerHTML = `
      <h1 class="day">Tendências</h1>
      <p class="dek">A síntese de cada digest, em ordem cronológica reversa.</p>
      ${ds.length ? `<div class="timeline">${ds.map((d) => `
        <div class="tl-item">
          <a class="d" href="#/d/${d.date}">${esc(fmtPeriod(d))}</a>
          <p>${md(d.trend)}</p>
        </div>`).join("")}</div>` : `<div class="empty">Sem tendências ainda.</div>`}`;
  }

  function viewWatchlist() {
    setTab("watchlist");
    const wl = DATA.watchlist || {};
    const hits = {};
    for (const it of allItems()) for (const n of [...(it.watch_authors || []), ...(it.watch_source ? [it.watch_source] : [])]) hits[n] = (hits[n] || 0) + 1;
    const people = wl.researchers || [];
    const known = ["EUA", "Europa", "China/Ásia", "Brasil"];
    const regions = [...known, ...new Set(people.map((p) => p.region || "Outros").filter((r) => !known.includes(r)))];
    const L = Object.assign({ researchers: "Pesquisadores", journals: "Journals", centers: "Centros & laboratórios",
      practitioners: "Praticantes & fontes", historical: "Referências históricas" }, DATA.topic.watchlist_labels || {});
    function person(p, evoCount) {
      const links = Object.entries(p.links || {}).filter(([, u]) => u)
        .map(([k, u]) => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${esc(k)}</a>`);
      if (p.openalex_id) links.push(`<a href="https://openalex.org/authors/${esc(p.openalex_id)}" target="_blank" rel="noopener">openalex</a>`);
      const status = p.status ? `<span class="status">${esc(p.status)}${p.since ? ` em ${esc(p.since)}` : ""}</span>` : "";
      return `<div class="person${p.status ? " hist" : ""}">
        <div class="n">${esc(p.name)} ${status}</div>
        <div class="i">${esc(p.institution || "")}</div>
        ${p.area ? `<div class="a">${esc(p.area)}</div>` : ""}
        ${p.why ? `<div class="w">${esc(p.why)}</div>` : ""}
        ${hits[p.name] ? `<div class="hits">⭐ ${hits[p.name]} paper(s) no arquivo</div>` : ""}
        ${evoCount ? `<div class="hits">🏛️ ${evoCount} marco(s) na Evolução</div>` : ""}
        ${links.length ? `<div class="l">${links.join("")}</div>` : ""}
      </div>`;
    }
    let html = `
      <h1 class="day">Watchlist</h1>
      <p class="dek">Referências monitoradas. Papers novos desses autores entram na triagem com bônus e ganham ⭐; posts, relatórios e normas das fontes ganham 📌.</p>
      <section class="wl-section"><h2>${esc(L.researchers)} <span class="muted">(${people.length})</span></h2>`;
    for (const r of regions) {
      const group = people.filter((p) => (p.region || "Outros") === r);
      if (!group.length) continue;
      html += `<h3 class="region-h">${esc(r)} · ${group.length}</h3><div class="people">` + group.map(person).join("") + `</div>`;
    }
    html += `</section>`;
    const hist = wl.historical || [];
    if (hist.length) {
      const evoHits = {};
      for (const e of (DATA.evolution || {}).eras || []) for (const m of e.milestones) for (const n of m.watch || []) evoHits[n] = (evoHits[n] || 0) + 1;
      html += `<section class="wl-section"><h2>${esc(L.historical)} <span class="muted">(${hist.length})</span></h2>
        <p class="muted wl-note">Não são mais monitorados no dia a dia; as obras entram na aba <a href="#/evolucao">Evolução</a>.</p>
        <div class="people">` + hist.map((p) => person(p, evoHits[p.name])).join("") + `</div></section>`;
    }
    const simple = (title, arr, nameKey, subKey) => !arr || !arr.length ? "" : `
      <section class="wl-section"><h2>${title} <span class="muted">(${arr.length})</span></h2><ul class="list-simple">` +
      arr.map((x) => {
        const name = x.url ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"><b>${esc(x[nameKey])}</b></a>` : `<b>${esc(x[nameKey])}</b>`;
        const hit = hits[x[nameKey]] ? ` <span class="hits">📌 ${hits[x[nameKey]]} no arquivo</span>` : "";
        return `<li>${name}${subKey && x[subKey] ? ` <span class="muted">· ${esc(x[subKey])}</span>` : ""}${x.why ? ` — ${esc(x.why)}` : ""}${hit}</li>`;
      }).join("") + `</ul></section>`;
    html += simple(esc(L.journals), wl.journals, "name");
    html += simple(esc(L.centers), wl.centers, "name", "institution");
    html += simple(esc(L.practitioners), wl.practitioners, "name", "org");
    html += fbBox("watchlist", "geral", "Watchlist", "Falta alguém?",
      "Algum pesquisador, journal, centro ou fonte que deveria estar aqui (ou sair)?");
    app.innerHTML = html;
  }

  // ---------- evolution ----------
  const evoState = { theme: null };

  function changesBox(ev) {
    const ch = ev.changes;
    if (!ch || !((ch.added || []).length || (ch.removed || []).length || ch.note)) return "";
    const since = !ch.since ? "" : ch.since.length > 7 ? fmtDate(ch.since)
      : new Date(ch.since + "-15T12:00:00").toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    const li = (m, sign) => `<li><span class="chg-${sign === "+" ? "add" : "del"}">${sign}</span> ${esc(m.title)} <span class="muted">(${esc(m.year ?? "")})</span></li>`;
    return `<details class="changes" open>
      <summary>O que mudou desde ${esc(since)} · <b>+${(ch.added || []).length}</b> / <b>−${(ch.removed || []).length}</b> marcos${ev.mode === "completa" ? " · revisão completa" : ""}</summary>
      ${ch.note ? `<p>${md(ch.note)}</p>` : ""}
      <ul>${(ch.added || []).map((m) => li(m, "+")).join("")}${(ch.removed || []).map((m) => li(m, "−")).join("")}</ul>
    </details>`;
  }

  function viewEvolution() {
    setTab("evolucao");
    const ev = DATA.evolution;
    if (!ev || !ev.eras || !ev.eras.length) {
      app.innerHTML = `<h1 class="day">Evolução</h1>
        <div class="empty">A linha do tempo do estado da arte ainda não foi gerada para este tema.<br>
        Ela é montada uma vez por mês a partir da rede de citações.</div>`;
      return;
    }
    const used = new Set(ev.eras.flatMap((e) => e.milestones.map((m) => m.theme)));
    const chips = [`<button class="chip" data-evo="" aria-pressed="${!evoState.theme}">Todos os temas</button>`]
      .concat(Object.entries(DATA.themes).filter(([k]) => used.has(k)).map(([k, v]) =>
        `<button class="chip" data-evo="${esc(k)}" aria-pressed="${evoState.theme === k}">${esc(v)}</button>`)).join("");
    const thread = evoState.theme && (ev.threads || []).find((t) => t.theme === evoState.theme);

    const milestone = (m) => {
      const au = authorsShort(m.authors);
      const meta = [esc(m.venue || ""), au ? esc(au) : "", m.cited_by ? `${m.cited_by.toLocaleString("pt-BR")} citações` : ""]
        .filter(Boolean).join(" · ");
      return `<li class="ms">
        <span class="ms-year">${esc(m.year ?? "")}</span>
        <div class="ms-body">
          ${m.new ? `<span class="ms-new">novo</span>` : ""}<a class="ms-title" href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener">${esc(m.title)}</a>
          <div class="meta">${meta}</div>
          ${m.why ? `<p class="summary">${md(m.why)}</p>` : ""}
          <span class="ms-theme">${esc(themeLabel(m.theme))}</span>
          ${fbBar("marco", m.id || m.url, m.title)}
        </div>
      </li>`;
    };

    let html = `
      <h1 class="day">Evolução do estado da arte</h1>
      ${ev.overview ? `<p class="dek">${md(ev.overview)}</p>` : ""}
      <div class="stats">
        <span><b>${ev.stats.milestones}</b> marcos</span>
        <span>rede de <b>${ev.stats.network.toLocaleString("pt-BR")}</b> obras</span>
        <span>gerado em ${esc(fmtDate(ev.generated))}</span>
        ${ev.model ? `<span>modelo: ${esc(ev.model.split("/").pop())}</span>` : ""}
      </div>
      ${changesBox(ev)}
      <div class="chips evo-chips">${chips}</div>
      ${thread ? `<div class="trend"><span class="label">Como este tema evoluiu</span>${md(thread.line)}</div>` : ""}
      <div class="evo">`;
    for (const e of ev.eras) {
      const ms = e.milestones.filter((m) => !evoState.theme || m.theme === evoState.theme);
      html += `<section class="era">
        <div class="era-label">${esc(e.label)}</div>
        <h2 class="era-title">${esc(e.title)}</h2>
        ${e.summary ? `<p class="era-summary">${md(e.summary)}</p>` : ""}
        ${ms.length ? `<ol class="ms-list">${ms.map(milestone).join("")}</ol>`
          : `<p class="muted era-none">Nenhum marco deste tema nesta época.</p>`}
      </section>`;
    }
    html += `</div>`;
    if (ev.now && ev.now.summary) {
      html += `<section class="now">
        <h2 class="theme-h">Onde estamos agora</h2>
        <p>${md(ev.now.summary)}</p>
        ${ev.now.open_questions && ev.now.open_questions.length
          ? `<h3 class="now-q">Perguntas em aberto</h3><ul class="list-simple">${ev.now.open_questions.map((q) => `<li>${md(q)}</li>`).join("")}</ul>` : ""}
      </section>`;
    }
    html += fbBox("evolucao", ev.generated, "Evolução do estado da arte", "A linha do tempo faz sentido?",
      "Falta algum marco? Algum não deveria estar aí? A divisão em épocas faz sentido para você?");
    app.innerHTML = html;
    app.querySelectorAll("[data-evo]").forEach((c) => c.addEventListener("click", () => {
      evoState.theme = c.dataset.evo || null;
      const y = window.scrollY;
      viewEvolution();
      window.scrollTo(0, y);
    }));
  }

  // ---------- annual review ----------
  const COUNTRY = { BR: "Brasil", US: "EUA", GB: "Reino Unido", CN: "China", DE: "Alemanha", FR: "França", IN: "Índia",
    CA: "Canadá", AU: "Austrália", NL: "Holanda", IT: "Itália", ES: "Espanha", CH: "Suíça", SG: "Singapura", HK: "Hong Kong",
    JP: "Japão", KR: "Coreia do Sul", BE: "Bélgica", SE: "Suécia", DK: "Dinamarca", IL: "Israel", TW: "Taiwan", PT: "Portugal" };
  const country = (c) => COUNTRY[c] || c || "";

  function viewAnnual(year) {
    setTab("anual");
    const all = DATA.annual || {};
    const years = Object.keys(all).sort().reverse();
    if (!years.length) {
      app.innerHTML = `<h1 class="day">Retrospectiva anual</h1>
        <div class="empty">A retrospectiva ainda não foi gerada para este tema.<br>Ela é atualizada todo mês, junto com a Evolução.</div>`;
      return;
    }
    const y = years.includes(year) ? year : years[0];
    const d = all[y];
    const regs = (DATA.topic && DATA.topic.regions) || {};
    const pct = (x) => `${Math.round(x * 100)}%`;
    const chg = (g) => g.change === null || g.change === undefined ? "—"
      : `<span class="${g.change >= 0 ? "up" : "down"}">${g.change >= 0 ? "▲" : "▼"} ${Math.abs(Math.round(g.change * 100))}%</span>`;
    const card = (h) => {
      const meta = [];
      if (h.region && regs[h.region]) meta.push(`<span class="region-tag">${esc(regs[h.region])}</span>`);
      if (h.watch_authors && h.watch_authors.length) meta.push(h.watch_authors.map((n) => `<span class="star">⭐ ${esc(n)}</span>`).join(""));
      meta.push(esc(h.venue || ""));
      const au = authorsShort(h.authors); if (au) meta.push(esc(au));
      meta.push(`${(h.cited_by || 0).toLocaleString("pt-BR")} citações`);
      return `<article class="card${h.watch_authors && h.watch_authors.length ? " watch" : ""}">
        <div class="card-top"><h3><a href="${esc(safeUrl(h.url))}" target="_blank" rel="noopener">${esc(h.title)}</a></h3>
        <span class="score ${scoreClass(h.score)}">${h.score}/10</span></div>
        <div class="meta">${meta.join(" · ")}</div>
        ${h.why ? `<p class="summary">${md(h.why)}</p>` : ""}
      </article>`;
    };
    let html = `
      <div class="chips year-chips">${years.map((k) => `<button class="chip" data-year="${k}" aria-pressed="${k === y}">${k}${all[k].partial ? " (parcial)" : ""}</button>`).join("")}</div>
      <h1 class="day">Retrospectiva ${esc(y)}${d.partial ? ` <span class="muted">até ${esc(fmtDate(d.generated, { day: "2-digit", month: "short" }))}</span>` : ""}</h1>
      ${d.overview ? `<p class="dek">${md(d.overview)}</p>` : ""}
      <div class="stats">
        <span><b>${d.stats.works.toLocaleString("pt-BR")}</b> obras do ano</span>
        <span><b>${d.stats.triaged}</b> avaliadas</span>
        <span><b>${d.highlights.length}</b> destaques</span>
        ${d.model ? `<span>modelo: ${esc(d.model.split("/").pop())}</span>` : ""}
      </div>`;
    if ((d.trends || []).length) {
      html += `<h2 class="theme-h">Tendências do ano</h2><div class="trends-grid">` +
        d.trends.map((t) => `<div class="trend-card"><b>${esc(t.title || "")}</b><p>${md(t.text || "")}</p></div>`).join("") + `</div>`;
    }
    const geo = d.geography || {};
    html += `<h2 class="theme-h">Onde a inovação acontece</h2>${d.innovation ? `<p>${md(d.innovation)}</p>` : ""}
      <div class="geo">
        <div><h3 class="region-h">Quem publica</h3>${(geo.sectors || []).map((s) =>
          `<div class="bar-row"><span>${esc(s.name)}</span><span class="bar"><i style="width:${pct(s.share)}"></i></span><b>${pct(s.share)}</b></div>`).join("")}
          <p class="muted small">% das ${(geo.works || 0).toLocaleString("pt-BR")} obras com ao menos um autor do setor.</p></div>
        <div><h3 class="region-h">Instituições</h3><ol class="list-simple">${(geo.institutions || []).slice(0, 10).map((i) =>
          `<li>${esc(i.name)} <span class="muted">· ${esc(country(i.country))} · ${i.works}</span></li>`).join("")}</ol></div>
        <div><h3 class="region-h">Países</h3><ol class="list-simple">${(geo.countries || []).slice(0, 10).map((c) =>
          `<li>${esc(country(c.code))} <span class="muted">· ${c.works}</span></li>`).join("")}</ol></div>
        ${(geo.companies || []).length ? `<div><h3 class="region-h">Empresas que publicam</h3><ol class="list-simple">${geo.companies.slice(0, 10).map((c) =>
          `<li>${esc(c.name)} <span class="muted">· ${esc(country(c.country))} · ${c.works}</span></li>`).join("")}</ol></div>` : ""}
      </div>`;
    html += `<h2 class="theme-h">Destaques do ano</h2>`;
    for (const key of Object.keys(DATA.themes)) {
      const group = d.highlights.filter((h) => h.theme === key);
      if (group.length) html += `<h3 class="region-h">${esc(themeLabel(key))}</h3>` + group.map(card).join("");
    }
    if ((d.growth || []).length) {
      html += `<h2 class="theme-h">Volume de publicações por subtema</h2>
        <table class="growth"><thead><tr><th>Subtema</th><th>${+y - 1}</th><th>${esc(y)}${d.partial ? "*" : ""}</th><th>Variação</th></tr></thead><tbody>` +
        d.growth.map((g) => `<tr><td title="${esc(g.query)}">${esc(g.label)}</td><td>${g.prev.toLocaleString("pt-BR")}</td><td>${g.cur_full_year.toLocaleString("pt-BR")}</td><td>${chg(g)}</td></tr>`).join("") +
        `</tbody></table>${d.partial ? `<p class="muted small">* ano em curso, projetado para 12 meses; o OpenAlex indexa com algum atraso, então a variação recente tende a sair subestimada.</p>` : ""}`;
    }
    app.innerHTML = html;
    app.querySelectorAll("[data-year]").forEach((b) => b.addEventListener("click", () => { location.hash = `#/anual/${b.dataset.year}`; }));
  }

  // ---------- ask the archive (POST /api/ask) ----------
  const askState = { history: [], busy: false };

  function renderAnswer(h) {
    const cite = (n) => {
      const src = h.sources.find((x) => x.n === +n);
      return src && src.url
        ? `<a class="cite" href="${esc(safeUrl(src.url))}" target="_blank" rel="noopener" title="${esc(src.title)}">[${n}]</a>`
        : `<span class="cite">[${n}]</span>`;
    };
    const body = md(h.a).split(/\n{2,}/).map((p) => `<p>${p.replace(/\[(\d{1,2})\]/g, (_, n) => cite(n))}</p>`).join("");
    const used = new Set([...h.a.matchAll(/\[(\d{1,2})\]/g)].map((m) => +m[1]));
    const list = h.sources.filter((x) => used.has(x.n));
    return `<article class="qa">
      <div class="q">${esc(h.q)}</div>
      <div class="a">${body}</div>
      ${list.length ? `<ol class="qa-src">${list.map((x) => `<li value="${x.n}">${x.url
        ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}
        <span class="muted">· ${esc(x.kind)}${x.when ? `, ${esc(x.when)}` : ""}</span></li>`).join("")}</ol>` : ""}
      ${fbBar("resposta", h.q, h.q)}
    </article>`;
  }

  function viewAsk() {
    setTab("pergunte");
    if (!fbOn()) {
      app.innerHTML = `<h1 class="day">Pergunte</h1><div class="empty">Disponível só no site publicado.</div>`;
      return;
    }
    const themes = Object.values(DATA.themes).slice(0, 3).map((t) => t.replace(/^\S+\s/, "").toLowerCase());
    const examples = [
      `O que há de evidência recente sobre ${themes[0] || "o tema"}?`,
      `Quais foram os grandes marcos do campo e o que mudou com eles?`,
      `O que os papers dizem sobre ${themes[1] || themes[0] || "o tema"}, e quais são as limitações?`,
    ];
    app.innerHTML = `
      <h1 class="day">Pergunte ao arquivo</h1>
      <p class="dek">A IA responde usando só os papers deste arquivo (digests e Evolução) e cita cada um. Se o arquivo não cobre o assunto, ela diz.</p>
      <div class="chips ask-examples">${examples.map((x) => `<button type="button" class="chip" data-example="${esc(x)}">${esc(x)}</button>`).join("")}</div>
      <div id="qa-list">${askState.history.map(renderAnswer).join("")}</div>
      <form id="ask-form" class="ask-form">
        <textarea name="q" rows="3" maxlength="600" placeholder="Ex.: o que se sabe sobre o efeito do trabalho híbrido em promoções?" required></textarea>
        <div class="fb-row">
          <span class="muted ask-hint">${askState.history.length ? "Perguntas de seguimento usam a conversa acima." : "Leva uns 20–40 segundos."}</span>
          ${askState.history.length ? `<button type="button" class="fb-link" id="ask-reset">nova conversa</button>` : ""}
          <button type="submit">Perguntar</button>
        </div>
        <span class="fb-msg" id="ask-msg" role="status"></span>
      </form>`;
    const form = document.getElementById("ask-form");
    const msg = document.getElementById("ask-msg");
    app.querySelectorAll("[data-example]").forEach((b) => b.addEventListener("click", () => {
      form.q.value = b.dataset.example;
      form.q.focus();
    }));
    const reset = document.getElementById("ask-reset");
    if (reset) reset.addEventListener("click", () => { askState.history = []; viewAsk(); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = form.q.value.trim();
      if (q.length < 5 || askState.busy) return;
      askState.busy = true;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      msg.textContent = "Consultando o arquivo…";
      try {
        const r = await fetch("/api/ask", {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
          body: JSON.stringify({ topic: DATA.topic.slug, question: q, voter: voterId(), name: store.get("paw_name", "") || null,
            history: askState.history.slice(-2).map((h) => ({ q: h.q, a: h.a })) }),
        });
        const out = await r.json().catch(() => ({}));
        if (!r.ok || !out.ok) throw new Error(out.error || r.status);
        askState.history.push({ q, a: out.answer, sources: out.sources || [] });
        askState.busy = false;
        viewAsk();
        const items = app.querySelectorAll(".qa");
        if (items.length) items[items.length - 1].scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (err) {
        msg.textContent = `Não foi possível responder (${err.message}).`;
        btn.disabled = false;
        askState.busy = false;
      }
    });
  }

  // ---------- topic identity + switcher ----------
  function setupTopic(d) {
    const t = d.topic || {};
    const b = t.brand || {};
    if (t.name) document.title = t.name;
    if (b.mark) document.getElementById("brand-mark").textContent = b.mark;
    if (b.text) document.getElementById("brand-text").innerHTML = `${esc(b.text)} <em>${esc(b.em || "Watch")}</em>`;
    const sw = document.getElementById("topic-switch");
    if (sw && d.topics && d.topics.length > 1) {
      sw.innerHTML = d.topics.map((x) => `<option value="${esc(x.slug)}"${x.slug === t.slug ? " selected" : ""}>${esc(x.name)}</option>`).join("");
      sw.hidden = false;
      sw.addEventListener("change", (e) => { location.href = `../${e.target.value}/index.html`; });
    }
  }

  // ---------- router ----------
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const [a, b] = h.split("/");
    if (a === "d") viewDigest(b);
    else if (a === "arquivo") viewArchive();
    else if (a === "tendencias") viewTrends();
    else if (a === "watchlist") viewWatchlist();
    else if (a === "evolucao") viewEvolution();
    else if (a === "anual") viewAnnual(b);
    else if (a === "pergunte") viewAsk();
    else viewDigest();
    window.scrollTo(0, 0);
  }

  Promise.resolve(JSON.parse(document.getElementById("pa-data").textContent))
    .then((d) => {
      DATA = d;
      setupTopic(d);
      const n = d.digests.reduce((s, x) => s + x.items.length, 0);
      document.getElementById("foot-meta").textContent = `${d.digests.length} digests · ${n} papers · atualizado em ${fmtDate(d.generated)}`;
      if (fbOn()) fbWire();
      else { const t = document.getElementById("tab-ask"); if (t) t.hidden = true; }
      window.addEventListener("hashchange", route);
      route();
    })
    .catch((e) => { app.innerHTML = `<div class="empty">Não foi possível carregar os dados (${esc(e.message)}).</div>`; });
})();

// Claro por padrão; o botão alterna para o escuro e lembra a escolha neste navegador.
(() => {
  const KEY = "pa-watch-bb-theme";
  const root = document.documentElement;
  const read = () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } };
  const save = (v) => { try { localStorage.setItem(KEY, v); } catch (e) { /* sem storage: só não lembra */ } };

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "theme-toggle";
  const apply = (mode) => {
    root.dataset.theme = mode;
    const dark = mode === "dark";
    btn.textContent = dark ? "☀ Claro" : "☾ Escuro";
    btn.setAttribute("aria-label", dark ? "Mudar para o tema claro" : "Mudar para o tema escuro");
  };
  btn.addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    apply(next);
    save(next);
  });
  apply(read() === "dark" ? "dark" : "light");
  document.querySelector(".top-inner").appendChild(btn);
})();
</script>
</body>
</html>
