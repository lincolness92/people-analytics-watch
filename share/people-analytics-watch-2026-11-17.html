<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Watch</title>
  <meta name="description" content="Digest de pesquisa state-of-the-art.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
  <style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --ink: #1d1b18;
  --ink-2: #4a463f;
  --muted: #807a70;
  --line: #e4dfd5;
  --accent: #b4431f;
  --accent-soft: #f6e4dc;
  --star: #a8730b;
  --star-soft: #f7ecd2;
  --chip: #efebe3;
  --score-hi: #1f6f4a;
  --score-mid: #8a6d12;
  --score-lo: #7a746a;
  --serif: "Iowan Old Style", "Charter", "Source Serif Pro", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513;
    --surface: #1f1d1a;
    --ink: #ece8e1;
    --ink-2: #c4beb3;
    --muted: #8f897f;
    --line: #34312c;
    --accent: #ec8a63;
    --accent-soft: #3a2519;
    --star: #e2b24f;
    --star-soft: #382c14;
    --chip: #2a2824;
    --score-hi: #6fcf9c;
    --score-mid: #e2c25b;
    --score-lo: #9d978d;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
}
a { color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }

/* header */
.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.brand em { color: var(--accent); font-style: italic; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs a {
  text-decoration: none; font-size: 14px; color: var(--ink-2);
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}
.tabs a:hover { background: var(--chip); }
.tabs a.active { background: var(--ink); color: var(--bg); }
.trends-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 8px; }
.trend-card { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.trend-card p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.geo { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 22px; margin-bottom: 10px; }
.bar-row { display: grid; grid-template-columns: 1fr 90px 40px; gap: 8px; align-items: center; font-size: 14px; margin-bottom: 6px; }
.bar { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.small { font-size: 12px; }
table.growth { width: 100%; border-collapse: collapse; font-size: 14px; }
table.growth th, table.growth td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.growth td:nth-child(n+2), table.growth th:nth-child(n+2) { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--score-hi); font-weight: 600; } .down { color: var(--score-lo); font-weight: 600; }
.year-chips { margin-bottom: 6px; }
.region-tag { font-size: 12px; font-weight: 600; white-space: nowrap; }
.region-chips { margin: -8px 0 18px; }
.topic-switch { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; max-width: 100%; }

main { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }

/* digest header */
.day-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.day-nav button, .day-nav select {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.day-nav button:disabled { opacity: .35; cursor: default; }
h1.day {
  font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5vw, 40px);
  line-height: 1.15; margin: 10px 0 6px; letter-spacing: -0.01em;
}
.dek { color: var(--ink-2); margin: 0 0 22px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* trend callout */
.trend {
  background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; margin: 0 0 32px;
  font-family: var(--serif); font-size: 17px; line-height: 1.55;
}
.trend .label { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* theme sections */
.theme-h {
  font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2); margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 12px;
}
.card.watch { border-left: 3px solid var(--star); }
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.card h3 { font-family: var(--serif); font-size: 19px; line-height: 1.3; margin: 0; font-weight: 600; flex: 1; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.score {
  flex: none; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
}
.score.hi { color: var(--score-hi); }
.score.mid { color: var(--score-mid); }
.score.lo { color: var(--score-lo); }
.meta { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.meta .star { color: var(--star); background: var(--star-soft); padding: 1px 7px; border-radius: 999px; font-weight: 600; margin-right: 4px; }
.summary { margin: 0; color: var(--ink-2); }
.summary strong { color: var(--ink); }
.orig { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

.quick { margin-top: 30px; }
.quick ul { padding-left: 18px; margin: 0; }
.quick li { margin-bottom: 8px; color: var(--ink-2); }
.quick li a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }

/* filters */
.filters { display: grid; gap: 12px; margin-bottom: 22px; }
.search {
  width: 100%; font: inherit; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--chip); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.filter-row input[type=range] { accent-color: var(--accent); }
.count { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.date-tag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* trends timeline */
.timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 20px; }
.tl-item { position: relative; margin-bottom: 24px; }
.tl-item::before {
  content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
}
.tl-item a.d { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.tl-item p { margin: 4px 0 0; font-family: var(--serif); font-size: 17px; }

/* watchlist */
.wl-section { margin-bottom: 36px; }
.wl-section h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 4px; }
.region-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 22px 0 10px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.person .n { font-weight: 650; }
.person .i { font-size: 13px; color: var(--muted); }
.person .a { font-size: 13px; color: var(--accent); margin-top: 4px; }
.person .w { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.person .l { font-size: 12px; margin-top: 6px; display: flex; gap: 10px; }
.person .l a { color: var(--muted); }
.person .hits { font-size: 12px; margin-top: 6px; color: var(--star); font-weight: 600; }
.list-simple { padding-left: 18px; }
.list-simple li { margin-bottom: 8px; color: var(--ink-2); }
.list-simple li b { color: var(--ink); }
.list-simple .hits { font-size: 12px; color: var(--star); font-weight: 600; white-space: nowrap; }

.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 16px; padding-bottom: 32px; border-top: 1px solid var(--line); }

@media (max-width: 560px) {
  .card { padding: 14px; }
  .card h3 { font-size: 17px; }
  .brand { font-size: 18px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chip { white-space: nowrap; }
}

/* evolution */
.evo-chips { margin-bottom: 22px; }
.evo { position: relative; margin-left: 6px; border-left: 2px solid var(--line); padding-left: 22px; }
.era { position: relative; margin-bottom: 38px; }
.era::before {
  content: ""; position: absolute; left: -30px; top: 4px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--accent); border: 3px solid var(--bg);
}
.era-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.era-title { font-family: var(--serif); font-size: 24px; line-height: 1.2; margin: 4px 0 8px; }
.era-summary { color: var(--ink-2); margin: 0 0 16px; }
.era-none { font-size: 14px; }
.ms-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ms { display: flex; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.ms-year { flex: none; font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 44px; }
.ms-body { min-width: 0; }
.ms-title { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.3; text-decoration: none; }
.ms-title:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.ms .meta { margin: 4px 0 6px; }
.ms-theme { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--ink-2); background: var(--chip); border-radius: 999px; padding: 1px 9px; }
.now { margin-top: 10px; }
.now p { color: var(--ink-2); }
.now-q { font-size: 15px; margin: 16px 0 6px; }
@media (max-width: 560px) {
  .evo { padding-left: 16px; }
  .era::before { left: -24px; }
  .ms { flex-direction: column; gap: 4px; padding: 12px 14px; }
}
.changes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin: 0 0 20px; }
.changes summary { cursor: pointer; font-size: 14px; color: var(--ink-2); }
.changes p { margin: 10px 0 6px; color: var(--ink-2); }
.changes ul { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.changes li { margin-bottom: 4px; }
.chg-add { color: var(--score-hi); font-weight: 700; }
.chg-del { color: var(--accent); font-weight: 700; }
.ms-new { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--bg); background: var(--score-hi); border-radius: 999px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; }

.person .status { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 1px 7px; margin-left: 4px; vertical-align: 1px; }
.person.hist { background: var(--chip); }
.wl-note { margin: 0 0 12px; font-size: 14px; }

/* feedback */
.fb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.fb-btn { font: inherit; font-size: 14px; line-height: 1; padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; filter: grayscale(1); opacity: .7; }
.fb-btn:hover { opacity: 1; filter: none; }
.fb-btn[aria-pressed="true"] { filter: none; opacity: 1; background: var(--accent-soft); border-color: var(--accent); }
.fb-link { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.fb-msg { font-size: 13px; color: var(--muted); }
.fb-form { flex-basis: 100%; display: grid; gap: 8px; margin-top: 4px; }
.fb-form textarea, .fb-form input { font: inherit; font-size: 14px; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.fb-row { display: flex; gap: 8px; }
.fb-row input { flex: 1; min-width: 0; }
.fb-row button { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); cursor: pointer; }
.fb-row button:disabled { opacity: .5; }
.fb-box { display: block; margin-top: 36px; }
.fb-box .fb-msg { display: block; margin-top: 6px; }
.fb-form[hidden] { display: none; }

/* ask */
.ask-examples { margin-bottom: 18px; }
.ask-examples .chip { text-align: left; white-space: normal; }
.ask-form { display: grid; gap: 8px; margin-top: 18px; }
.ask-form textarea { font: inherit; width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); }
.ask-form .fb-row { align-items: center; }
.ask-hint { flex: 1; font-size: 13px; }
.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.qa .q { font-weight: 650; margin-bottom: 8px; }
.qa .a p { margin: 0 0 10px; color: var(--ink-2); }
.cite { font-size: 12px; font-weight: 700; color: var(--accent); text-decoration: none; vertical-align: 2px; margin-left: 1px; }
.qa-src { font-size: 13px; padding-left: 22px; margin: 6px 0 0; color: var(--ink-2); }
.qa-src li { margin-bottom: 4px; }
</style>
</head>

stas sabem quando ignorar o modelo. Lição: antes de dar veto a recrutadores experientes, audite se o override melhora ou degrada a acurácia e treine o uso calibrado da recomendação algorítmica."}, {"key": "doi:10.1007/s10869-026-10164-6", "title": "Age bias in resume screening: are HR professionals more biased than ChatGPT?", "original_title": "Age bias in resume screening: are HR professionals more biased than ChatGPT?", "url": "https://doi.org/10.1007/s10869-026-10164-6", "venue": "Journal of Business and Psychology", "date": "2026-11-14", "authors": ["Maaike Schellaert", "Eva Derous", "Janneke K. Oostrom", "Louis Lippens"], "institutions": ["Ghent University", "Tilburg University", "Luxembourg Institute of Socio-Economic Research"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 8, "theme": "hiring", "summary": "O estudo confronta profissionais de RH e ChatGPT na triagem de currículos equivalentes que variam a idade do candidato, perguntando se humanos são mais enviesados que o modelo. A pergunta importa porque a triagem etária é um dos vieses mais persistentes e menos auditados em recrutamento. Lição: não basta trocar humano por LLM; é preciso testar viés etário nos dois lados, estruturar critérios e monitorar decisões de triagem."}, {"key": "arxiv:2611.20140", "title": "Can AI Judge You? An Empirical Audit of Deployment Readiness in LLM-assisted Hiring Systems", "original_title": "Can AI Judge You? An Empirical Audit of Deployment Readiness in LLM-assisted Hiring Systems", "url": "https://arxiv.org/abs/2611.20140", "venue": "arXiv (cs.CY, cs.AI)", "date": "2026-11-15", "authors": ["Spandan Roy", "Subhabrata Majumdar", "Soudeep Deb"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "arxiv", "cited_by": 0, "score": 7, "theme": "hiring", "summary": "Framework separa evidência do candidato, avaliação, permissões e registro de decisão, e testa prontidão operacional e de compliance em quatro LLMs, 210 currículos, 14 cargos e seis interfaces de decisão. Scores escalares distinguem melhor mudanças de qualificação que pass/fail; julgamentos comparativos são sensíveis à ordem; regras explícitas de permissão reduzem obediência a instruções maliciosas, mas LLMs frequentemente divergem entre decisão e justificativa. Lição: em triagem com IA, desenhe interface, permissões e trilha de auditoria antes de escalar."}, {"key": "doi:10.5281/zenodo.24254416", "title": "The Exceptional Centaur: Why Human–AI Teams Usually Underperform Their Stronger Member", "original_title": "The Exceptional Centaur: Why Human–AI Teams Usually Underperform Their Stronger Member, and the Narrow Conditions That Produce Synergy", "url": "https://doi.org/10.5281/zenodo.24254416", "venue": "Zenodo (CERN European Organization for Nuclear Research)", "date": "2026-11-15", "authors": ["Josie Jefferson", "Felix Velasco"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 8, "theme": "ai_work", "summary": "Meta-análise pré-registrada de 106 experimentos mostra que equipes humano-IA rendem, em média, **menos que o membro mais forte** (déficit agregado g = −0,23), contrariando o mito do centauro. Em testes de campo em radiologia, manutenção de software, consultoria e recrutamento, a confiança supera a acurácia do algoritmo e explicações não recalibram; sinergia só aparece quando erros divergem, a tarefa é aberta e há críticos/challengers/triagem algorítmica. Lição: não presuma ganho de centauro; desenhe fluxos com verificação adversarial e meça quando o humano deve seguir ou sobrepor a máquina."}, {"key": "web:https://shows.acast.com/digital-hr-leaders-with-david-green/episodes/how-atlassian-connects-context-people-and-work-to-create-ai", "title": "How Atlassian Connects Context, People and Work to Create AI Value", "original_title": "How Atlassian Connects Context, People and Work to Create AI Value", "url": "https://shows.acast.com/digital-hr-leaders-with-david-green/episodes/how-atlassian-connects-context-people-and-work-to-create-ai", "venue": "Digital HR Leaders (podcast)", "date": "2026-11-17", "authors": [], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "David Green", "origin": "fonte", "cited_by": 0, "score": 7, "theme": "ai_work", "summary": "Podcast do Digital HR Leaders com a Chief People and AI Enablement Officer do Atlassian: 85% dos knowledge workers usam IA, mas só 6% dos executivos apontam ROI claro em toda a organização. A empresa uniu RH, IT interno, ciência de dados e suporte para conectar contexto organizacional, redesenho do trabalho e capacitação, e testa mudanças no operating model de RH. Lição: adoção não é resultado; people analytics deve medir capacidade, contexto e redesenho de tarefas, não só uso nem performance individual."}, {"key": "arxiv:2611.21376", "title": "A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents", "original_title": "A Crowd-Audited Atlas of Implicit Bias in LLM-Powered Agents", "url": "https://arxiv.org/abs/2611.21376", "venue": "arXiv (cs.CY, cs.CL)", "date": "2026-11-16", "authors": ["Jason Alexander", "Yuxuan Li", "Michael Licamele", "Wesley Hanwen Deng", "Sauvik Das"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "arxiv", "cited_by": 0, "score": 7, "theme": "ai_work", "summary": "Atlas gerado a partir de 17 domínios da American Time Use Survey criou 506 cenários de decisão em que LLMs com personas de raça, gênero e ideologia política expressaram viés implícito. Em auditoria crowdsourced, 500 participantes fizeram 8.010 escolhas binárias e priorizaram cenários de ampla relevância, alto risco e decisões unânimes de um grupo simulado, menos influenciados pela magnitude da disparidade. Lição: auditorias de viés precisam de priorização humana e cuidado com estereótipos internalizados, não só métricas de disparidade."}, {"key": "arxiv:2611.19652", "title": "LLM Facilitation of Group Decision-Making", "original_title": "LLM Facilitation of Group Decision-Making", "url": "https://arxiv.org/abs/2611.19652", "venue": "arXiv (cs.HC)", "date": "2026-11-14", "authors": ["José Córdova", "Chun-Wei Chiang", "Miriam Schirmer", "Ming Yin", "Emőke-Ágnes Horvát"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "arxiv", "cited_by": 0, "score": 7, "theme": "ai_work", "summary": "Experimento online com 138 grupos de três pessoas (N = 414) em tarefa de contratação hidden-profile comparou nenhuma facilitação, LLM individual e LLM de grupo. A facilitação por LLM elevou a taxa de consenso na candidata correta de 32,6% para 56,5%; o LLM de grupo aumentou divulgação de informação privada e recebeu melhor usabilidade que o individual. Lição: LLMs podem atuar como facilitadores de decisão coletiva, mas o desenho — grupo versus indivíduo — muda o que as pessoas compartilham."}, {"key": "doi:10.1007/s10869-026-10153-9", "title": "When turnover intention translates into action: boundaryless mindset and time", "original_title": "When turnover intention translates into action: the influence of having a boundaryless mindset and time", "url": "https://doi.org/10.1007/s10869-026-10153-9", "venue": "Journal of Business and Psychology", "date": "2026-11-12", "authors": ["Raquel Redondo", "María Eugenia Fabra", "Susana de los Ríos-Sastre", "Jorge Martín-Magdalena"], "institutions": ["Universidad Pontificia Comillas"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 7, "theme": "engagement", "summary": "Estudo examina quando a intenção de saída vira desligamento efetivo, testando o papel de uma mentalidade boundaryless e do tempo como moderadores. A tradução da intenção em ação não é automática: atitudes de carreira sem fronteiras e janelas temporais alteram a probabilidade de saída. Lição: modelos de attrition devem combinar intenção declarada com orientação de carreira e tempo de exposição, em vez de tratar intenção como preditor único."}, {"key": "arxiv:2611.19068", "title": "Corporate Stances on Societal Issues in the US", "original_title": "Corporate Stances on Societal Issues in the US", "url": "https://arxiv.org/abs/2611.19068", "venue": "arXiv (econ.GN, q-fin.GN)", "date": "2026-11-14", "authors": ["Jacob Conway", "Andrew Hall", "Magdalena Larreboure", "Caroline Le Pennec", "Vincent Pons", "Anna Sun"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "arxiv", "cited_by": 0, "score": 7, "theme": "leadership", "summary": "Base com 52.000 notícias e press releases de 836 empresas que passaram pelo S&P 500 entre 2008 e 2025 identificou 9.917 posicionamentos em nove temas partidários. Posicionamentos quadruplicaram após 2008, pico em 2021, majoritariamente liberais e concentrados nas maiores empresas; um quarto não traz justificativa de negócio explícita, e a relação com lobbying/doações é fraca. Lição: a voz política corporativa acompanha atenção pública e composição de consumidores, funcionários, executivos e conselho — um sinal de cultura e risco reputacional para people analytics."}, {"key": "arxiv:2611.20901", "title": "Auditing a Moving Target: Evidence Anchoring and the Expiry of Fairness Audits", "original_title": "Auditing a Moving Target: Evidence Anchoring and the Expiry of Fairness Audits of Provider-Served Language Models", "url": "https://arxiv.org/abs/2611.20901", "venue": "arXiv (cs.CY, cs.AI)", "date": "2026-11-16", "authors": ["Mika Facchini"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "arxiv", "cited_by": 0, "score": 7, "theme": "governance", "summary": "Auditoria de fairness em LLMs usados para decisões sobre pessoas repetiu o mesmo teste três vezes em 13 meses, com 248.400 chamadas de API e cinco provedores, no cenário de triagem de investimento com fundadores variando gênero, origem e universidade. O mesmo identificador de modelo exibiu padrão de viés significativamente diferente um ano depois; sucessores herdaram o viés com tamanho e forma distintos, e provedores aposentam modelos com aviso de zero a seis meses. Lição: auditoria de LLM é **evidência perecível**; audite classes de modelo, registre versões e reaudite a cada troca."}], "quick": [{"key": "doi:10.3389/feduc.2026.1876200", "title": "Bridging the AI literacy gap", "original_title": "Bridging the AI literacy gap: mixed-methods evidence from employers on workforce readiness and curriculum priorities", "url": "https://doi.org/10.3389/feduc.2026.1876200", "venue": "Frontiers in Education", "date": "2026-11-12", "authors": ["Laura McNeill", "Mohammad Mohı Uddın", "Stephen Abu", "Mengshi Pei", "Idowu David Awoyemi", "Lesley Regalado"], "institutions": ["University of Alabama"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 6, "theme": "learning", "note": "Empregadores apontam lacuna entre formação universitária em IA e competências exigidas; framework de prontidão pode orientar currículos e trilhas de aprendizagem."}, {"key": "doi:10.1038/s41598-026-77466-w", "title": "HR-driven imbalanced classification for job-change prediction", "original_title": "A technical framework for HR-driven imbalanced classification: pipeline architecture, oversampling algorithms, ablation analysis, and threshold engineering for data scientist job-change prediction", "url": "https://doi.org/10.1038/s41598-026-77466-w", "venue": "Scientific Reports", "date": "2026-11-15", "authors": ["Anupam Mazumdar", "Md Foysal Ahmed", "Chantor Btissam", "Hriday Chandra Shil", "Nimra Khan", "Md Luman Jamali", "Mehvish Bashir", "Md. Mashfi Chowdhury Aurin", "S.K. Md. Anik Hassan Rabby", "Samrat Ray", "Mir Mohammad Azad", "Md. Nurul Haque Mollah"], "institutions": ["Arden University", "Western Illinois University", "Sidi Mohame ": "The Context of the Rise of Digital Surveillance", "original_title": "The Context of the Rise of Digital Surveillance", "url": "https://doi.org/10.4324/9781003240679-5", "venue": "Routledge eBooks", "date": "2026-11-13", "authors": ["Ivan Manokha"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 6, "theme": "governance", "note": "Capítulo situa vigilância digital no capitalismo tardio: erosão de proteções coletivas e precarização explicam difusão, não só inovação tecnológica."}, {"key": "arxiv:2611.17530", "title": "AI and the Two Margins of Work", "original_title": "AI and the Two Margins of Work: Why Job Losses Show Up Before Job Creation", "url": "https://arxiv.org/abs/2611.17530", "venue": "arXiv (econ.GN)", "date": "2026-11-12", "authors": ["Mark Esposito", "Liu Zhang"], "institutions": [], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "arxiv", "cited_by": 0, "score": 6, "theme": "ai_work", "note": "Dados de folha mostram perdas antes de ganhos: entrantes pós-1978 detinham 42% da folha em 1998; criação de vagas demora a aparecer."}]}, {"date": "2026-11-16", "model": "deepseek-ai/DeepSeek-V4.1-Flash", "period": {"from": "2026-11-09", "to": "2026-11-16"}, "stats": {"candidates": 423, "triaged": 220, "selected": 12, "tokens": {"prompt_tokens": 46300, "completion_tokens": 29498}}, "headline": "semana forte em auditoria de IA no recrutamento e em desenho de trabalho algorítmico", "trend": "O período mostra a IA saindo do discurso genérico e entrando na **governança operacional**: auditoria de LLMs em vagas, separação entre funções de gestão algorítmica e evidência de que monitoramento corrói autonomia. Ao mesmo tempo, a pesquisa sobre gestão de pessoas volta a destacar mecanismos concretos — previsibilidade de local em times híbridos, qualidade de 1:1s, reenquadramento de ameaça e de-risking de segurança psicológica — em vez de receitas de engajamento. Para people analytics, a agenda é medir uso efetivo (de IA, de tempo, de canais de voz), documentar validade de construto e testar intervenções com desenho longitudinal.", "items": [{"key": "doi:10.1287/mnsc.2025.00955", "title": "Controle de horas e esforço extra: o sinal do gestor", "original_title": "Effortful vs. Opportunistic Consumption of Discretionary Time: How Time-Reporting Decisions Influence Extra-Role Effort", "url": "https://doi.org/10.1287/mnsc.2025.00955", "venue": "Management Science", "date": "2026-11-12", "authors": ["Sophie Maussen"], "institutions": ["Ghent University"], "watch_authors": [], "watch_journal": true, "watch_source": "", "origin": "journal", "cited_by": 0, "score": 7, "theme": "analytics", "summary": "Experimento com decisões de reporte de tempo comparou relatórios agregados vs. desagregados e implementação por escolha do gestor vs. aleatória. Quando o gestor escolhia não usar relatório desagregado, subordinados reduziam esforço extra-papel; o efeito veio mais de **sinalização de valor** do que de desconfiança, e sumiu sob alocação aleatória. A lição é que decisões de medição comunicam o que a empresa valoriza, inclusive o trabalho não contratado."}, {"key": "doi:10.1038/s41467-026-78689-1", "title": "Divisão digital de uso a partir de 40 milhões de dispositivos", "original_title": "Evidence and measures of the digital usage divide from 40 million Windows devices", "url": "https://doi.org/10.1038/s41467-026-78689-1", "venue": "Nature Communications", "date": "2026-11-09", "authors": ["Mayana Pereira", "Shane Greenstein", "Raffaella Sadun", "Prasanna B. Tambe", "Lucia Ronchi Darre", "Tammy Glazer", "Allen Kim", "Rahul Dodhia", "Juan Lavista-Ferres"], "institutions": ["Microsoft (United States)", "Harvard University", "University of Pennsylvania"], "watch_authors": ["Prasanna Tambe", "Raffaella Sadun"], "watch_journal": false, "watch_source": "", "origin": "watchlist", "cited_by": 1, "score": 7, "theme": "analytics", "summary": "Telemetria de 40 milhões de dispositivos Windows nos EUA gerou índices de uso digital por CEP, mais granulares que pesquisas tradicionais. Há divisão urbano-rural e disparidades dentro de áreas metropolitanas, correlacionadas com renda e educação, além da disponibilidade de infraestrutura. Para people analytics, medir **uso efetivo** e habilidades digitais é melhor que medir acesso; programas de inclusão precisam de suporte de uso, não só conectividade."}, {"key": "doi:10.1111/1748-8583.70071", "title": "Avaliação psicométrica de medidas de item único", "original_title": "A Psychometric Evaluation of Single‐Item Measures", "url": "https://doi.org/10.1111/1748-8583.70071", "venue": "Human Resource Management Journal", "date": "2026-11-10", "authors": ["Justin A. DeSimone"], "institutions": ["University of Alabama"], "watch_authors": [], "watch_journal": true, "watch_source": "", "origin": "journal", "cited_by": 0, "score": 7, "theme": "analytics", "summary": "Avaliação psicométrica de medidas de item único à luz da teoria clássica, TRI e generalizabilidade mostra limites claros: não é possível demonstrar estrutura fatorial latente nem consistência interna. Algumas formas de confiabilidade (temporal, entre avaliadores) e validade (critério, partes da validade de construto) ainda são defensáveis, e validade de conteúdo é crítica. A lição é usar item único só com justificativa e checklist, sem relatar alfa ou análise fatorial como se fossem válidos."}, {"key": "doi:10.1037/apl0001442.supp", "title": "Meta-análise de 30 anos de medidas de SJT: clareza de construto vs. poder preditivo", "original_title": "Supplemental Material for A Meta-Analysis of Three Decades of Construct Measurement Research on Situational Judgment Tests: Toward a Balance Between Construct Clarity and Predictive Power", "url": "https://doi.org/10.1037/apl0001442.supp", "venue": "Journal of Applied Psychology", "date": "2026-11-09", "authors": ["Filip Lievens", "Liyan Xi", "You Zhou", "Jomel Wei Xuan Ng", "Yixin Tian", "Paul R. Sackett", "Michelle Martin-Raugh"], "institutions": [], "watch_authors": ["Paul R. Sackett"], "watch_journal": true, "watch_source": "", "origin": "watchlist", "cited_by": 0, "score": 8, "theme": "hiring", "summary": "Meta-análise de três décadas de pesquisas sobre medidas de *situational judgment tests* (SJTs) mostra que clareza de construto e poder preditivo não avançam automaticamente juntos: escolhas de formato e pontuação favorecem um ou outro. Para RH, a lição é definir primeiro o que se quer prever e só então selecionar o desenho do SJT, documentando a validade de construto em vez de assumir que maior realismo gera melhor predição."}, {"key": "doi:10.1111/gwao.70291", "title": "IA reforça estereótipos de gênero em descrições de vagas", "original_title": "Does AI Reinforce Gender Stereotypes? Gender Bias in Job Descriptions Generated by 40+ Large Language Models", "url": "https://doi.org/10.1111/gwao.70291", "venue": "Gender Work and Organization", "date": "2026-11-10", "authors": ["Jennifer M. Krebsbach", "Jane E. Lee", "Steven Zeck", "Arti Thakur", "Martin Hilbert"], "institutions": ["University of California, Davis"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 8, "theme": "hiring", "summary": "Auditoria de algoritmos com 48 LLMs gerou 4.608 descrições de vagas para 32 ocupações a partir de títulos femininos, masculinos e neutros. Títulos codificados por gênero receberam avaliações comparativas mais altas, com os femininos no topo; em vagas de colarinho branco, descrições masculinas tiveram salários mais altos, mas sem robustez. A lição é **auditar** vagas geradas por IA e usar títulos neutros: otimização de prompt reduz, mas não elimina o viés."}, {"key": "doi:10.1177/00197939261498019", "title": "Automação e desigualdade de renda na Europa", "original_title": "Automation and Income Inequality in Europe", "url": "https://doi.org/10.1177/00197939261498019", "venue": "Industrial and Labor Relations Review", "date": "2026-11-10", "authors": ["Karina Doorley", "Jan Gromadzki", "Piotr Lewandowski", "Dora Tuđa", "Philippe Van Kerm"], "institutions": ["Vienna University of Economics and Business", "Economic and Social Research Institute", "Trinity College Dublin"], "watch_authors": [], "watch_journal": true, "watch_source": "", "origin": "journal", "cited_by": 0, "score": 8, "theme": "ai_work", "summary": "Adoção de robôs industriais em 14 países europeus (2006–2018) reduziu salários relativos, emprego e renda de mercado de grupos mais expostos. Ao simular o efeito no EUROMOD, o impacto sobre desigualdade de renda domiciliar disponível foi pequeno porque tributos e transferências absorveram o choque; diversificação da renda familiar ajudou, mas pouco para a desigualdade. People analytics deve medir efeitos distributivos e o papel das políticas de proteção, não só a exposição à automação."}, {"key": "doi:10.21203/rs.3.rs-11446329/v1", "title": "Gestão algorítmica como desenho de trabalho ambivalente", "original_title": "Algorithmic Management as a Double-Edged Form of Digital Work Design: Job Demands, Autonomy and Employee Outcomes across 35 European Countries", "url": "https://doi.org/10.21203/rs.3.rs-11446329/v1", "venue": "Research Square", "date": "2026-11-11", "authors": ["Fahri Alp Erdoğan", "Mehmet Alper Akdemir", "Murat Sağbaş"], "institutions": ["National Defence University", "Ankara Bilim Üniversitesi", "Bahçeşehir Cyprus University"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 7, "theme": "ai_work", "summary": "Modelos SEM com 26.504 trabalhadores de 35 países (EWCS 2024) separaram três funções da gestão algorítmica: alocação de tarefas, agendamento e monitoramento. Todas elevaram intensidade de trabalho; alocação aumentou autonomia, enquanto monitoramento a reduziu, com efeitos indiretos opostos no engajamento e intenção de sair. A lição é **diferenciar** funções al lytics' (com Levenson e Boudreau, 2004).", "status": "aposentado", "since": null, "openalex_id": "A5112294555", "alt_openalex_ids": [], "links": {}, "evidence": "https://www.marshall.usc.edu/people/ed-lawler — USC: 'Distinguished Research Professor Emeritus of Business'; OpenAlex sem obras novas desde 2021. Vivo, sem data de aposentadoria publicada."}]}, "evolution": {"generated": "2026-11-17", "month": "2026-11", "model": "deepseek-ai/DeepSeek-V4.1-Flash", "mode": "completa", "changes": {"since": "2026-11-17", "added": [{"title": "Customer Mistreatment, Employee Health, and Job Performance: Cognitive Rumination and Social Sharing as Mediating Mechanisms", "year": 2014, "era": "2010-2017"}], "removed": [{"title": "Work Engagement: A Handbook of Essential Theory and Research", "year": 2010, "era": "2010-2017"}], "note": "Nesta versão entrou Baranik, Wang & Gong (2014) sobre maltrato de cliente e ruminação, reforçando a leitura de engajamento como fenômeno exposto a fontes externas de desgaste. Saiu o handbook de engajamento de 2010, que era referência de síntese e não marco empírico. O eixo 2010–2017 fica, assim, mais ancorado em evidência primária do que em compilação."}, "stats": {"network": 1498, "candidates": 888, "triaged": 0, "milestones": 37, "openalex_calls": 160, "openalex_cost": 0.0448, "tokens": {"prompt_tokens": 10961, "completion_tokens": 11307}}, "overview": "O campo nasce entre 1964 e 1998 com duas pernas: a economia do capital humano e da compensação (Becker, Lazear & Rosen) e a psicometria da seleção e da motivação (Vroom, Deci & Ryan, Schmidt & Hunter). Nos anos 2000 ele ganha método — experimentos de campo, dados administrativos de empresas e meta-análise — e passa a medir discriminação e efeito de incentivos com precisão. Entre 2010 e 2022 a agenda se desloca para tarefas, automação e algoritmos, e o HR analytics se institucionaliza como subcampo com dilemas éticos próprios. De 2023 em diante, a IA generativa vira o experimento natural do momento: ganhos de produtividade reais, mas heterogêneos, e a pergunta de governança deixa de ser teórica.", "eras": [{"key": "ate-1999", "label": "até 1999", "title": "Capital humano, motivação e seleção", "summary": "A época resolveu um problema básico: provar que pessoas e práticas de gestão são variáveis econômicas, não custo fixo. Becker (1964) formaliza capital humano, Vroom (1964) e Deci & Ryan (1985) explicam por que as pessoas se engajam, Lazear & Rosen (1979) mostram que a estrutura de prêmios muda esforço, e Huselid (1995) liga sistemas de práticas de alto desempenho a rotatividade, produtividade e resultado financeiro. Schmidt & Hunter (1998) fecham a conta da seleção com 85 anos de validade meta-analítica. Ficou em aberto o problema que domina até hoje: quase tudo é correlação cross-sectional, sem identificação causal nem dados granulares de dentro da empresa.", "milestones": [{"id": "W3122125999", "title": "THE IMPACT OF HUMAN RESOURCE MANAGEMENT PRACTICES ON TURNOVER, PRODUCTIVITY, AND CORPORATE FINANCIAL PERFORMANCE.", "year": 1995, "venue": "Academy of Management Journal", "authors": ["Mark A. Huselid"], "cited_by": 12230, "net": 64.5, "url": "https://doi.org/10.5465/256741", "theme": "analytics", "versions": [], "watch": [], "score": 10, "why": "Primeira demonstração em larga escala (quase mil firmas) de que sistemas de práticas de alto desempenho afetam rotatividade, produtividade e resultado financeiro. É a origem da ideia de que RH é variável de resultado, não centro de custo.", "new": false}, {"id": "W2132199097", "title": "PSYCHOLOGICAL CONDITIONS OF PERSONAL ENGAGEMENT AND DISENGAGEMENT AT WORK.", "year": 1990, "venue": "Academy of Management Journal", "authors": ["William A. Kahn"], "cited_by": 16966, "net": 25, "url": "https://doi.org/10.5465/256287", "theme": "engagement", "versions": [], "watch": [], "score": 10, "why": "Define engajamento como uso variável do self — físico, cognitivo e emocional — no papel de trabalho, e desengajamento como defesa. É a base conceitual de praticamente toda medida de engajamento usada em survey corporativo.", "new": false}, {"id": "W2136971664", "title": "The validity and utility of selection methods in personnel psychology: Practical and theoretical implications of 85 years of research findings.", "year": 1998, "venue": "Psychological Bulletin", "authors": ["Frank L. Schmidt", "John E. Hunter"], "cited_by": 5193, "net": 14, "url": "https://doi.org/10.1037/0033-2909.124.2.262", "theme": "hiring", "versions": [], "watch": ["Frank L. Schmidt", "John E. Hunter"], "score": 10, "why": "Meta-análise de 85 anos que ordena 19 procedimentos de seleção por validade e utilidade. Ainda hoje é a referência para decidir o que usar em triagem e por que combinações com GMA dominam.", "new": false}, {"id": "W4241502104", "title": "Human Capital: A Theoretical and Empirical Analysis, with Special Reference to Education", "year": 1964, "venue": "University of Chicago Press eBooks", "authors": ["Gary S. Becker"], "cited_by": 27254, "net": 9.5, "url": "https://doi.org/10.7208/chicago/9780226041223.001.0001", "theme": "learning", "versions": ["https://doi.org/10.2307/1401709", "https://openalex.org/W2159147610"], "watch": ["Gary S. Becker"], "score": 10, "why": "Formula capital humano como investimento com custo e retorno, ligando educação e treinamento a salários e emprego. É o arcabouço que sustenta qualquer cálculo de ROI de treinamento até hoje.", "new": false}, {"id": "W2052729098", "title": "Intrinsic Motivation and Self-Determination in Human Behavior", "year": 1985, "venue": "Springer eBooks", "authors": ["Edward L. Deci", "Richard M. Ryan"], "cited_by": 54313, "net": 42.0, "url": "https://doi.org/10.1007/978-1-4899-2271-7", "theme": "engagement", "versions": ["https://doi.org/10.2307/2070638"], "watch": [], "score": 9, "why": "Estabelece a autodeterminação como motor da motivação intrínseca, com autonomia, competência e vínculo como necessidades básicas. Explica por que incentivo extrínseco pode destruir engajamento — e por que isso virou item de pesquisa em RH.", "new": false}, {"id": "W1518638857", "title": "Work and motivation", "year": 1964, "venue": "", "authors": ["Victor H. Vroom"], "cited_by": 18898, "net": 41.0, "url": "https://openalex.org/W1518638857", "theme": "engagement", "versions": [], "watch": [], "score": 9, "why": "Introduz expectativa, instrumentalidade e valência como explicação de escolha, satisfação e desempenho. É o vocabulário que transformou motivação em variável mensurável no trabalho.", "new": false}, {"id": "W2050904362", "title": "Rank-Order Tournaments as Optimum Labor Contracts", "year": 1979, "venue": "Journal of Political Economy", "authors": ["Edward P. Lazear", "Sherwin Rosen"], "cited_by": 8785, "net": 33, "url": "https://doi.org/10.1086/261010", "theme": "pay_careers", "versions": ["https://doi.org/10.3386/w0401"], "watch": ["Edward P. Lazear", "Sherwin Rosen"], "score": 9, "why": "Mostra que pagar por posição relativa (torneio) pode ser o contrato ótimo e induzir esforço eficiente. Funda a economia de pessoal sobre incentivos e explica estruturas de bônus e promoção por ranking.", "new": false}]}, {"key": "2000-2009", "label": "2000–2009", "title": "A virada da identificação causal", "summary": "A década troca a correlação pela identificação: currículos fictícios (Bertrand & Mullainathan, 2003), piece rates na Safelite (Lazear, 2000) e dados de uma única empresa (Fernandez et al., 2000; Castilla, 2008) mostram viés e efeito de incentivo com precisão. O modelo JD-R (Demerouti et al., 2001) organiza demandas e recursos como dois eixos do bem-estar, e Autor, Levy & Murnane (2001) inauguram a leitura do trabalho por tarefas rotineiras vs. não rotineiras. Vira padrão usar dados administrativos de RH como fonte de pesquisa, não só survey. Em aberto: como generalizar de uma firma para outra e como lidar com o fato de que o próprio sistema de mérito produz desigualdade (Castilla, 2008).", "milestones": [{"id": "W3123223998", "title": "Are Emily and Greg More Employable Than Lakisha and Jamal? A Field Experiment on Labor Market Discrimination", "year": 2003, "venue": "American Economic Review", "authors": ["Marianne Bertrand", "Sendhil Mullainathan"], "cited_by": 7276, "net": 12, "url": "https://doi.org/10.1257/0002828042002561", "theme": "hiring", "versions": ["https://doi.org/10.3386/w9873"], "watch": ["Marianne Bertrand"], "score": 10, "why": "Experimento de campo com currículos fictícios mede discriminação racial direta: 50% mais callbacks para nomes brancos. Vira o padrão metodológico para auditar triagem e justifica auditorias de currículo até hoje.", "new": false}, {"id": "W2092968198", "title": "General Mental Ability in the World of Work: Occupational Attainment and Job Performance.", "year": 2004, "venue": "Journal of Personality and Social Psychology", "authors": ["Frank L. Schmidt", "John E. Hunter"], "cited_by": 1461, "net": 3, "url": "https://doi.org/10.1037/0022-3514.86.1.162", "theme": "hiring", "versions": [], "watch": ["Frank L. Schmidt", "John E. Hunter"], "score": 10, "why": "Consolida a evidência de que GMA prediz nível ocupacional e desempenho melhor que qualquer outro traço ou experiência. Sustenta o uso de testes cognitivos — e a controvérsia sobre impacto adverso.", "new": false}, {"id": "W2892380133", "title": "The Skill Content of Recent Technological Change: An Empirical Exploration", "year": 2001, "venue": "The Quarterly Journal of Economics", "authors": ["David Autor", "Frank S. Levy", "Richard J. Murnane"], "cited_by": 12100, "net": 62.5, "url": "https://doi.org/10.1162/003355303322552801", "theme": "ai_work", "versions": ["https://doi.org/10.3386/w8337"], "watch": ["David Autor"], "score": 9, "why": "Mostra que a computação substitui tarefas rotineiras e complementa tarefas não rotineiras de solução de problemas e comunicação. É a base de toda a discussão posterior sobre automação e composição de skills.", "new": false}, {"id": "W2127625785", "title": "The job demands-resources model of burnout.", "year": 2001, "venue": "Journal of Applied Psychology", "authors": ["Evangelia Demerouti", "Arnold B. Bakker", "Friedhelm Nachreiner", "Wilmar Bernardus Schaufeli"], "cited_by": 19555, "net": 25.5, "url": "https://doi.org/10.1037/0021-9010.86.3.499", "theme": "engagement", "versions": [], "watch": [], "score": 9, "why": "Organiza as condições de trabalho em demandas e recursos, com efeitos distintos sobre exaustão e desengajamento. Vira o modelo operacional padrão para diagnóstico de bem-estar e desenho de intervenção.", "new": false}, {"id": "W3122276354", "title": "Performance Pay and Productivity", "year": 2000, "venue": "American Economic Review", "authors": ["Edward P. Lazear"], "cited_by": 3109, "net": 24.5, "url": "https://doi.org/10.1257/aer.90.5.1346", "theme": "pay_careers", "versions": [], "watch": ["Edward P. Lazear"], "score": 9, "why": "Mede o efeito de migrar para piece rate na Safelite: +44% de produtividade e mudança na composição da força. É a evidência mais citada de que desenho de compensação muda output.", "new": false}, {"id": "W2093929429", "title": "Social Capital at Work: Networks and Employment at a Phone Center", "year": 2000, "venue": "American Journal of Sociology", "authors": ["Roberto M. Fernandez", "Emilio J. Castilla", "Paul Moore"], "cited_by": 1058, "net": 22.0, "url": "https://doi.org/10.1086/210432", "theme": "hiring", "versions": [], "watch": ["Emilio J. Castilla"], "score": 9, "why": "Quantifica custo e retorno de contratação por indicação em um call center, com mecanismos de pool, match e enriquecimento social. Base para discutir referral como política de recrutamento, não só atalho.", "new": false}, {"id": "W2023640597", "title": "Gender, Race, and Meritocracy in Organizational Careers", "year": 2008, "venue": "American Journal of Sociology", "authors": ["Emilio J. Castilla"], "cited_by": 900, "net": 22, "url": "https://doi.org/10.1086/588738", "theme": "pay_careers", "versions": [], "watch": ["Emilio J. Castilla"], "score": 9, "why": "Mostra que, com notas de desempenho iguais, mulheres e minorias crescem menos em salário e promoção. Nomeia o viés de performance-reward e vira referência obrigatória em auditoria de mérito.", "new": false}]}, {"key": "2010-2017", "label": "2010–2017", "title": "Tarefas, automação e HR analytics", "summary": "Aqui o campo se divide em duas frentes que depois se reencontram. De um lado, a economia do trabalho por tarefas (Acemoglu & Autor, 2010) e o choque de Frey & Osborne (2016) colocam a automação no centro do debate de emprego; de outro, Marler & Boudreau (2016) fazem o primeiro balanço sistemático de HR analytics e mostram que quase não havia pesquisa peer-reviewed. Bloom et al. (2014) provam que práticas de gestão explicam parte relevante da produtividade entre firmas e países, dando base empírica para 'gestão importa'. Ficou em aberto a lacuna entre prática e evidência — e o que fazer com o bem-estar quando o trabalho é mediado por cliente e tecnologia (Baranik et al., 2014).", "milestones": [{"id": "W2526781987", "title": "The future of employment: How susceptible are jobs to computerisation?", "year": 2016, "venue": "Technological Forecasting and Social Change", "authors": ["Carl Benedikt Frey", "Michael A. Osborne"], "cited_by": 12119, "net": 14.0, "url": "https://doi.org/10.1016/j.techfore.2016.08.019", "theme": "ai_work", "versions": [], "watch": [], "score": 10, "why": "Estima que 47% do emprego americano está em ocupações de alto risco de computerização. Populariza o debate de automação para o público executivo, mesmo com críticas metodológicas.", "new": false}, {"id": "W645758977", "title": "The Shift: The Future of Work Is Already Here", "year": 2011, "venue": "", "authors": ["Lynda Gratton"], "cited_by": 236, "net": 0, "url": "https://openalex.org/W645758977", "theme": "ai_work", "versions": [], "watch": ["Lynda Gratton"], "score": 10, "why": "Argumenta que tecnologia, globalização e demografia vão reconfigurar o trabalho em duas décadas. Antecipa a agenda de trabalho híbrido e redes que domina a prática de RH.", "new": false}, {"id": "W3124124240", "title": "Skills, Tasks and Technologies: Implications for Employment and Earnings", "year": 2010, "venue": "Handbook of labour economics", "authors": ["Daron Acemoğlu", "David Autor"], "cited_by": 8469, "net": 22.5, "url": "https://doi.org/10.1016/s0169-7218(11)02410-5", "theme": "ai_work", "versions": ["https://doi.org/10.3386/w16082"], "watch": ["Daron Acemoglu", "David Autor"], "score": 9, "why": "Critica o modelo canônico de dois tipos de skill e propõe a abordagem de tarefas para explicar emprego e desigualdade. É a ponte entre economia do trabalho e desenho de cargos.", "new": false}, {"id": "W2554886781", "title": "An evidence-based review of HR Analytics", "year": 2016, "venue": "The International Journal of Human Resource Management", "authors": ["Janet H. Marler", "John W. Boudreau"], "cited_by": 1823, "net": 17, "url": "https://doi.org/10.1080/09585192.2016.1244699", "theme": "analytics", "versions": [], "watch": ["John W. Boudreau"], "score": 9, "why": "Primeira revisão baseada em evidência de HR analytics: define o conceito, mapeia processos e mostra que quase não havia pesquisa peer-reviewed. Estabelece a agenda acadêmica do subcampo.", "new": false}, {"id": "W2530409471", "title": "Job demands–resources theory: Taking stock and looking forward.", "year": 2016, "venue": "Journal of Occupational Health Psychology", "authors": ["Arnold B. Bakker", "Evangelia Demerouti"], "cited_by": 11442, "net": 12, "url": "https://doi.org/10.1037/ocp0000056", "theme": "engagement", "versions": [], "watch": [], "score": 9, "why": "Consolida o JD-R como teoria, com papel amortecedor dos recursos sobre as demandas. É a versão que sustenta instrumentos de diagnóstico usados em empresas.", "new": false}, {"id": "W2109700267", "title": "JEEA-FBBVA LECTURE 2013: THE NEW EMPIRICAL ECONOMICS OF MANAGEMENT", "year": 2014, "venue": "Journal of the European Economic Association", "authors": ["Nicholas Bloom", "Renata Lemos", "Raffaella Sadun", "Daniela Scur", "John Michael Van Reenen"], "cited_by": 342, "net": 6, "url": "https://doi.org/10.1111/jeea.12094", "theme": "analytics", "versions": [], "watch": ["Raffaella Sadun"], "score": 9, "why": "Usa o World Management Survey para mostrar que práticas de gestão explicam cerca de um quarto dos gaps de produtividade entre firmas e países. Dá base empírica ao argumento de que gestão é variável de resultado.", "new": false}, {"id": "W2028154932", "title": "Customer Mistreatment, Employee Health, and Job Performance: Cognitive Rumination and Social Sharing as Mediating Mechanisms", "year": 2014, "venue": "Journal of Management", "authors": ["Lisa E. Baranik", "Mo Wang", "Yaping Gong", "Junqi Shi"], "cited_by": 318, "net": 0, "url": "https://doi.org/10.1177/0149206314550995", "theme": "engagement", "versions": [], "watch": ["Yaping Gong"], "score": 9, "why": "Mostra que maltrato de cliente gera ruminação e afeta saúde e desempenho, com estratégias de regulação emocional como proteção. Traz o desgaste de fonte externa para dentro do modelo de engajamento.", "new": true}]}, {"key": "2018-2022", "label": "2018–2022", "title": "Algoritmos no trabalho e governança", "summary": "A época responde à pergunta 'o que acontece quando o algoritmo vira chefe'. Kellogg, Valentine & Christin (2019) sistematizam os 6 Rs do controle algorítmico, Wood et al. (2018) mostram o trade-off autonomia/controle no gig work, e Lee (2018) mede quando decisões algorítmicas são percebidas como justas. Tambe, Cappelli & Yakubovich (2018) listam os quatro obstáculos do data science em RH — complexidade, dados pequenos, accountability e reação dos empregados — e Li, Raymond & Bergman (2020) propõem hiring como problema de exploração, não só de explotação. Acemoglu & Restrepo (2019) fecham o ciclo com efeitos mensuráveis de robôs sobre emprego e salários. Em aberto: ética e governança entram na pauta (Edwards et al., 2022) sem que exista padrão de auditoria.", "milestones": [{"id": "W2905604475", "title": "Artificial Intelligence in Human Resources Management: Challenges and a Path Forward", "year": 2018, "venue": "California Management Review", "authors": ["Prasanna B. Tambe", "Peter H. Cappelli", "Valery Yakubovich"], "cited_by": 2920, "net": 18, "url": "https://doi.org/10.1177/0008125619867910", "theme": "analytics", "versions": ["https://doi.org/10.2139/ssrn.3263878"], "watch": ["Peter Cappelli", "Prasanna Tambe"], "score": 9, "why": "Lista os quatro obstáculos do data science em RH — complexidade dos fenômenos, dados pequenos, accountability e reação dos empregados — e propõe raciocínio causal, experimentação e participação. É o roteiro prático de quem implanta analytics em RH.", "new": false}, {"id": "W2990520658", "title": "Algorithms at Work: The New Contested Terrain of Control", "year": 2019, "venue": "Academy of Management Annals", "authors": ["Katherine C. Kellogg", "Melissa Valentine", "Angèle Christin"], "cited_by": 4298, "net": 15, "url": "https://doi.org/10.5465/annals.2018.0174", "theme": "ai_work", "versions": [], "watch": [], "score": 9, "why": "Sistematiza o controle algorítmico em seis mecanismos (restrição, recomendação, registro, avaliação, substituição, recompensa). Vira a taxonomia padrão para analisar gestão algorítmica e resistência dos trabalhadores.", "new": false}, {"id": "W3021644002", "title": "Robots and Jobs: Evidence from US Labor Markets", "year": 2019, "venue": "Journal of Political Economy", "authors": ["Daron Acemoğlu", "Pascual Restrepo"], "cited_by": 5467, "net": 10, "url": "https://doi.org/10.1086/705716", "theme": "ai_work", "versions": [], "watch": ["Daron Acemoglu"], "score": 9, "why": "Estima que um robô a mais por mil trabalhadores reduz a razão emprego-população em 0,2 p.p. e salários em 0,42%. Traduz automação em efeito local mensurável, não em projeção.", "new": false}, {"id": "W2922903482", "title": "Automation and New Tasks: How Technology Displaces and Reinstates Labor", "year": 2019, "venue": "The Journal of Economic Perspectives", "authors": ["Daron Acemoğlu", "Pascual Restrepo"], "cited_by": 4063, "net": 8.5, "url": "https://doi.org/10.1257/jep.33.2.3", "theme": "ai_work", "versions": [], "watch": ["Daron Acemoglu"], "score": 9, "why": "Formula o efeito deslocamento e o efeito reinstalação de tarefas, mostrando que automação sempre reduz a parcela do trabalho no valor adicionado. É o arcabouço que explica por que produtividade e emprego podem divergir.", "new": false}, {"id": "W4411224527", "title": "Hiring as Exploration", "year": 2020, "venue": "The Review of Economic Studies", "authors": ["Danielle Li", "Lindsey Raymond", "Peter Bergman"], "cited_by": 172, "net": 6, "url": "https://doi.org/10.1093/restud/rdaf040", "theme": "hiring", "versions": ["https://doi.org/10.3386/w27736", "https://doi.org/10.2139/ssrn.3683612", "https://doi.org/10.2139/ssrn.3630630", "https://doi.org/10.48550/arxiv.2411.03616"], "watch": ["Danielle Li", "Lindsey Raymond"], "score": 9, "why": "Reformula triagem como problema de bandit contextual e propõe avaliar candidatos por potencial estatístico, não só por histórico. Abre a porta para algoritmos que exploram grupos sub-representados sem sacrificar qualidade.", "new": false}, {"id": "W2887734062", "title": "Good Gig, Bad Gig: Autonomy and Algorithmic Control in the Global Gig Economy", "year": 2018, "venue": "Work Employment and Society", "authors": ["Alex J. Wood", "Mark Graham", "Vili Lehdonvirta", "Isis Hjorth"], "cited_by": 3268, "net": 14.5, "url": "https://doi.org/10.1177/0950017018785616", "theme": "ai_work", "versions": [], "watch": [], "score": 8, "why": "Mostra, com entrevistas em seis países e survey cross-regional, que controle algorítmico em plataformas oferece flexibilidade mas concentra poder e reduz autonomia. É a evidência de campo que ancora o debate de gig work.", "new": false}, {"id": "W2792183666", "title": "Understanding perception of algorithmic decisions: Fairness, trust, and emotion in response to algorithmic management", "year": 2018, "venue": "Big Data & Society", "authors": ["Min Kyung Lee"], "cited_by": 1771, "net": 6, "url": "https://doi.org/10.1177/2053951718756684", "theme": "governance", "versions": [], "watch": [], "score": 8, "why": "Experimento mostra que decisões algorítmicas são percebidas como menos justas e menos confiáveis em tarefas que exigem julgamento humano. Explica por que adoção de algoritmos depende de percepção, não só de acurácia.", "new": false}, {"id": "W4210983635", "title": "HR analytics: An emerging field finding its place in the world alongside simmering ethical challenges", "year": 2022, "venue": "Human Resource Management Journal", "authors": ["Martin R. Edwards", "Andy Charlwood", "Nigel Guenole", "Janet H. Marler"], "cited_by": 117, "net": 3, "url": "https://doi.org/10.1111/1748-8583.12435", "theme": "analytics", "versions": [], "watch": ["Martin R. Edwards"], "score": 8, "why": "Editorial de special issue que nomeia os dois gargalos do campo: HR analytics não é keyword reconhecida e os desafios éticos seguem sem resposta. Marca a virada do subcampo para governança.", "new": false}]}, {"key": "2023+", "label": "2023 em diante", "title": "IA generativa e produtividade desigual", "summary": "A IA generativa transforma o campo em laboratório: Brynjolfsson, Li & Raymond (2023) medem +15% de produtividade em suporte, com ganhos concentrados em quem tem menos experiência; Noy & Zhang (2023) replicam em escrita profissional com -40% de tempo e +18% de qualidade. Eloundou et al. (2024) dimensionam o potencial de exposição por ocupação, e Dell'Acqua et al. (2026) mostram que o efeito é 'jagged' — ajuda em algumas tarefas, atrapalha em outras dentro do mesmo fluxo. Ao mesmo tempo, a agenda de equidade volta com força: Benson, Li & Shue (2026) mostram que 'potencial' subjetivo explica metade do gap de promoção de gênero, e Castilla & Rho (2023) que a linguagem da vaga ainda segrega. Em aberto: como auditar sistemas que mudam de versão a cada mês e como transformar ganho individual de produtividade em resultado organizacional.", "milestones": [{"id": "W4407142724", "title": "Generative AI at Work", "year": 2023, "venue": "The Quarterly Journal of Economics", "authors": ["Erik Brynjolfsson", "Danielle Li", "Lindsey Raymond"], "cited_by": 4428, "net": 12, "url": "https://doi.org/10.1093/qje/qjae044", "theme": "ai_work", "versions": ["https://doi.org/10.3386/w31161", "https://doi.org/10.2139/ssrn.4426942"], "watch": ["Danielle Li", "Erik Brynjolfsson", "Lindsey Raymond"], "score": 10, "why": "Estudo com 5.172 agentes de suporte mostra +15% de produtividade com assistente generativo, com ganhos maiores para menos experientes. É a evidência de campo mais citada sobre IA no trabalho.", "new": false}, {"id": "W4384154918", "title": "Experimental evidence on the productivity effects of generative artificial intelligence", "year": 2023, "venue": "Science", "authors": ["Shakked Noy", "Whitney Zhang"], "cited_by": 3828, "net": 18, "url": "https://doi.org/10.1126/science.adh2586", "theme": "ai_work", "versions": [], "watch": [], "score": 9, "why": "Experimento pré-registrado com 453 profissionais mostra -40% de tempo e +18% de qualidade em escrita, com redução de desigualdade entre trabalhadores. Confirma efeito causal em trabalho de colarinho branco.", "new": false}, {"id": "W4399848789", "title": "GPTs are GPTs: Labor market impact potential of LLMs", "year": 2024, "venue": "Science", "authors": ["Tyna Eloundou", "Sam Manning", "Pamela Mishkin", "Daniel Rock"], "cited_by": 2705, "net": 13, "url": "https://doi.org/10.1126/science.adj0998", "theme": "ai_work", "versions": [], "watch": [], "score": 9, "why": "Estima a exposição de ocupações e tarefas a LLMs, separando potencial de automação de complementaridade. Vira a referência para priorizar onde IA muda o desenho de trabalho.", "new": false}, {"id": "W7135096569", "title": "Navigating the Jagged Technological Frontier: Field Experimental Evidence of the Effects of Artificial Intelligence on Knowledge Worker Productivity and Quality", "year": 2026, "venue": "Organization Science", "authors": ["Fabrizio Dell’Acqua", "Edward McFowland", "Ethan Mollick", "Hila Lifshitz‐Assaf", "Katherine C. Kellogg", "Saran Rajendran", "Lisa Krayer", "François Candelon"], "cited_by": 1667, "net": 10, "url": "https://doi.org/10.1287/orsc.2025.21838", "theme": "ai_work", "versions": [], "watch": ["Ethan Mollick", "Karim R. Lakhani"], "score": 9, "why": "Experimento com 758 consultores da BCG define a 'fronteira tecnológica irregular': IA melhora algumas tarefas e piora outras no mesmo fluxo. Impede tratar IA como ganho uniforme e obriga a medir tarefa por tarefa.", "new": false}, {"id": "W7126269175", "title": "“Potential” and the Gender Promotion Gap", "year": 2026, "venue": "American Economic Review", "authors": ["Alan M. Benson", "Danielle Li", "Kelly Shue"], "cited_by": 76, "net": 2, "url": "https://doi.org/10.1257/aer.20220831", "theme": "pay_careers", "versions": [], "watch": ["Danielle Li"], "score": 9, "why": "Com 29.809 funcionários, mostra que avaliações subjetivas de 'potencial' explicam cerca de metade do gap de promoção de gênero, sem prever desempenho futuro. Coloca o julgamento gerencial, não o algoritmo, no centro do problema de equidade.", "new": false}, {"id": "W4318406331", "title": "Personnel selection: A review of ways to maximize validity, diversity, and the applicant experience", "year": 2023, "venue": "Personnel Psychology", "authors": ["Chad H. Van Iddekinge", "Filip Lievens", "Paul R. Sackett"], "cited_by": 87, "net": 0, "url": "https://doi.org/10.1111/peps.12578", "theme": "hiring", "versions": [], "watch": ["Paul R. Sackett"], "score": 9, "why": "Revisa decisões de desenvolvimento, aplicação e pontuação em seleção, incluindo uso de IA, sob a ótica de validade, diversidade e experiência do candidato. É o guia atual de desenho de processo seletivo.", "new": false}, {"id": "W4322496140", "title": "The Gendering of Job Postings in the Online Recruitment Process", "year": 2023, "venue": "Management Science", "authors": ["Emilio J. Castilla", "Hye Jin Rho"], "cited_by": 74, "net": 1, "url": "https://doi.org/10.1287/mnsc.2023.4674", "theme": "hiring", "versions": [], "watch": ["Emilio J. Castilla"], "score": 8, "why": "Combina estudo observacional e experimento de campo para mostrar que a linguagem da vaga afeta quem se candidata, mesmo em postings gender-neutral. Dá alavanca concreta para reduzir segregação ocupacional.", "new": false}, {"id": "W4401690845", "title": "People, Practices, and Productivity: A Review of New Advances in Personnel Economics", "year": 2024, "venue": "National Bureau of Economic Research", "authors": ["Mitchell Hoffman", "Christopher Stanton"], "cited_by": 27, "net": 1, "url": "https://doi.org/10.3386/w32849", "theme": "analytics", "versions": [], "watch": ["Mitchell Hoffman"], "score": 8, "why": "Survey de economia de pessoal que documenta variação persistente de produtividade entre pessoas na mesma função e defende exploração de dados e métodos novos. É o mapa mais recente de onde a evidência está e onde falta.", "new": false}]}], "now": {"summary": "O campo está em dois trilhos simultâneos. O primeiro é a IA como ferramenta de trabalho: os destaques recentes mostram que o mito do centauro não se sustenta (meta-análise de 106 experimentos com déficit agregado g = −0,23), que a gestão algorítmica é ambivalente — alocação de tarefas aumenta autonomia, monitoramento a reduz (EWCS 2024, 26.504 trabalhadores) — e que 85% dos knowledge workers usam IA mas só 6% dos executivos veem ROI claro (Atlassian). O segundo é a volta da medição de equidade e de decisão: auditorias de fairness expiram em meses, LLMs reproduzem estereótipos de gênero em descrições de vagas, e novatos com recomendação algorítmica superam especialistas de recrutamento. A pergunta prática do líder de people analytics deixou de ser 'temos dados?' e passou a ser 'nossos dados e modelos ainda valem depois da última atualização?'.", "open_questions": ["Como auditar modelos que mudam de versão a cada poucos meses?", "Ganho de produtividade individual vira resultado de negócio — ou só mais trabalho?", "Quem responde quando o algoritmo de triagem erra: RH, jurídico ou fornecedor?", "Dá para medir 'potencial' sem reproduzir o viés que ele carrega?", "Qual desenho de trabalho preserva autonomia sob monitoramento algorítmico?"]}, "threads": [{"theme": "analytics", "line": "Começa como teste de hipótese acadêmica sobre práticas de RH (Huselid, 1995) e vira, em 2016, um subcampo com revisão sistemática (Marler & Boudreau) e evidência de que gestão explica produtividade entre firmas (Bloom et al., 2014). De 2018 em diante, o debate migra de 'existe efeito?' para 'como fazer com responsabilidade' (Tambe et al., 2018; Edwards et al., 2022) e chega a 2024 pedindo exploração metodológica e dados novos (Hoffman & Stanton)."}, {"theme": "engagement", "line": "Vroom (1964), Deci & Ryan (1985) e Kahn (1990) estabelecem que engajamento é escolha individual com determinantes psicológicos. O JD-R (Demerouti et al., 2001) transforma isso em modelo operacional de demandas e recursos, revisado como teoria em 2016 (Bakker & Demerouti). A fronteira atual é o desgaste vindo de fora da organização — cliente, plataforma, turno híbrido (Baranik et al., 2014)."}, {"theme": "hiring", "line": "Schmidt & Hunter (1998) fixam a hierarquia de validade dos instrumentos de seleção, e a década de 2000 mostra que o processo real é enviesado: 50% mais callbacks para nomes brancos (Bertrand & Mullainathan, 2003) e retorno real de indicações (Fernandez et al., 2000). Em 2020 o problema é reformulado como exploração vs. explotação (Li et al., 2020), e em 2023 a agenda volta a juntar validade, diversidade e experiência do candidato (Van Iddekinge et al., 2023) e a linguagem da vaga como filtro de gênero (Castilla & Rho, 2023)."}, {"theme": "pay_careers", "line": "Lazear & Rosen (1979) explicam por que se paga por posição relativa, e Lazear (2000) mede o efeito: +44% de produtividade ao migrar para piece rate. Castilla (2008) mostra o lado sombrio — sistemas de mérito produzem gaps salariais com notas iguais —, e Benson, Li & Shue (2026) estendem o achado para 'potencial' subjetivo, que explica metade do gap de promoção de gênero."}, {"theme": "ai_work", "line": "Autor, Levy & Murnane (2001) criam a lente de tarefas rotineiras vs. não rotineiras, refinada por Acemoglu & Autor (2010) e popularizada pelo alerta de Frey & Osborne (2016). Em 2018–2019 o foco vira controle e deslocamento: os 6 Rs de Kellogg et al., o gig work de Wood et al. e os efeitos negativos de robôs sobre emprego e salários (Acemoglu & Restrepo). De 2023 em diante, a IA generativa desloca a pergunta de 'quantos empregos' para 'quanto de produtividade, para quem' — com efeitos heterogêneos e fronteira irregular (Brynjolfsson et al., 2023; Noy & Zhang, 2023; Dell'Acqua et al., 2026)."}]}, "annual": {"2025": {"year": 2025, "partial": false, "generated": "2026-11-17", "model": "deepseek-ai/DeepSeek-V4.1-Flash", "overview": "2025 foi o ano em que a IA saiu do piloto e virou variável de gestão: experimentos de campo em empresas reais mostraram ganhos de performance, mas também efeitos desiguais entre trabalhadores. Em paralelo, a pesquisa em people analytics dobrou (+105%, 411→842) e a de seleção por machine learning cresceu +58% (3.207→5.076), sinalizando profissionalização da função. Skills-based hiring (+90%) e algorithmic management (+126%) foram os eixos que mais tensionaram as práticas tradicionais de RH. A agenda de governança — viés em LLMs e misreporting de pay gap — ganhou peso acadêmico e regulatório. Enquanto isso, o trabalho híbrido se estabilizou em um novo equilíbrio, de cerca de 1 dia por semana em média global.", "trends": [{"title": "IA generativa vira infraestrutura de gestão — e a evidência vem de campo", "text": "Publicações em generative AI/LLM cresceram +59% (223→354) e as de algorithmic management/workplace surveillance +126% (253→571, 2,3x). A evidência migrou do ensaio para o experimento: \"The Cybernetic Teammate\" rodou teste de campo com 776 profissionais da Procter & Gamble, e \"How and for whom using generative AI affects creativity\" mostrou que o ganho de criatividade depende das estratégias metacognitivas do funcionário."}, {"title": "People analytics e seleção por machine learning se profissionalizam", "text": "People analytics/HR analytics cresceu +105% (411→842, 2,0x) e personnel selection/machine learning +58% (3.207→5.076, 1,6x). A fronteira descrita em \"A Comprehensive Survey of AI Techniques for Talent Analytics\" e em \"Hiring as Exploration\" é a passagem da descrição de dados para a decisão algorítmica — inclusive com exploração deliberada de grupos sub-representados no lugar de pura explotação de histórico."}, {"title": "Skills-based hiring deixa de ser experimento e vira política de contratação", "text": "O subtema skills-based hiring/skills taxonomy cresceu +90% (1.487→2.827, 1,9x). \"Skills or degree? The rise of skill-based hiring for AI and green jobs\" analisou cerca de 11 milhões de vagas online no Reino Unido e encontrou adoção de contratação por competências em IA e empregos verdes; \"Reskilling the Workforce for AI\" mostra que a IA complementa expertise de domínio quando o letramento algorítmico é difundido, e não concentrado em especialistas de TI."}, {"title": "Governança, viés e ética dos dados de pessoas entram na pauta central", "text": "Diversity, equity/workplace inclusion cresceu +50% (609→916) e pay equity/gender pay gap +19% (937→1.114). \"Measuring gender and racial biases in large language models\" testou GPT-3.5 Turbo, GPT-4o, Gemini 1.5 Flash, Claude 3.5 Sonnet e Llama 3-70b em triagem de currículos, e \"Misreporting of Mandatory ESG Disclosures\" encontrou empresas reportando estatísticas de gênero matematicamente impossíveis — evidência de ESG-washing em dados de pessoas."}, {"title": "Redesenho do trabalho: híbrido estabilizado, hierarquia e aprendizagem sob escrutínio", "text": "Remote/hybrid work cresceu +29% (3.141→4.051) e organizational network analysis/workplace collaboration +150% (26→65, 2,5x). \"The global persistence of work from home\" mostra o WFH estabilizado em cerca de 1 dia por semana entre 2023 e o início de 2025, enquanto \"Are less hierarchical firms organized around stronger cultures?\" associa menor hierarquia a culturas organizacionais mais fortes, com base em 1,5 milhão de avaliações do Glassdoor."}], "innovation": "A inovação continua concentrada na academia: 611 dos 687 trabalhos (88,9%) vêm de universidades, contra apenas 16 (2,3%) de empresas. NBER (34), Stanford (33), MIT (27) e Harvard (20) lideram a produção, com EUA (183), Reino Unido (79) e China (75) dominando por país; o Brasil aparece com 22 trabalhos, bem atrás do topo da lista. No lado corporativo, a Procter & Gamble se destaca (8 trabalhos) por sediar experimentos de campo com IA, seguida por Meta (4), enquanto governo e reguladores respondem por 33 trabalhos (4,8%).", "highlights": [{"title": "Hiring as Exploration", "original_title": "Hiring as Exploration", "url": "https://doi.org/10.1093/restud/rdaf040", "venue": "The Review of Economic Studies", "date": "2025-05-26", "authors": ["Danielle Li", "Lindsey Raymond", "Peter Bergman"], "institutions": ["National Bureau of Economic Research", "Massachusetts Institute of Technology", "The University of Texas at Austin"], "watch_authors": ["Danielle Li", "Lindsey Raymond"], "score": 10, "theme": "hiring", "region": "", "cited_by": 31, "velocity": 1.72, "why": "Formula a contratação como um problema de bandit contextual: algoritmos de triagem baseados só em supervised learning exploram histórico e ignoram grupos sub-representados. O algoritmo proposto, que valoriza o potencial estatístico do candidato, melhora a qualidade das contratações em uma empresa Fortune 500 de serviços profissionais."}, {"title": "The Diffusion of New Technologies", "original_title": "The Diffusion of New Technologies", "url": "https://doi.org/10.1093/qje/qjaf002", "venue": "The Quarterly Journal of Economics", "date": "2025-01-09", "authors": ["Aakash Kalyani", "Nicholas Bloom", "Marcela Carvalho", "Tarek A. Hassan", "Josh Lerner", "Ahmed Tahoun"], "institutions": ["Federal Reserve Bank of St. Louis", "National Bureau of Economic Research", "Stanford University", "Harvard University", "London Business School", "Boston University"], "watch_authors": ["Nicholas Bloom"], "score": 9, "theme": "ai_work", "region": "", "cited_by": 163, "velocity": 7.41, "why": "Usa análise textual de patentes, vagas e earnings calls para mostrar que 56% das tecnologias economicamente mais impactantes vêm de apenas duas regiões dos EUA e que a difusão geográfica dos empregos leva cerca de 50 anos. É insumo direto para planejamento de talento e decisões de localização de força de trabalho."}, {"title": "How and for whom using generative AI affects creativity", "original_title": "How and for whom using generative AI affects creativity: A field experiment.", "url": "https://doi.org/10.1037/apl0001296", "venue": "Journal of Applied Psychology", "date": "2025-06-16", "authors": ["Shuhua Sun", "Zhuyi Angelina Li", "Maw‐Der Foo", "Jing Zhou", "Jackson G. Lu"], "institutions": ["Tulane University", "Renmin University of China", "Nanyang Technological University", "Rice University", "Massachusetts Institute of Technology"], "watch_authors": [], "score": 9, "theme": "ai_work", "region": "", "cited_by": 92, "velocity": 5.41, "why": "Experimento de campo em uma consultoria de tecnologia mostra que a assistência de LLM aumenta criatividade ao prover recursos cognitivos — mas o efeito é maior em quem tem estratégias metacognitivas elevadas. Contraria a leitura de que a IA nivela todo mundo."}, {"title": "The Cybernetic Teammate", "original_title": "The Cybernetic Teammate: A Field Experiment on Generative AI Reshaping Teamwork and Expertise", "url": "https://doi.org/10.3386/w33641", "venue": "National Bureau of Economic Research", "date": "2025-04-01", "authors": ["Fabrizio Dell’Acqua", "Charles Ayoubi", "Hila Lifshitz‐Assaf", "Raffaella Sadun", "Ethan Mollick", "Lilach Mollick", "Yi Han", "Jeff Goldman"], "institutions": ["National Bureau of Economic Research"], "watch_authors": ["Ethan Mollick", "Karim R. Lakhani", "Raffaella Sadun"], "score": 9, "theme": "ai_work", "region": "", "cited_by": 102, "velocity": 5.37, "why": "Experimento pré-registrado com 776 profissionais da P&G em desafios reais de inovação: indivíduos com IA igualaram o desempenho de times sem IA. Redefine as premissas sobre colaboração, compartilhamento de expertise e engajamento social no trabalho."}, {"title": "Reskilling the Workforce for AI: Domain Expertise and Algorithmic Literacy", "original_title": "Reskilling the Workforce for AI: Domain Expertise and Algorithmic Literacy", "url": "https://doi.org/10.1287/mnsc.2022.03968", "venue": "Management Science", "date": "2025-09-30", "authors": ["Prasanna B. Tambe"], "institutions": ["University of Pennsylvania"], "watch_authors": ["Prasanna Tambe"], "score": 9, "theme": "learning", "region": "", "cited_by": 73, "velocity": 5.21, "why": "Mostra que IA e algoritmos são complementares à expertise de domínio e geram mais valor quando o letramento algorítmico é amplamente difundido, não confinado a especialistas. Ferramentas no-code e em linguagem natural aceleram essa dispersão e mudam o desenho de programas de reskilling."}, {"title": "The global persistence of work from home", "original_title": "The global persistence of work from home", "url": "https://doi.org/10.1073/pnas.2509892122", "venue": "Proceedings of the National Academy of Sciences", "date": "2025-07-03", "authors": ["Cevat Giray Aksoy", "Jose Maria Barrero", "Nicholas Bloom", "Steven J. Davis", "Mathias
