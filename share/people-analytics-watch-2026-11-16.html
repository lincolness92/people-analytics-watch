<head>

  <style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --ink: #1d1b18;
  --ink-2: #4a463f;
  --muted: #807a70;
  --line: #e4dfd5;
  --accent: #b4431f;
  --accent-soft: #f6e4dc;
  --star: #a8730b;
  --star-soft: #f7ecd2;
  --chip: #efebe3;
  --score-hi: #1f6f4a;
  --score-mid: #8a6d12;
  --score-lo: #7a746a;
  --serif: "Iowan Old Style", "Charter", "Source Serif Pro", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161513;
    --surface: #1f1d1a;
    --ink: #ece8e1;
    --ink-2: #c4beb3;
    --muted: #8f897f;
    --line: #34312c;
    --accent: #ec8a63;
    --accent-soft: #3a2519;
    --star: #e2b24f;
    --star-soft: #382c14;
    --chip: #2a2824;
    --score-hi: #6fcf9c;
    --score-mid: #e2c25b;
    --score-lo: #9d978d;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 var(--sans);
}
a { color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }

/* header */
.top {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 20px; font-weight: 600; }
.brand em { color: var(--accent); font-style: italic; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tabs a {
  text-decoration: none; font-size: 14px; color: var(--ink-2);
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
}
.tabs a:hover { background: var(--chip); }
.tabs a.active { background: var(--ink); color: var(--bg); }
.topic-switch { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; max-width: 100%; }

main { padding-top: 28px; padding-bottom: 40px; min-height: 70vh; }

/* digest header */
.day-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.day-nav button, .day-nav select {
  font: inherit; font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 5px 10px; cursor: pointer;
}
.day-nav button:disabled { opacity: .35; cursor: default; }
h1.day {
  font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 5vw, 40px);
  line-height: 1.15; margin: 10px 0 6px; letter-spacing: -0.01em;
}
.dek { color: var(--ink-2); margin: 0 0 22px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 28px; }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* trend callout */
.trend {
  background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; margin: 0 0 32px;
  font-family: var(--serif); font-size: 17px; line-height: 1.55;
}
.trend .label { display: block; font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }

/* theme sections */
.theme-h {
  font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-2); margin: 34px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 12px;
}
.card.watch { border-left: 3px solid var(--star); }
.card-top { display: flex; gap: 12px; align-items: flex-start; }
.card h3 { font-family: var(--serif); font-size: 19px; line-height: 1.3; margin: 0; font-weight: 600; flex: 1; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.score {
  flex: none; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor;
}
.score.hi { color: var(--score-hi); }
.score.mid { color: var(--score-mid); }
.score.lo { color: var(--score-lo); }
.meta { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }
.meta .star { color: var(--star); background: var(--star-soft); padding: 1px 7px; border-radius: 999px; font-weight: 600; margin-right: 4px; }
.summary { margin: 0; color: var(--ink-2); }
.summary strong { color: var(--ink); }
.orig { font-size: 12px; color: var(--muted); margin-top: 8px; font-style: italic; }

.quick { margin-top: 30px; }
.quick ul { padding-left: 18px; margin: 0; }
.quick li { margin-bottom: 8px; color: var(--ink-2); }
.quick li a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }

/* filters */
.filters { display: grid; gap: 12px; margin-bottom: 22px; }
.search {
  width: 100%; font: inherit; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--chip); color: var(--ink-2);
  border-radius: 999px; padding: 4px 11px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }
.filter-row input[type=range] { accent-color: var(--accent); }
.count { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.date-tag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* trends timeline */
.timeline { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 20px; }
.tl-item { position: relative; margin-bottom: 24px; }
.tl-item::before {
  content: ""; position: absolute; left: -27px; top: 7px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
}
.tl-item a.d { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; }
.tl-item p { margin: 4px 0 0; font-family: var(--serif); font-size: 17px; }

/* watchlist */
.wl-section { margin-bottom: 36px; }
.wl-section h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 4px; }
.region-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 22px 0 10px; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.person { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.person .n { font-weight: 650; }
.person .i { font-size: 13px; color: var(--muted); }
.person .a { font-size: 13px; color: var(--accent); margin-top: 4px; }
.person .w { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.person .l { font-size: 12px; margin-top: 6px; display: flex; gap: 10px; }
.person .l a { color: var(--muted); }
.person .hits { font-size: 12px; margin-top: 6px; color: var(--star); font-weight: 600; }
.list-simple { padding-left: 18px; }
.list-simple li { margin-bottom: 8px; color: var(--ink-2); }
.list-simple li b { color: var(--ink); }
.list-simple .hits { font-size: 12px; color: var(--star); font-weight: 600; white-space: nowrap; }

.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); padding-top: 16px; padding-bottom: 32px; border-top: 1px solid var(--line); }

@media (max-width: 560px) {
  .card { padding: 14px; }
  .card h3 { font-size: 17px; }
  .brand { font-size: 18px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chip { white-space: nowrap; }
}
</style>

uthors": [], "watch_journal": true, "watch_source": "", "origin": "journal", "cited_by": 0, "score": 8, "theme": "ai_work", "summary": "Adoção de robôs industriais em 14 países europeus (2006–2018) reduziu salários relativos, emprego e renda de mercado de grupos mais expostos. Ao simular o efeito no EUROMOD, o impacto sobre desigualdade de renda domiciliar disponível foi pequeno porque tributos e transferências absorveram o choque; diversificação da renda familiar ajudou, mas pouco para a desigualdade. People analytics deve medir efeitos distributivos e o papel das políticas de proteção, não só a exposição à automação."}, {"key": "doi:10.21203/rs.3.rs-11446329/v1", "title": "Gestão algorítmica como desenho de trabalho ambivalente", "original_title": "Algorithmic Management as a Double-Edged Form of Digital Work Design: Job Demands, Autonomy and Employee Outcomes across 35 European Countries", "url": "https://doi.org/10.21203/rs.3.rs-11446329/v1", "venue": "Research Square", "date": "2026-11-11", "authors": ["Fahri Alp Erdoğan", "Mehmet Alper Akdemir", "Murat Sağbaş"], "institutions": ["National Defence University", "Ankara Bilim Üniversitesi", "Bahçeşehir Cyprus University"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 7, "theme": "ai_work", "summary": "Modelos SEM com 26.504 trabalhadores de 35 países (EWCS 2024) separaram três funções da gestão algorítmica: alocação de tarefas, agendamento e monitoramento. Todas elevaram intensidade de trabalho; alocação aumentou autonomia, enquanto monitoramento a reduziu, com efeitos indiretos opostos no engajamento e intenção de sair. A lição é **diferenciar** funções algorítmicas: monitoramento tende a prejudicar autonomia e engajamento, alocação pode ser mais ambivalente."}, {"key": "doi:10.1002/job.70134", "title": "Reuniões 1:1 e engajamento: qualidade importa mais que quantidade", "original_title": "One Meeting That Should Not Be an Email: Manager–Direct Repor nça protege mais que maximizar dias no escritório."}, {"key": "doi:10.13075/ijomeh.1896.02881", "title": "Trabalho de plataforma: demandas e bem-estar por tipo", "original_title": "Is gig work the same for everyone? Psychosocial job demands, resources, and well-being in platform work across Europe: evidence from the GIG-OSH study", "url": "https://doi.org/10.13075/ijomeh.1896.02881", "venue": "International Journal of Occupational Medicine and Environmental Health", "date": "2026-11-12", "authors": ["Dorota Merecz‐Kot", "Agnieszka Lipińska-Grobelny", "Olga Zwardoń-Kuchciak", "Marta Znajmiecka-Sikora", "Jessie Gevaert", "Filippa Lundh", "Theo Bodin", "Lluís Mangot‐Sala", "Nuria Matilla Santander", "Emelie Thern", "Mireia Julià", "Sangwoo Lee"], "institutions": ["University of Łódź", "Vrije Universiteit Brussel", "Research Foundation - Flanders", "Karolinska Institutet", "Region Stockholm", "Universitat de Vic - Universitat Central de Catalunya"], "watch_authors": [], "watch_journal": false, "watch_source": "", "origin": "busca", "cited_by": 0, "score": 7, "theme": "engagement", "summary": "Estudo GIG-OSH com 3.299 trabalhadores de plataforma em 7 países europeus (1.476 presenciais, 1.823 web) aplicou o modelo JD-R. Trabalhadores presenciais relataram mais situações emocionalmente perturbadoras, agressão, violência, discriminação e assédio sexual; ausência de multas e proteção contra reservas fraudulentas foi mais favorável no trabalho web. A lição é segmentar políticas de **segurança psicossocial** e proteções algorítmicas por tipo de plataforma, não tratar gig work como homogêneo."}, {"key": "doi:10.1037/apl0001436", "title": "Intervenções contra viés de ameaça em gestores", "original_title": "Counteracting threat bias: A longitudinal field experiment testing two interventions that expand managerial attention to opportunities under economic threat.", "url": "https://doi.org/10.1037/apl0001436", "venue": "Journal of Applied Psychology", "date": "2026-11-09", "authors <script>
(() => {
  "use strict";

  const app = document.getElementById("app");
  let DATA = null;
  const state = { q: "", themes: new Set(), minScore: 6, onlyWatch: false };

  // ---------- helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>");
  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
  const fmtDate = (iso, opts = { day: "2-digit", month: "long", year: "numeric" }) =>
    new Date(iso + "T12:00:00").toLocaleDateString("pt-BR", opts);
  const scoreClass = (s) => (s >= 8 ? "hi" : s >= 6 ? "mid" : "lo");
  const themeLabel = (k) => (DATA.themes[k] || k);
  // "9 a 16 de novembro de 2026" (or "28 de outubro a 3 de novembro de 2026") when the digest covers a period.
  const fmtPeriod = (d, short = false) => {
    if (!d.period) return fmtDate(d.date, short ? { day: "2-digit", month: "short", year: "numeric" } : undefined);
    const a = new Date(d.period.from + "T12:00:00"), b = new Date(d.period.to + "T12:00:00");
    const m = short ? "short" : "long";
    const left = a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear()
      ? a.toLocaleDateString("pt-BR", { day: "numeric" })
      : a.toLocaleDateString("pt-BR", { day: "numeric", month: m });
    return `${left} a ${b.toLocaleDateString("pt-BR", { day: "numeric", month: m, year: "numeric" })}`;
  };
  const authorsShort = (a) => (!a || !a.length ? "" : a.length > 3 ? `${a.slice(0, 3).join(", ")} et al.` : a.join(", "));

  function card(it, { showDate = false } = {}) {
    const meta = [];
    if (it.watch_authors && it.watch_authors.length) {
      meta.push(it.watch_authors.map((n) => `<span class="star">⭐ ${esc(n)}</span>`).join(""));
    }
    if (it.watch_source) meta.push(`<span class="star">📌 ${esc(it.watch_source)}</span>`);
    if (showDate) meta.push(`<span class="date-tag">${esc(fmtDate(it._date, { day: "2-digit", month: "short", year: "numeric" }))}</span>`);
    meta.push(esc(it.venue || it.origin));
    const au = authorsShort(it.authors);
    if (au) meta.push(esc(au));
    if (it.cited_by) meta.push(`cit: ${it.cited_by}`);
    const orig = it.original_title && it.original_title !== it.title
      ? `<div class="orig">${esc(it.original_title)}</div>` : "";
    return `
      <article class="card${it.watch_authors && it.watch_authors.length ? " watch" : ""}">
        <div class="card-top">
          <h3><a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
          <span class="score ${scoreClass(it.score)}" title="nota de relevância × qualidade">${it.score}/10</span>
        </div>
        <div class="meta">${meta.join(" · ")}</div>
        <p class="summary">${md(it.summary)}</p>
        ${orig}
      </article>`;
  }

  function setTab(tab) {
    document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
  }

  // ---------- views ----------
  function viewDigest(date) {
    setTab("digest");
    const ds = DATA.digests;
    if (!ds.length) { app.innerHTML = `<div class="empty">Nenhum digest ainda.</div>`; return; }
    const idx = Math.max(0, date ? ds.findIndex((d) => d.date === date) : 0);
    const d = ds[idx];
    const newer = ds[idx - 1], older = ds[idx + 1];
    const options = ds.map((x) => `<option value="${x.date}"${x.date === d.date ? " selected" : ""}>${esc(fmtPeriod(x, true))}</option>`).join("");

    let html = `
      <div class="day-nav">
        <button data-go="${older ? older.date : ""}" ${older ? "" : "disabled"} aria-label="Digest anterior">← anterior</button>
        <select id="day-select" aria-label="Escolher digest">${options}</select>
        <button data-go="${newer ? newer.date : ""}" ${newer ? "" : "disabled"} aria-label="Próximo digest">próximo →</button>
      </div>
      <h1 class="day">${esc(fmtPeriod(d))}</h1>
      ${d.headline ? `<p class="dek">${md(d.headline.charAt(0).toUpperCase() + d.headline.slice(1))}</p>` : ""}
      <div class="stats">
        <span><b>${d.stats.candidates}</b> candidatos novos</span>
        <span><b>${d.stats.triaged}</b> avaliados</span>
        <span><b>${d.items.length}</b> selecionados</span>
        ${d.model ? `<span>modelo: ${esc(d.model.split("/").pop())}</span>` : ""}
      </div>`;
    if (d.trend) html += `<div class="trend"><span class="label">🔥 Tendência do período</span>${md(d.trend)}</div>`;
    if (!d.items.length) html += `<div class="empty">Nada acima da barra neste período.</div>`;

    for (const key of Object.keys(DATA.themes)) {
      const group = d.items.filter((it) => it.theme === key);
      if (!group.length) continue;
      html += `<h2 class="theme-h">${esc(themeLabel(key))}</h2>` + group.map((it) => card(it)).join("");
    }
    if (d.quick && d.quick.length) {
      html += `<section class="quick"><h2 class="theme-h">Menções rápidas</h2><ul>` +
        d.quick.map((q) => `<li><a href="${esc(safeUrl(q.url))}" target="_blank" rel="noopener">${esc(q.title)}</a>${q.note ? ` — ${md(q.note)}` : ""}</li>`).join("") +
        `</ul></section>`;
    }
    app.innerHTML = html;
    app.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.go) location.hash = `#/d/${b.dataset.go}`;
    }));
    document.getElementById("day-select").addEventListener("change", (e) => { location.hash = `#/d/${e.target.value}`; });
  }

  function allItems() {
    const out = [];
    for (const d of DATA.digests) for (const it of d.items) out.push({ ...it, _date: d.date });
    return out;
  }

  function viewArchive() {
    setTab("arquivo");
    const chips = Object.entries(DATA.themes).map(([k, v]) =>
      `<button class="chip" data-theme="${k}" aria-pressed="${state.themes.has(k)}">${esc(v)}</button>`).join("");
    app.innerHTML = `
      <h1 class="day">Arquivo</h1>
      <p class="dek">Todos os papers selecionados, de todos os digests.</p>
      <div class="filters">
        <input class="search" id="q" type="search" placeholder="Buscar por título, autor, venue, resumo…" value="${esc(state.q)}">
        <div class="chips">${chips}</div>
        <div class="filter-row">
          <label>Nota mínima <input id="min" type="range" min="0" max="10" value="${state.minScore}"> <b id="minv">${state.minScore}</b></label>
          <label><input id="ow" type="checkbox" ${state.onlyWatch ? "checked" : ""}> só da watchlist ⭐📌</label>
        </div>
      </div>
      <div class="count" id="count"></div>
      <div id="results"></div>`;

    const items = allItems();
    const render = () => {
      const q = state.q.trim().toLowerCase();
      const res = items.filter((it) =>
        it.score >= state.minScore &&
        (!state.themes.size || state.themes.has(it.theme)) &&
        (!state.onlyWatch || (it.watch_authors && it.watch_authors.length) || it.watch_source) &&
        (!q || [it.title, it.original_title, it.summary, it.venue, (it.authors || []).join(" "), (it.institutions || []).join(" ")]
          .join(" ").toLowerCase().includes(q)));
      document.getElementById("count").textContent = `${res.length} de ${items.length} papers`;
      document.getElementById("results").innerHTML = res.length
        ? res.map((it) => card(it, { showDate: true })).join("")
        : `<div class="empty">Nenhum paper com esses filtros.</div>`;
    };
    document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
    document.getElementById("min").addEventListener("input", (e) => {
      state.minScore = +e.target.value; document.getElementById("minv").textContent = e.target.value; render();
    });
    document.getElementById("ow").addEventListener("change", (e) => { state.onlyWatch = e.target.checked; render(); });
    app.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
      const k = c.dataset.theme;
      state.themes.has(k) ? state.themes.delete(k) : state.themes.add(k);
      c.setAttribute("aria-pressed", state.themes.has(k));
      render();
    }));
    render();
  }

  function viewTrends() {
    setTab("tendencias");
    const ds = DATA.digests.filter((d) => d.trend);
    app.innerHTML = `
      <h1 class="day">Tendências</h1>
      <p class="dek">A síntese de cada digest, em ordem cronológica reversa.</p>
      ${ds.length ? `<div class="timeline">${ds.map((d) => `
        <div class="tl-item">
          <a class="d" href="#/d/${d.date}">${esc(fmtPeriod(d))}</a>
          <p>${md(d.trend)}</p>
        </div>`).join("")}</div>` : `<div class="empty">Sem tendências ainda.</div>`}`;
  }

  function viewWatchlist() {
    setTab("watchlist");
    const wl = DATA.watchlist || {};
    const hits = {};
    for (const it of allItems()) for (const n of [...(it.watch_authors || []), ...(it.watch_source ? [it.watch_source] : [])]) hits[n] = (hits[n] || 0) + 1;
    const people = wl.researchers || [];
    const known = ["EUA", "Europa", "China/Ásia", "Brasil"];
    const regions = [...known, ...new Set(people.map((p) => p.region || "Outros").filter((r) => !known.includes(r)))];
    const L = Object.assign({ researchers: "Pesquisadores", journals: "Journals", centers: "Centros & laboratórios",
      practitioners: "Praticantes & fontes" }, DATA.topic.watchlist_labels || {});
    let html = `
      <h1 class="day">Watchlist</h1>
      <p class="dek">Referências monitoradas. Papers novos desses autores entram na triagem com bônus e ganham ⭐; posts, relatórios e normas das fontes ganham 📌.</p>
      <section class="wl-section"><h2>${esc(L.researchers)} <span class="muted">(${people.length})</span></h2>`;
    for (const r of regions) {
      const group = people.filter((p) => (p.region || "Outros") === r);
      if (!group.length) continue;
      html += `<h3 class="region-h">${esc(r)} · ${group.length}</h3><div class="people">` + group.map((p) => {
        const links = Object.entries(p.links || {}).filter(([, u]) => u)
          .map(([k, u]) => `<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener">${esc(k)}</a>`);
        if (p.openalex_id) links.push(`<a href="https://openalex.org/authors/${esc(p.openalex_id)}" target="_blank" rel="noopener">openalex</a>`);
        return `<div class="person">
          <div class="n">${esc(p.name)}</div>
          <div class="i">${esc(p.institution || "")}</div>
          ${p.area ? `<div class="a">${esc(p.area)}</div>` : ""}
          ${p.why ? `<div class="w">${esc(p.why)}</div>` : ""}
          ${hits[p.name] ? `<div class="hits">⭐ ${hits[p.name]} paper(s) no arquivo</div>` : ""}
          ${links.length ? `<div class="l">${links.join("")}</div>` : ""}
        </div>`;
      }).join("") + `</div>`;
    }
    html += `</section>`;
    const simple = (title, arr, nameKey, subKey) => !arr || !arr.length ? "" : `
      <section class="wl-section"><h2>${title} <span class="muted">(${arr.length})</span></h2><ul class="list-simple">` +
      arr.map((x) => {
        const name = x.url ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener"><b>${esc(x[nameKey])}</b></a>` : `<b>${esc(x[nameKey])}</b>`;
        const hit = hits[x[nameKey]] ? ` <span class="hits">📌 ${hits[x[nameKey]]} no arquivo</span>` : "";
        return `<li>${name}${subKey && x[subKey] ? ` <span class="muted">· ${esc(x[subKey])}</span>` : ""}${x.why ? ` — ${esc(x.why)}` : ""}${hit}</li>`;
      }).join("") + `</ul></section>`;
    html += simple(esc(L.journals), wl.journals, "name");
    html += simple(esc(L.centers), wl.centers, "name", "institution");
    html += simple(esc(L.practitioners), wl.practitioners, "name", "org");
    app.innerHTML = html;
  }

  // ---------- topic identity + switcher ----------
  function setupTopic(d) {
    const t = d.topic || {};
    const b = t.brand || {};
    if (t.name) document.title = t.name;
    if (b.mark) document.getElementById("brand-mark").textContent = b.mark;
    if (b.text) document.getElementById("brand-text").innerHTML = `${esc(b.text)} <em>${esc(b.em || "Watch")}</em>`;
    const sw = document.getElementById("topic-switch");
    if (sw && d.topics && d.topics.length > 1) {
      sw.innerHTML = d.topics.map((x) => `<option value="${esc(x.slug)}"${x.slug === t.slug ? " selected" : ""}>${esc(x.name)}</option>`).join("");
      sw.hidden = false;
      sw.addEventListener("change", (e) => { location.href = `../${e.target.value}/index.html`; });
    }
  }

  // ---------- router ----------
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const [a, b] = h.split("/");
    if (a === "d") viewDigest(b);
    else if (a === "arquivo") viewArchive();
    else if (a === "tendencias") viewTrends();
    else if (a === "watchlist") viewWatchlist();
    else viewDigest();
    window.scrollTo(0, 0);
  }

  Promise.resolve(JSON.parse(document.getElementById("pa-data").textContent))
    .then((d) => {
      DATA = d;
      setupTopic(d);
      const n = d.digests.reduce((s, x) => s + x.items.length, 0);
      document.getElementById("foot-meta").textContent = `${d.digests.length} digests · ${n} papers · atualizado em ${fmtDate(d.generated)}`;
      window.addEventListener("hashchange", route);
      route();
    })
    .catch((e) => { app.innerHTML = `<div class="empty">Não foi possível carregar os dados (${esc(e.message)}).</div>`; });
})();
</script>
</body>
</html>
